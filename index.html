<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Их Хөрөнгө</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --night-indigo: #161616;
    --night-indigo-deep: #060606;
    --steppe-gold: #D4AF37;
    --seal-red: #C1553A;
    --parchment: #F2E7C6;
    --grass-green: #2E9E6B;
    --slate-line: #33291A;
    --grp-A: #E8317A;
    --grp-B: #14C088;
    --grp-C: #8A4FE8;
    --grp-D: #FF6B1F;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% -10%, #1c1710 0%, var(--night-indigo-deep) 60%), var(--night-indigo-deep);
    color: var(--parchment);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }
  .eyebrow { font-size: 10.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--steppe-gold); text-align: center; opacity: 0.85; margin-bottom: 6px; }
  .screen { max-width: 480px; margin: 0 auto; padding: 48px 20px 30px; }
  .seal-title {
    font-family: 'Cinzel', serif; font-weight: 800; font-size: 27px; letter-spacing: 2px;
    background: linear-gradient(180deg, #F7E7B0 0%, #D4AF37 45%, #A9822A 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-transform: uppercase; text-align: center; margin-bottom: 4px;
    filter: drop-shadow(0 2px 6px rgba(212,175,55,0.2));
  }
  .subtitle { text-align: center; color: #9AA6BE; font-size: 13px; margin-bottom: 8px; }
  .motif-strip { text-align: center; font-size: 15px; letter-spacing: 6px; opacity: 0.55; margin: 14px 0 28px; }
  .landing-card {
    background: linear-gradient(160deg, #1c1c1c 0%, #131313 100%);
    border: 1px solid var(--slate-line); border-radius: 16px; padding: 22px 20px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  label { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #8b96b0; margin: 18px 0 7px; }
  input[type=text] {
    width: 100%; padding: 13px 14px; border-radius: 8px; border: 1px solid var(--slate-line);
    background: var(--night-indigo); color: var(--parchment); font-size: 16px; font-family: 'Work Sans', sans-serif;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type=text]:focus { outline: none; border-color: var(--steppe-gold); box-shadow: 0 0 0 3px rgba(212,162,78,0.15); }
  input[type=text]::placeholder { color: #5c6a86; }
  .btn {
    display: block; width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 8px;
    font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.5px;
    cursor: pointer; text-align: center; transition: transform 0.08s ease, filter 0.15s ease;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn-primary { background: linear-gradient(180deg, #E0B266, var(--steppe-gold)); color: var(--night-indigo-deep); box-shadow: 0 3px 0 #9c7735; }
  .btn-primary:active:not(:disabled) { box-shadow: 0 1px 0 #9c7735; }
  .btn-secondary { background: var(--night-indigo); border: 1px solid var(--slate-line); color: var(--parchment); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .divider { text-align: center; color: #5c6a86; font-size: 10.5px; margin: 24px 0; letter-spacing: 1.5px; text-transform: uppercase; }
  .error-msg { color: #E28E7D; font-size: 13px; margin-top: 8px; min-height: 16px; text-align: center; }
  .wait-list { margin: 18px 0; }
  .wait-player { display: flex; align-items: center; gap: 12px; background: var(--night-indigo); border: 1px solid var(--slate-line); border-radius: 10px; padding: 11px 14px; margin-bottom: 8px; animation: popIn 0.25s ease; }
  .wait-token {
    font-size: 26px; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--token-color, var(--steppe-gold)) 55%, white 45%) 0%, var(--night-indigo-deep) 78%);
    border: 2.5px solid var(--token-color, var(--steppe-gold));
    box-shadow: inset -2px -2px 3px rgba(0,0,0,0.55), inset 2px 2px 3px rgba(255,255,255,0.3), 0 3px 5px rgba(0,0,0,0.5);
  }
  .room-code-box { text-align: center; margin: 20px 0; padding: 18px 10px; border: 1.5px dashed var(--steppe-gold); border-radius: 12px; background: rgba(212,162,78,0.05); position: relative; }
  .room-code-box::before { content: '\26FA'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--night-indigo-deep); padding: 0 8px; font-size: 16px; }
  .room-code { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: var(--steppe-gold); }

  /* Game screen */
  .game-wrap { max-width: 1400px; margin: 0 auto; padding: 12px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 6px 16px; }
  .top-bar .seal-title { font-size: 18px; margin: 0; text-align: left; }
  .top-bar-right { display: flex; align-items: center; gap: 10px; }
  .turn-indicator {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    background: linear-gradient(160deg, #1c1c1c 0%, #131313 100%);
    border: 1px solid var(--steppe-gold); border-radius: 20px; padding: 8px 18px; color: var(--parchment);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .turn-indicator .pulse-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--grass-green); margin-right: 6px; animation: pulse 1.4s infinite; }
  .debug-toggle {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; background: var(--night-indigo);
    border: 1px solid var(--slate-line); border-radius: 16px; padding: 6px 12px; color: #8b96b0; cursor: pointer;
  }
  .debug-toggle.on { border-color: #FF5252; color: #FF5252; }

  .game-layout { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 20px; }
  @media (max-width: 900px) { .game-layout { grid-template-columns: 1fr; } }

  .board-outer { display: flex; justify-content: center; }
  .board-wrap {
    position: relative;
    width: min(96vw, 1400px);
    aspect-ratio: 1672 / 941;
    user-select: none;
    margin: 0 auto;
  }
  .board-image { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; border-radius: 14px; }

  .tile {
    position: absolute; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #18382d; font-size: clamp(6.5px, 0.72vw, 12px); font-weight: 800; text-align: center;
    cursor: pointer; border: 2px solid transparent; border-radius: 10px;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    padding: 2px;
  }
  .tile small { margin-top: 2px; font-size: 0.82em; font-family: 'JetBrains Mono', monospace; opacity: 0.85; }
  .tile:hover { z-index: 6; transform: translateY(-4px) scale(1.08); background: rgba(255,255,255,0.5); border-color: #ffd95a; box-shadow: 0 10px 22px rgba(0,0,0,0.35); }
  .tile:active { transform: translateY(-1px) scale(0.97); }
  .tile.owned { box-shadow: inset 0 0 0 3px var(--owner-color, var(--steppe-gold)); background: rgba(255,255,255,0.28); }
  .tile.group-complete { box-shadow: inset 0 0 0 3px var(--owner-color, var(--steppe-gold)), 0 0 14px var(--owner-color, var(--steppe-gold)); }
  .tile.active-position { animation: activePulse 1.3s infinite; }
  .tile.corner-tile { font-size: clamp(6px, 0.6vw, 10px); background: rgba(255,255,255,0.12); }
  .tile-group-tab {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 60%; height: 5px; border-radius: 3px;
  }
  .owner-badge {
    position: absolute; top: 1px; right: 1px; z-index: 4;
    width: clamp(10px, 1.6vw, 15px); height: clamp(10px, 1.6vw, 15px);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: clamp(6px, 1.1vw, 9px); background: var(--owner-color, var(--steppe-gold));
    border: 1.5px solid #18382d; box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .buildings-row { display: flex; gap: 1px; margin-top: 1px; }
  .build-icon { display: block; }
  .build-icon.house {
    width: clamp(7px, 1.4vw, 11px); height: clamp(7px, 1.4vw, 11px);
    background: linear-gradient(155deg, #E8FFD8 0%, #9AE87E 22%, #3E8A34 62%, #1c4d18 100%);
    clip-path: polygon(50% 0%, 100% 40%, 100% 100%, 0% 100%, 0% 40%);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5));
  }
  .build-icon.corp {
    width: clamp(9px, 1.8vw, 14px); height: clamp(9px, 1.8vw, 14px);
    background: linear-gradient(155deg, #FFFCEE 0%, #FBEDC0 20%, #D4AF37 55%, #7a5f1c 100%);
    clip-path: polygon(20% 0%, 80% 0%, 100% 30%, 100% 100%, 0% 100%, 0% 30%);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.55));
  }
  .debug-idx {
    display: none; position: absolute; bottom: 1px; left: 1px;
    font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #fff; background: rgba(255,0,0,0.7);
    border-radius: 3px; padding: 0 3px; z-index: 5;
  }
  .board-wrap.debug .tile { outline: 2px dashed #FF3B3B; }
  .board-wrap.debug .debug-idx { display: block; }

  .ptoken {
    position: absolute; z-index: 10;
    display: grid; place-items: center;
    width: clamp(20px, 3vw, 38px); height: clamp(20px, 3vw, 38px);
    font-size: clamp(13px, 2vw, 24px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--token-ring, var(--steppe-gold)) 55%, white 45%) 0%, var(--night-indigo-deep) 78%);
    border: 3px solid #241a0d;
    box-shadow: inset -2px -2px 3px rgba(0,0,0,0.55), inset 2px 2px 3px rgba(255,255,255,0.3), 0 4px 6px rgba(0,0,0,0.55);
    transition: left 0.45s ease, top 0.45s ease, transform 0.25s ease;
    filter: drop-shadow(0 6px 5px rgba(0,0,0,0.4));
    transform: translate(-50%, -50%);
  }
  .ptoken.moving { transform: translate(-50%, -50%) translateY(-14px) scale(1.18); }

  .dice-fab-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px; }
  .dice-fab {
    padding: 16px 30px; color: white; font-size: 16px; font-weight: 900; cursor: pointer;
    background: linear-gradient(#ffcc3e, #ed7c00); border: 4px solid white; border-radius: 20px;
    box-shadow: 0 7px 0 #a94c00; font-family: 'Work Sans', sans-serif;
  }
  .dice-fab:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 #a94c00; }
  .dice-fab:disabled { opacity: 0.5; cursor: not-allowed; }
  .dice-fab-row { display: flex; gap: 10px; }
  .die {
    width: 40px; height: 40px; background: linear-gradient(160deg, #FBF3DC, var(--parchment)); border-radius: 9px;
    display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
    padding: 6px; gap: 2px; box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 6px 10px rgba(0,0,0,0.25);
  }
  .die.rolling { animation: diceRoll 0.7s cubic-bezier(.36,.07,.19,.97); }
  .pip { border-radius: 50%; background: transparent; }
  .pip.on { background: var(--night-indigo-deep); box-shadow: inset 0 1px 2px rgba(0,0,0,0.4); }
  .dice-result-text { font-size: 12.5px; color: #9AA6BE; text-align: center; min-height: 16px; }

  .owner-badge, .buildings-row { pointer-events: none; }

  .card-popup-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; animation: popIn 0.2s ease; }
  .card-popup { width: min(90vw, 380px); background: linear-gradient(155deg, #1c1c1c 0%, #0c0c0c 100%); border: 2px solid var(--steppe-gold); border-radius: 16px; padding: 28px 22px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,175,55,0.15); animation: cardFlip 0.4s cubic-bezier(.2,1.4,.4,1); }
  .card-popup-eyebrow { font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; letter-spacing: 1.5px; color: var(--steppe-gold); margin-bottom: 10px; }
  .card-popup-player { font-size: 13px; color: #9AA6BE; margin-bottom: 14px; }
  .card-popup-text { font-size: 17px; line-height: 1.5; color: var(--parchment); margin-bottom: 16px; }
  .card-popup-money { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; }
  .card-popup-money.positive { color: var(--grass-green); }
  .card-popup-money.negative { color: var(--seal-red); }
  .detail-popup { text-align: left; }
  .detail-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 13.5px; }
  .detail-row:last-of-type { border-bottom: none; }
  .detail-row span:first-child { color: #9AA6BE; }
  .detail-row span:last-child { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--steppe-gold); }
  .detail-row-single { font-size: 13px; color: #9AA6BE; padding: 8px 0; text-align: center; }

  .side-panel { display: flex; flex-direction: column; gap: 14px; }
  .panel-box { background: linear-gradient(160deg, #1c1c1c 0%, #131313 100%); border: 1px solid var(--slate-line); border-radius: 12px; padding: 15px; box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03); }
  .panel-box h3 { font-family: 'Cinzel', serif; font-size: 11.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--steppe-gold); margin: 0 0 11px; padding-bottom: 9px; border-bottom: 1px dashed var(--slate-line); }
  .player-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
  .player-row:last-child { border-bottom: none; }
  .player-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; background: rgba(255,255,255,0.04); border: 2px solid var(--ring-color, var(--steppe-gold)); flex-shrink: 0; }

  .asset-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12.5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .asset-row:last-child { border-bottom: none; }
  .asset-name { flex: 1; }
  .asset-rent { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--steppe-gold); }
  .no-assets { font-size: 12.5px; color: #6b7690; padding: 4px 0; }
  .group-badge { color: var(--steppe-gold); font-size: 10px; letter-spacing: 0.5px; }
  .p-bankrupt { text-decoration: line-through; opacity: 0.4; }
  .lb-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; }
  .lb-row.lb-bankrupt { opacity: 0.4; text-decoration: line-through; }
  .lb-medal { width: 18px; text-align: center; }
  .lb-name { flex: 1; }
  .lb-worth { font-family: 'JetBrains Mono', monospace; color: var(--steppe-gold); }
  .ticker-text { font-size: 12px; color: #cfd7e6; padding: 4px 0; animation: tickerFade 0.4s ease; }
  .money-float-anchor { position: relative; height: 0; }
  .money-float { position: absolute; left: 50%; top: 0; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 15px; animation: moneyFloat 1s ease-out forwards; pointer-events: none; white-space: nowrap; text-shadow: 0 2px 3px rgba(0,0,0,0.6); }
  .money-float.positive { color: #4ADE80; }
  .money-float.negative { color: #FF6B6B; }

  .action-area { text-align: center; }
  .buy-prompt { background: rgba(212,162,78,0.08); border: 1.5px dashed var(--steppe-gold); border-radius: 10px; padding: 14px 12px; margin-top: 4px; font-size: 13px; }
  .buy-prompt .permit-eyebrow { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--steppe-gold); margin-bottom: 6px; }
  .buy-prompt .btn { margin-top: 8px; }
  .waiting-note { text-align: center; color: #8b96b0; font-size: 13px; padding: 22px 0; }
  .waiting-note .pulse-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--steppe-gold); margin-right: 6px; animation: pulse 1.4s infinite; }
  .log-box { max-height: 170px; overflow-y: auto; font-size: 12px; color: #b8c2d9; display: flex; flex-direction: column-reverse; gap: 5px; }

  .victory-box { text-align: center; padding: 40px 10px; }
  .victory-seal { width: 130px; height: 130px; margin: 18px auto; border-radius: 50%; border: 3px solid var(--steppe-gold); display: flex; align-items: center; justify-content: center; font-size: 56px; position: relative; animation: sealSpin 1.1s cubic-bezier(.2,1.4,.4,1); box-shadow: 0 0 0 6px rgba(212,162,78,0.08), 0 0 40px rgba(212,162,78,0.25); }
  .victory-name { font-size: 21px; font-weight: 700; margin-top: 10px; color: var(--parchment); }
  .victory-sub { color: #9AA6BE; margin-top: 4px; font-size: 13px; letter-spacing: 0.5px; }

  @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes activePulse { 0%,100% { box-shadow: inset 0 0 0 3px var(--steppe-gold); } 50% { box-shadow: inset 0 0 0 3px var(--steppe-gold), 0 0 14px var(--steppe-gold); } }
  @keyframes diceRoll {
    0% { transform: rotate(0deg) scale(1); } 12% { transform: rotate(-45deg) scale(1.1); }

    48% { transform: rotate(250deg) scale(0.97); } 60% { transform: rotate(-320deg) scale(1.05); }
    72% { transform: rotate(380deg) scale(0.98); } 84% { transform: rotate(-410deg) scale(1.03); }
    100% { transform: rotate(-360deg) scale(1); }
  }
  @keyframes sealSpin { from { transform: rotate(-180deg) scale(0.3); opacity: 0; } to { transform: rotate(0deg) scale(1); opacity: 1; } }
  @keyframes cardFlip { 0% { transform: rotateY(90deg) scale(0.8); opacity: 0; } 60% { transform: rotateY(-8deg) scale(1.03); opacity: 1; } 100% { transform: rotateY(0deg) scale(1); opacity: 1; } }
  @keyframes tickerFade { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes moneyFloat { 0% { opacity: 0; transform: translateY(6px) scale(0.8); } 20% { opacity: 1; transform: translateY(0) scale(1.1); } 80% { opacity: 1; transform: translateY(-14px) scale(1); } 100% { opacity: 0; transform: translateY(-24px) scale(0.95); } }
</style>

function randCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let s = '';
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function uid() { return Math.random().toString(36).slice(2, 10); }
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

let myId = uid();
let myName = '';
let currentRoom = null;
let view = 'landing';
let errorMsg = '';
let justRolled = false;
let debugMode = false;

async function getRoom(code) {
  try {
    const { data, error } = await supabaseClient.from('rooms').select('state').eq('room_code', code).single();
    if (error || !data) return null;
    return data.state;
  } catch (e) { return null; }
}
async function saveRoom(roomState) {
  roomState.updatedAt = Date.now();
  await supabaseClient.from('rooms').upsert({ room_code: roomState.roomCode, state: roomState });
}

function newPlayer(name, token, isHost) {
  return { id: myId, name, token, color: TOKEN_COLORS[TOKENS.indexOf(token)], money: 1500, position: 0, jailTurns: 0, bankrupt: false, isHost };
}

async function createRoom(name) {
  const code = randCode();
  const room = {
    roomCode: code, started: false,
    players: [newPlayer(name, TOKENS[0], true)],
    propOwner: {}, houses: {},
    currentPlayerIndex: 0, hasRolled: false, pendingAction: null,
    lastDice: null, diceRollId: null, animPath: null, cardDraw: null, winnerId: null,
    log: ['\u04e8\u0440\u04e9\u04e9 \u04af\u04af\u0441\u0433\u044d\u043b\u044d\u044d. \u0422\u043e\u0433\u043b\u043e\u0433\u0447\u0438\u0434 \u043d\u044d\u0433\u0434\u044d\u0445\u0438\u0439\u0433 \u0445\u04af\u043b\u044d\u044d\u0436 \u0431\u0430\u0439\u043d\u0430...'],
  };
  await saveRoom(room);
  currentRoom = room; view = 'waiting'; startPolling(); render();
}

async function joinRoom(code, name) {
  code = code.toUpperCase().trim();
  const room = await getRoom(code);
  if (!room) { errorMsg = '\u0418\u0439\u043c \u04e9\u0440\u04e9\u04e9 \u043e\u043b\u0434\u0441\u043e\u043d\u0433\u04af\u0439.'; render(); return; }
  const existing = room.players.find(p => p.name === name);
  if (existing) {
    myId = existing.id; currentRoom = room; view = room.started ? 'game' : 'waiting';
    startPolling(); render(); return;
  }
  if (room.started) { errorMsg = '\u042d\u043d\u044d \u0442\u043e\u0433\u043b\u043e\u043e\u043c \u0430\u043b\u044c \u0445\u044d\u0434\u0438\u0439\u043d \u044d\u0445\u044d\u043b\u0441\u044d\u043d \u0431\u0430\u0439\u043d\u0430.'; render(); return; }
  if (room.players.length >= 4) { errorMsg = '\u04e8\u0440\u04e9\u04e9 \u0434\u04af\u04af\u0440\u0441\u044d\u043d \u0431\u0430\u0439\u043d\u0430 (\u0434\u044d\u044d\u0434 \u0442\u0430\u043b \u043d\u044c 4 \u0442\u043e\u0433\u043b\u043e\u0433\u0447).'; render(); return; }
  const usedTokens = room.players.map(p => p.token);
  const freeToken = TOKENS.find(t => !usedTokens.includes(t));
  const player = newPlayer(name, freeToken, false);
  const { data, error } = await supabaseClient.rpc('join_room', { p_room_code: code, p_player: player });
  if (error || !data) { errorMsg = '\u041d\u044d\u0433\u0434\u044d\u0445\u044d\u0434 \u0430\u043b\u0434\u0430\u0430 \u0433\u0430\u0440\u0447\u043b\u0430\u0430, \u0434\u0430\u0445\u0438\u043d \u043e\u0440\u043e\u043b\u0434\u043e\u043d\u043e \u0443\u0443.'; render(); return; }
  currentRoom = data; view = 'waiting'; startPolling(); render();
}

async function startGame() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || room.players.length < 2) return;
  room.started = true;
  room.log.push('\u0422\u043e\u0433\u043b\u043e\u043e\u043c \u044d\u0445\u044d\u043b\u043b\u044d\u044d! ' + room.players[0].name + '-\u0438\u0439\u043d \u044d\u044d\u043b\u0436.');
  await saveRoom(room);
  currentRoom = room; view = 'game'; render();
}

function isMyTurn(room) { return room.players[room.currentPlayerIndex] && room.players[room.currentPlayerIndex].id === myId; }
function pushLog(room, text) { room.log.push(text); if (room.log.length > 40) room.log = room.log.slice(-40); }
function checkWinner(room) { const active = room.players.filter(p => !p.bankrupt); if (active.length === 1) room.winnerId = active[0].id; }

function bankrupt(room, player) {
  player.bankrupt = true;
  Object.keys(room.propOwner).forEach(k => { if (room.propOwner[k] === player.id) { delete room.propOwner[k]; if (room.houses) delete room.houses[k]; } });
  pushLog(room, `${player.name} \u0434\u0430\u043c\u043f\u0443\u0443\u0440\u043b\u0430\u0430!`);
  checkWinner(room);
}

function propertiesInGroup(idx) {
  const grp = BOARD_CONFIG[idx].colorGroup;
  if (!grp) return [];
  return BOARD_CONFIG.filter(t => t.type === 'property' && t.colorGroup === grp).map(t => t.id);
}
function ownsFullGroup(room, ownerId, idx) {
  const group = propertiesInGroup(idx);
  return group.length > 0 && group.every(i => room.propOwner[i] === ownerId);
}
function houseLevel(room, idx) { return (room.houses && room.houses[idx]) || 0; }
function buildLevelLabel(level) { return level >= 4 ? '\u041a\u043e\u0440\u043f\u043e\u0440\u0430\u0446' : level + ' \u0431\u0430\u0439\u0448\u0438\u043d'; }
function buildCost(sp) { return Math.round(sp.price * 0.5 / 10) * 10; }

function resolvePropertyOrTax(room, player, idx) {
  const sp = BOARD_CONFIG[idx];
  if (sp.type === 'property') {
    const owner = room.propOwner[idx];
    if (!owner) {
      room.pendingAction = { type: 'buy', playerId: player.id, spaceIndex: idx };
    } else if (owner === player.id) {
      const level = houseLevel(room, idx);
      if (level < 4) room.pendingAction = { type: 'build', playerId: player.id, spaceIndex: idx };
    } else {
      const ownerPlayer = room.players.find(p => p.id === owner);
      const level = houseLevel(room, idx);
      let rent, note;
      if (level > 0) { rent = sp.rent * [1,2,4,6,10][level]; note = ` (${buildLevelLabel(level)})`; }
      else { const fullGroup = ownsFullGroup(room, owner, idx); rent = fullGroup ? sp.rent * 2 : sp.rent; note = fullGroup ? ' (\u0431\u04af\u043b\u044d\u0433 \u0431\u04af\u0440\u044d\u043d \u2014 2x)' : ''; }
      player.money -= rent; ownerPlayer.money += rent;
      pushLog(room, `${player.name} ${ownerPlayer.name}-\u0434 \u0442\u04af\u0440\u044d\u044d\u0441 \u20ae${rent} \u0442\u04e9\u043b\u04e9\u0432${note}.`);
      if (player.money < 0) bankrupt(room, player);
    }
  } else if (sp.type === 'tax') {
    player.money -= sp.amount;
    pushLog(room, `${player.name} \u0442\u0430\u0442\u0432\u0430\u0440 \u20ae${sp.amount} \u0442\u04e9\u043b\u04e9\u0432.`);
    if (player.money < 0) bankrupt(room, player);
  }
}

function resolveSpace(room, player, idx) {
  const sp = BOARD_CONFIG[idx];
  if (sp.type === 'property' || sp.type === 'tax') {
    resolvePropertyOrTax(room, player, idx);
  } else if (sp.type === 'chance' || sp.type === 'chest') {
    const pool = sp.type === 'chance' ? CHANCE_CARDS : CHEST_CARDS;
    const card = pool[Math.floor(Math.random() * pool.length)];
    pushLog(room, `${player.name}: "${card.text}"`);
    room.cardDraw = { type: sp.type, playerName: player.name, text: card.text, money: typeof card.money === 'number' ? card.money : null, id: Date.now() + Math.random() };
    if (typeof card.money === 'number') player.money += card.money;
    if (typeof card.moveTo === 'number') { player.position = card.moveTo; if (card.collect) player.money += card.collect; resolvePropertyOrTax(room, player, player.position); }
    if (typeof card.moveRel === 'number') { player.position = ((player.position + card.moveRel) % BOARD_CONFIG.length + BOARD_CONFIG.length) % BOARD_CONFIG.length; resolvePropertyOrTax(room, player, player.position); }
    if (card.gotoJail) { player.jailTurns = 2; }
    if (player.money < 0) bankrupt(room, player);
  }
  // type 'go' / 'corner' (\u042d\u0425\u041b\u042d\u041b, \u0410\u041c\u0420\u0410\u041b\u0422, \u0417\u0410\u0425 \u0417\u042d\u042d\u041b, \u0414\u0423\u0423\u0414\u041b\u0410\u0413\u0410 \u0425\u0423\u0414\u0410\u041b\u0414\u0410\u0410): \u043e\u0434\u043e\u043e\u0433\u043e\u043e\u0440 \u043c\u044d\u0434\u044d\u044d\u043b\u043b\u044d\u043b \u0442\u0430\u0439\u043b\u0431\u0430\u0440, \u0442\u0443\u0441\u0433\u0430\u0439 \u043c\u0435\u0445\u0430\u043d\u0438\u043a (\u0430\u0443\u043a\u0446\u0438\u043e\u043d/\u0437\u0430\u0445 \u0437\u044d\u044d\u043b) \u0434\u0430\u0440\u0430\u0430\u0433\u0438\u0439\u043d \u0448\u0430\u0442\u0430\u043d\u0434 \u043d\u044d\u043c\u044d\u0433\u0434\u044d\u043d\u044d
}

async function rollDice() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !isMyTurn(room) || room.hasRolled || room.pendingAction) return;
  const player = room.players[room.currentPlayerIndex];

  if (player.jailTurns > 0) {
    player.jailTurns--;
    room.hasRolled = true;
    pushLog(room, `${player.name} \u0448\u043e\u0440\u043e\u043d\u0434 \u0431\u0430\u0439\u0433\u0430\u0430 \u0442\u0443\u043b \u0430\u043b\u0433\u0430\u0441\u0430\u0432 (${player.jailTurns} \u044d\u044d\u043b\u0436 \u04af\u043b\u0434\u044d\u044d).`);
    await saveRoom(room); currentRoom = room; justRolled = true; render();
    return;
  }

  const d1 = 1 + Math.floor(Math.random() * 6);
  const d2 = 1 + Math.floor(Math.random() * 6);
  const sum = d1 + d2;
  room.lastDice = [d1, d2];
  room.diceRollId = Date.now() + Math.random();
  const oldPos = player.position;
  const newPos = (oldPos + sum) % BOARD_CONFIG.length;
  const passedGo = newPos < oldPos;
  room.animPath = { playerId: player.id, from: oldPos, steps: sum, id: Date.now() + Math.random() };
  if (passedGo) { player.money += 200; pushLog(room, `${player.name} \u042d\u0425\u041b\u042d\u041b \u0434\u044d\u044d\u0433\u04af\u04af\u0440 \u04e9\u043d\u0433\u04e9\u0440\u0447 \u20ae200 \u0430\u0432\u043b\u0430\u0430.`); }
  player.position = newPos;
  room.hasRolled = true;
  pushLog(room, `${player.name} \ud83c\udfb2${d1}+${d2}=${sum}, ${BOARD_CONFIG[newPos].name} \u0434\u044d\u044d\u0440 \u043e\u0447\u0438\u0432.`);
  resolveSpace(room, player, newPos);
  checkWinner(room);
  await saveRoom(room); currentRoom = room; justRolled = true; render();
}

async function buyProperty() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !room.pendingAction || room.pendingAction.type !== 'buy' || room.pendingAction.playerId !== myId) return;
  const idx = room.pendingAction.spaceIndex;
  const player = room.players.find(p => p.id === myId);
  const sp = BOARD_CONFIG[idx];
  if (player.money < sp.price) { room.pendingAction = null; await saveRoom(room); currentRoom = room; render(); return; }
  player.money -= sp.price; room.propOwner[idx] = player.id;
  pushLog(room, `${player.name} "${sp.name}"-\u0433 \u20ae${sp.price}-\u0440 \u0445\u0443\u0434\u0430\u043b\u0434\u0430\u0436 \u0430\u0432\u0430\u0432.`);
  room.pendingAction = null;
  await saveRoom(room); currentRoom = room; render();
}
async function skipBuy() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !room.pendingAction || room.pendingAction.playerId !== myId) return;
  room.pendingAction = null; await saveRoom(room); currentRoom = room; render();
}
async function buildProperty() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !room.pendingAction || room.pendingAction.type !== 'build' || room.pendingAction.playerId !== myId) return;
  const idx = room.pendingAction.spaceIndex;
  const player = room.players.find(p => p.id === myId);
  const sp = BOARD_CONFIG[idx];
  const cost = buildCost(sp);
  if (player.money < cost) { room.pendingAction = null; await saveRoom(room); currentRoom = room; render(); return; }
  if (!room.houses) room.houses = {};
  const level = houseLevel(room, idx) + 1;
  room.houses[idx] = level; player.money -= cost;
  pushLog(room, `${player.name} "${sp.name}"-\u0434 ${buildLevelLabel(level)} \u0431\u0430\u0440\u0438\u0432 (\u20ae${cost}).`);
  room.pendingAction = null;
  await saveRoom(room); currentRoom = room; render();
}
async function skipBuild() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !room.pendingAction || room.pendingAction.type !== 'build' || room.pendingAction.playerId !== myId) return;
  room.pendingAction = null; await saveRoom(room); currentRoom = room; render();
}
async function endTurn() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !isMyTurn(room) || room.pendingAction) return;
  const active = room.players.filter(p => !p.bankrupt);
  if (active.length <= 1) return;
  let next = room.currentPlayerIndex;
  do { next = (next + 1) % room.players.length; } while (room.players[next].bankrupt);
  room.currentPlayerIndex = next; room.hasRolled = false; room.lastDice = null;
  pushLog(room, `\u2014 ${room.players[next].name}-\u0438\u0439\u043d \u044d\u044d\u043b\u0436 \u2014`);
  await saveRoom(room); currentRoom = room; render();
}

let roomChannel = null;
function startPolling() {
  if (roomChannel) supabaseClient.removeChannel(roomChannel);
  roomChannel = supabaseClient.channel('room-' + currentRoom.roomCode)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `room_code=eq.${currentRoom.roomCode}` },
      payload => {
        if (!payload.new || !payload.new.state) return;
        currentRoom = payload.new.state;
        if (view === 'waiting' && currentRoom.started) view = 'game';
        if (view !== 'landing') render();
      })
    .subscribe();
}

/* ---------- ANIMATION STATE ---------- */
let animOverride = null;
let lastAnimId = null;
let lastCardId = null;
let cardPopupTimer = null;
let lastDiceRollId = null;
let diceRollingNow = false;
let diceTempFaces = null;
let lastKnownMoney = null;

function maybeTriggerMoveAnimation(room) {
  const ap = room.animPath;
  if (ap && ap.id !== lastAnimId) {
    lastAnimId = ap.id;
    animOverride = { playerId: ap.playerId, pos: ap.from };
    animateTokenMove(ap.playerId, ap.from, ap.steps);
  }
}
function animateTokenMove(playerId, from, steps) {
  let i = 1;
  function step() {
    animOverride = { playerId, pos: (from + i) % BOARD_CONFIG.length };
    render();
    i++;
    if (i <= steps) setTimeout(step, 160); else animOverride = null;
  }
  setTimeout(step, 160);
}
function displayPos(room, p) {
  if (animOverride && animOverride.playerId === p.id) return animOverride.pos;
  return p.position;
}
function maybeTriggerDiceAnimation(room) {
  if (room.diceRollId && room.diceRollId !== lastDiceRollId) { lastDiceRollId = room.diceRollId; animateDiceRoll(); }
}
function animateDiceRoll() {
  diceRollingNow = true; let ticks = 0; const maxTicks = 6;
  function tick() {
    diceTempFaces = [1+Math.floor(Math.random()*6), 1+Math.floor(Math.random()*6)];
    render(); ticks++;
    if (ticks < maxTicks) setTimeout(tick, 90); else { diceRollingNow = false; diceTempFaces = null; }
  }
  tick();
}
function maybeShowCardPopup(room) {
  const cd = room.cardDraw;
  if (cd && cd.id !== lastCardId) { lastCardId = cd.id; showCardPopup(cd); }
}
function showCardPopup(draw) {
  const root = document.getElementById('card-popup-root');
  if (!root) return;
  const isChance = draw.type === 'chance';
  const hasMoney = typeof draw.money === 'number';
  const moneyHtml = hasMoney ? `<div class="card-popup-money ${draw.money >= 0 ? 'positive' : 'negative'}">${draw.money >= 0 ? '+' : '\u2212'}\u20ae${fmt(Math.abs(draw.money))}</div>` : '';
  root.innerHTML = `<div class="card-popup-backdrop" id="cardPopupBackdrop"><div class="card-popup ${isChance?'chance':'court'}">
    <div class="card-popup-eyebrow">${isChance ? '\ud83c\udccf \u0410\u0437\u044b\u043d \u043a\u0430\u0440\u0442' : '\u2696\ufe0f \u0428\u04af\u04af\u0445\u0438\u0439\u043d \u0442\u043e\u0433\u0442\u043e\u043e\u043b'}</div>
    <div class="card-popup-player">${draw.playerName}</div>
    <div class="card-popup-text">"${draw.text}"</div>
    ${moneyHtml}
  </div></div>`;
  const backdrop = document.getElementById('cardPopupBackdrop');
  if (backdrop) backdrop.onclick = () => { root.innerHTML = ''; };
  clearTimeout(cardPopupTimer);
  cardPopupTimer = setTimeout(() => { root.innerHTML = ''; }, 4500);
}
function maybeFlashMoney(room) {
  if (!room) return;
  const me = room.players.find(p => p.id === myId);
  if (!me) return;
  if (lastKnownMoney !== null && me.money !== lastKnownMoney) flashMoneyFloat(me.money - lastKnownMoney);
  lastKnownMoney = me.money;
}
function flashMoneyFloat(delta) {
  const anchor = document.getElementById('moneyFloatAnchor');
  if (!anchor) return;
  const el = document.createElement('div');
  el.className = 'money-float ' + (delta >= 0 ? 'positive' : 'negative');
  el.textContent = (delta >= 0 ? '+' : '\u2212') + '\u20ae' + fmt(Math.abs(delta));
  anchor.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function netWorth(room, player) {
  let worth = player.money;
  Object.keys(room.propOwner).forEach(idx => {
    if (room.propOwner[idx] === player.id) {
      const sp = BOARD_CONFIG[idx]; worth += sp.price;
      const level = houseLevel(room, idx);
      if (level > 0) worth += buildCost(sp) * level;
    }
  });
  return worth;
}
function renderDie(value, rolling) {
  const on = value ? (DIE_PIPS[value] || []) : [];
  let pipsHtml = '';
  for (let i = 1; i <= 9; i++) pipsHtml += `<div class="pip ${on.includes(i)?'on':''}"></div>`;
  return `<div class="die ${rolling?'rolling':''}">${pipsHtml}</div>`;
}
function renderBuildings(level) {
  if (level >= 4) return `<div class="buildings-row"><span class="build-icon corp" title="\u041a\u043e\u0440\u043f\u043e\u0440\u0430\u0446"></span></div>`;
  let html = '<div class="buildings-row">';
  for (let i = 0; i < level; i++) html += `<span class="build-icon house" title="\u0411\u0430\u0439\u0448\u0438\u043d"></span>`;
  html += '</div>';
  return html;
}

/* ---------- RENDER ---------- */
function render() {
  const app = document.getElementById('app');
  if (currentRoom) maybeShowCardPopup(currentRoom);
  if (view === 'landing') { app.innerHTML = renderLanding(); attachLandingEvents(); return; }
  if (view === 'waiting') { app.innerHTML = renderWaiting(); attachWaitingEvents(); return; }
  if (view === 'game') {
    if (currentRoom) { maybeTriggerMoveAnimation(currentRoom); maybeTriggerDiceAnimation(currentRoom); }
    app.innerHTML = renderGame();
    attachGameEvents();
    maybeFlashMoney(currentRoom);
    return;
  }
}

function renderGame() {
  const room = currentRoom;
  if (room.winnerId) {
    const winner = room.players.find(p => p.id === room.winnerId);
    return `<div class="screen victory-box">
      <div class="eyebrow">\u0422\u044d\u043c\u0446\u044d\u044d\u043d \u0434\u0443\u0443\u0441\u0430\u0432</div>

  }

  const myTurn = isMyTurn(room);
  const currentPlayer = room.players[room.currentPlayerIndex];
  const d1 = diceRollingNow && diceTempFaces ? diceTempFaces[0] : (room.lastDice ? room.lastDice[0] : null);
  const d2 = diceRollingNow && diceTempFaces ? diceTempFaces[1] : (room.lastDice ? room.lastDice[1] : null);

  let tilesHtml = '';
  BOARD_CONFIG.forEach(tile => {
    const idx = tile.id;
    const owner = room.propOwner[idx] ? room.players.find(p => p.id === room.propOwner[idx]) : null;
    const isFullGroup = owner && tile.type === 'property' && ownsFullGroup(room, owner.id, idx);

    const level = tile.type === 'property' ? houseLevel(room, idx) : 0;
    const groupTab = tile.colorGroup ? `<span class="tile-group-tab" style="background:${GROUP_COLORS[tile.colorGroup]}"></span>` : '';
    tilesHtml += `<div class="tile ${[0,8,16,24].includes(idx)?'corner-tile':''} ${owner?'owned':''} ${isFullGroup?'group-complete':''} ${isActivePos?'active-position':''}"
      data-idx="${idx}"
      style="left:${tile.left}%; top:${tile.top}%; width:${tile.width}%; height:${tile.height}%; transform:rotate(${tile.rotation}deg); ${owner?`--owner-color:${owner.color}; background:${hexToRgba(owner.color,0.18)};`:''}">
      ${groupTab}
      <span>${tile.name}</span>
      ${tile.price ? `<small>\u20ae${fmt(tile.price)}</small>` : ''}
      ${level > 0 ? renderBuildings(level) : ''}
      ${owner ? `<span class="owner-badge" style="--owner-color:${owner.color}">${owner.token}</span>` : ''}
      <span class="debug-idx">${idx}</span>
    </div>`;
  });

  const tokensHtml = room.players.filter(p => !p.bankrupt).map((p, i) => {
    const pos = displayPos(room, p);
    const tile = BOARD_CONFIG[pos];
    const offsets = [[-3,-3],[3,-3],[-3,3],[3,3]];
    const off = offsets[i % 4];
    const left = tile.tokenLeft + off[0]*0.35;
    const top = tile.tokenTop + off[1]*0.35;
    return `<div class="ptoken ${justRolled && p.id === currentPlayer.id ? 'moving' : ''}" style="left:${left}%; top:${top}%; --token-ring:${p.color}">${p.token}</div>`;
  }).join('');

  let actionHtml = '';
  if (room.pendingAction && room.pendingAction.playerId === myId && room.pendingAction.type === 'buy') {
    const sp = BOARD_CONFIG[room.pendingAction.spaceIndex];
    actionHtml = `<div class="buy-prompt">
      <div class="permit-eyebrow">\ud83c\udfee \u0425\u0443\u0434\u0430\u043b\u0434\u0430\u0430\u043d\u044b \u0437\u04e9\u0432\u0448\u04e9\u04e9\u0440\u04e9\u043b</div>
      "${sp.name}"-\u0433 \u20ae${sp.price}-\u0440 \u0445\u0443\u0434\u0430\u043b\u0434\u0430\u0436 \u0430\u0432\u0430\u0445 \u0443\u0443?<br><span style="color:#9AA6BE;">\u0422\u04af\u0440\u044d\u044d\u0441: \u20ae${sp.rent}/\u0443\u0434\u0430\u0430</span>
      <button class="btn btn-primary" id="buyBtn" ${me.money<sp.price?'disabled':''}>\u0425\u0443\u0434\u0430\u043b\u0434\u0430\u0436 \u0430\u0432\u0430\u0445</button>
      <button class="btn btn-secondary" id="skipBtn">\u0410\u043b\u0433\u0430\u0441\u0430\u0445</button>
    </div>`;
  } else if (room.pendingAction && room.pendingAction.playerId === myId && room.pendingAction.type === 'build') {
    const sp = BOARD_CONFIG[room.pendingAction.spaceIndex];
    const level = houseLevel(room, room.pendingAction.spaceIndex);
    const cost = buildCost(sp);
    const nextLabel = level+1>=4 ? '\u041a\u043e\u0440\u043f\u043e\u0440\u0430\u0446' : `${level+1}-\u0440 \u0431\u0430\u0439\u0448\u0438\u043d`;
    actionHtml = `<div class="buy-prompt">
      <div class="permit-eyebrow">\ud83c\udfd7\ufe0f \u0411\u0430\u0440\u0438\u043b\u0433\u044b\u043d \u0437\u04e9\u0432\u0448\u04e9\u04e9\u0440\u04e9\u043b</div>
      "${sp.name}" \u0434\u044d\u044d\u0440 ${nextLabel} \u0431\u0430\u0440\u0438\u0445 \u0443\u0443?<br><span style="color:#9AA6BE;">\u0417\u0430\u0440\u0434\u0430\u043b: \u20ae${cost}</span>
      <button class="btn btn-primary" id="buildBtn" ${me.money<cost?'disabled':''}>\u0411\u0430\u0440\u0438\u0445</button>
      <button class="btn btn-secondary" id="skipBuildBtn">\u0410\u043b\u0433\u0430\u0441\u0430\u0445</button>
    </div>`;
  } else if (myTurn) {
    actionHtml = `<div class="dice-fab-wrap">
      <div class="dice-fab-row">${renderDie(d1, diceRollingNow)}${renderDie(d2, diceRollingNow)}</div>
      <div class="dice-result-text">${room.lastDice ? `\u0421\u04af\u04af\u043b\u0434 \u0433\u0430\u0440\u0441\u0430\u043d: ${room.lastDice[0]} + ${room.lastDice[1]} = ${room.lastDice[0]+room.lastDice[1]}` : ''}</div>
      <button class="dice-fab" id="rollBtn" ${room.hasRolled?'disabled':''}>\ud83c\udfb2 \u0428\u043e\u043e \u0445\u0430\u044f\u0445</button>
      <button class="btn btn-secondary" id="endTurnBtn" ${!room.hasRolled?'disabled':''} style="width:auto;padding:8px 20px;">\u0415\u044d\u043b\u0436\u0438\u0439\u0433 \u0434\u0443\u0443\u0441\u0433\u0430\u0445</button>
    </div>`;
  } else {
    actionHtml = `<div class="waiting-note"><span class="pulse-dot"></span>${currentPlayer.name}-\u0438\u0439\u043d \u044d\u044d\u043b\u0436 \u0431\u0430\u0439\u043d\u0430...</div>`;
  }

  const ranked = room.players.slice().sort((a,b) => netWorth(room,b) - netWorth(room,a));
  const medals = ['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49','4\ufe0f\u20e3'];
  const leaderboardHtml = ranked.map((p,i) => `<div class="lb-row ${p.bankrupt?'lb-bankrupt':''}"><span class="lb-medal">${medals[i]||(i+1)}</span><span>${p.token}</span><span class="lb-name">${p.name}</span><span class="lb-worth">\u20ae${fmt(netWorth(room,p))}</span></div>`).join('');
  const latestLog = room.log.length ? room.log[room.log.length-1] : '';
  const myProps = Object.keys(room.propOwner).filter(idx => room.propOwner[idx] === myId).map(Number).sort((a,b)=>a-b);
  const myAssetsHtml = myProps.length === 0
    ? `<div class="no-assets">\u041e\u0434\u043e\u043e\u0433\u043e\u043e\u0440 \u044e\u0443 \u0447 \u0445\u0443\u0434\u0430\u043b\u0434\u0430\u0436 \u0430\u0432\u0430\u0430\u0433\u04af\u0439 \u0431\u0430\u0439\u043d\u0430.</div>`
    : myProps.map(idx => {
        const sp = BOARD_CONFIG[idx]; const full = ownsFullGroup(room, myId, idx); const level = houseLevel(room, idx);
        const levelTag = level > 0 ? ` <span class="group-badge">\ud83c\udfd7\ufe0f ${buildLevelLabel(level)}</span>` : '';
        const rentShown = level > 0 ? sp.rent*[1,2,4,6,10][level] : (full ? sp.rent*2 : sp.rent);
        return `<div class="asset-row"><span class="asset-name">${sp.name}${full && level===0 ? ' <span class="group-badge">\u2605</span>' : ''}${levelTag}</span><span class="asset-rent">\u20ae${rentShown}</span></div>`;
      }).join('');

  return `<div class="game-wrap">
    <div class="top-bar">
      <div class="seal-title">\u0418\u0445 \u0425\u04e9\u0440\u04e9\u043d\u0433\u04e9</div>
      <div class="top-bar-right">
        <button class="debug-toggle ${debugMode?'on':''}" id="debugToggle">${debugMode?'\ud83d\udd34 Debug ON':'Debug OFF'}</button>
        <div class="turn-indicator"><span class="pulse-dot"></span>${room.roomCode} \u00b7 ${currentPlayer.token} ${currentPlayer.name}</div>
      </div>
    </div>
    <div class="game-layout">
      <div class="board-outer">
        <div class="board-wrap ${debugMode?'debug':''}" id="boardWrap">
          <img class="board-image" src="board.png" alt="\u0418\u0445 \u0425\u04e9\u0440\u04e9\u043d\u0433\u04e9 \u0442\u043e\u0433\u043b\u043e\u043e\u043c\u044b\u043d \u0445\u04e9\u043b\u04e9\u0433">
          ${tilesHtml}
          <div class="money-float-anchor" id="moneyFloatAnchor" style="position:absolute; left:50%; top:50%;"></div>
          ${tokensHtml}
        </div>
      </div>
      <div class="side-panel">
        <div class="panel-box">
          <h3>\u0422\u043e\u0433\u043b\u043e\u0433\u0447\u0438\u0434</h3>
          ${room.players.map(p => {
            const ownedCount = Object.values(room.propOwner).filter(oid => oid === p.id).length;
            return `<div class="player-row ${p.id===currentPlayer.id?'active-turn':''} ${p.bankrupt?'p-bankrupt':''}">
              <span class="player-avatar" style="--ring-color:${p.color}">${p.token}</span>
              <span>${p.name}${p.id===myId?' (\u0442\u0430)':''}</span>
              <span class="p-props">\ud83c\udfe2${ownedCount}</span>
              <span class="p-money">\u20ae${fmt(p.money)}</span>
            </div>`;
          }).join('')}
        </div>
        <div class="panel-box"><h3>\u0425\u04e9\u0440\u04e9\u043d\u0433\u0438\u0439\u043d \u0448\u0430\u0442\u043b\u0430\u0433\u0430</h3>${leaderboardHtml}</div>
        <div class="panel-box"><h3>\u041c\u0438\u043d\u0438\u0439 \u043a\u043e\u043c\u043f\u0430\u043d\u0438\u0443\u0434</h3>${myAssetsHtml}</div>
        <div class="panel-box action-area"><h3>\u0422\u0430\u043d\u044b \u044d\u044d\u043b\u0436</h3>${actionHtml}</div>
        <div class="panel-box"><h3>\u0422\u044d\u043c\u0434\u044d\u0433\u043b\u044d\u043b</h3><div class="log-box">${room.log.slice().reverse().map(l=>`<div>${l}</div>`).join('')}</div></div>
      </div>
    </div>
  </div>`;
}

function showCellDetail(idx) {
  const room = currentRoom;
  const sp = BOARD_CONFIG[idx];
  const root = document.getElementById('card-popup-root');
  if (!root || !room) return;
  const ownerId = room.propOwner[idx];
  const owner = ownerId ? room.players.find(p => p.id === ownerId) : null;
  const level = sp.type === 'property' ? houseLevel(room, idx) : 0;
  const fullGroup = owner && sp.type === 'property' ? ownsFullGroup(room, owner.id, idx) : false;
  let bodyHtml = '';
  if (sp.type === 'property') {
    const effectiveRent = level > 0 ? sp.rent*[1,2,4,6,10][level] : (fullGroup ? sp.rent*2 : sp.rent);
    bodyHtml = `
      <div class="detail-row"><span>\u04ae\u043d\u044d</span><span>\u20ae${fmt(sp.price)}</span></div>
      <div class="detail-row"><span>\u0421\u0443\u0443\u0440\u044c \u0442\u04af\u0440\u044d\u044d\u0441</span><span>\u20ae${fmt(sp.rent)}</span></div>
      <div class="detail-row"><span>\u041e\u0434\u043e\u043e\u0433\u0438\u0439\u043d \u0442\u04af\u0440\u044d\u044d\u0441</span><span>\u20ae${fmt(effectiveRent)}</span></div>
      <div class="detail-row"><span>\u042d\u0437\u044d\u043c\u0448\u0438\u0433\u0447</span><span>${owner ? owner.token+' '+owner.name : '\u0425\u044d\u043d \u0447 \u0431\u0438\u0448'}</span></div>`;
  } else if (sp.type === 'tax') {
    bodyHtml = `<div class="detail-row"><span>\u0422\u0430\u0442\u0432\u0430\u0440</span><span>\u20ae${fmt(sp.amount)}</span></div>`;
  } else {
    bodyHtml = `<div class="detail-row-single">\u0422\u0443\u0441\u0433\u0430\u0439 \u043d\u04af\u0434 \u2014 \u0445\u0443\u0434\u0430\u043b\u0434\u0430\u0436 \u0430\u0432\u0430\u0445 \u0431\u043e\u043b\u043e\u043c\u0436\u0433\u04af\u0439</div>`;
  }
  root.innerHTML = `<div class="card-popup-backdrop" id="detailBackdrop"><div class="card-popup detail-popup">
    <div class="card-popup-eyebrow">${sp.name}</div>${bodyHtml}
    <button class="btn btn-secondary" id="closeDetailBtn" style="margin-top:14px;">\u0425\u0430\u0430\u0445</button>
  </div></div>`;
  const backdrop = document.getElementById('detailBackdrop');
  if (backdrop) backdrop.onclick = () => { root.innerHTML = ''; };
  const closeBtn = document.getElementById('closeDetailBtn');
  if (closeBtn) closeBtn.onclick = () => { root.innerHTML = ''; };
}

function attachGameEvents() {
  const roll = document.getElementById('rollBtn'); if (roll) roll.onclick = rollDice;
  const end = document.getElementById('endTurnBtn'); if (end) end.onclick = endTurn;
  const buy = document.getElementById('buyBtn'); if (buy) buy.onclick = buyProperty;
  const skip = document.getElementById('skipBtn'); if (skip) skip.onclick = skipBuy;
  const build = document.getElementById('buildBtn'); if (build) build.onclick = buildProperty;
  const skipBuild2 = document.getElementById('skipBuildBtn'); if (skipBuild2) skipBuild2.onclick = skipBuild;
  const dbg = document.getElementById('debugToggle'); if (dbg) dbg.onclick = () => { debugMode = !debugMode; render(); };
  document.querySelectorAll('.tile[data-idx]').forEach(el => { el.onclick = () => showCellDetail(parseInt(el.dataset.idx, 10)); });
}

render();
</script>
</body>
</html>
