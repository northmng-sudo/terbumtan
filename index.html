      </div>
      <div class="mm-search-mode">${modeLabels[mmState.mode]}</div>
      <div class="mm-search-text">\u04e8\u0440\u0441\u04e9\u043b\u0434\u04e9\u0433\u0447 \u0445\u0430\u0439\u0436 \u0431\u0430\u0439\u043d\u0430...</div>
      <div class="mm-search-time">${elapsed}\u0441</div>
      <div class="mm-search-mmr">${(getRankTier(s.mmr || 1000)).label} \u00b7 ${s.mmr || 1000} MMR</div>
      <button class="btn btn-secondary" id="mmCancelBtn">\u25c6 \u0425\u0410\u0419\u041b\u0422 \u0426\u0423\u0426\u041b\u0410\u0425</button>
    </div>`;
  } else if (mmState.stage === 'found') {
    const remain = mmState.acceptDeadline ? Math.max(0, Math.ceil((mmState.acceptDeadline - Date.now()) / 1000)) : 0;
    const s = authState._stats || {};
    body = `<div class="mm-found">
      <div class="mm-found-title">\u2756 \u04e8\u0420\u0421\u04e8\u041b\u0414\u04e8\u0413\u0427 \u041e\u041b\u0414\u041b\u041e\u041e! \u2756</div>
      <div class="mm-vs-row">
        <div class="mm-vs-side"><span class="mm-vs-avatar">${(authState.profile && authState.profile.avatar) || '\ud83d\udc2b'}</span><div class="mm-vs-name">${myName || '\u0422\u0430'}</div><div class="mm-vs-sub">LV.${s.level || 1} \u00b7 ${s.mmr || 1000}</div></div>
        <div class="mm-vs-mark">VS</div>
        <div class="mm-vs-side"><span class="mm-vs-avatar">${mmState.opponent.avatar}</span><div class="mm-vs-name">${mmState.opponent.name}</div><div class="mm-vs-sub">LV.${mmState.opponent.level} \u00b7 ${mmState.opponent.mmr}</div></div>
      </div>
      <div class="mm-countdown">${remain}\u0441</div>
      ${mmState.myAccepted
        ? `<div class="mm-waiting-accept">\u0422\u0430 \u0431\u044d\u043b\u044d\u043d \u0431\u043e\u043b\u043b\u043e\u043e. \u04e8\u0440\u0441\u04e9\u043b\u0434\u04e9\u0433\u0447\u0438\u0439\u0433 \u0445\u04af\u043b\u044d\u044d\u0436 \u0431\u0430\u0439\u043d\u0430...</div>`

    </div>`;
  }
  return `<div class="mm-modal-backdrop" id="mmModalBackdrop">

      ${body}
    </div>
  </div>`;
}

function attachLandingEvents() {
  document.getElementById('createBtn').onclick = () => {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) { errorMsg = '\u0422\u043e\u0433\u043b\u043e\u0433\u0447\u0438\u0439\u043d \u043d\u044d\u0440\u044d\u044d \u043e\u0440\u0443\u0443\u043b\u043d\u0430 \u0443\u0443.'; render(); return; }
    myName = name; errorMsg = ''; if (!authState.user) { try { localStorage.setItem('ikhKhorongoGuestName', name); } catch (e) {} }
    createRoom(name, TOKENS[myAvatarIndex]);
  };
  document.getElementById('joinBtn').onclick = () => {
    const name = document.getElementById('nameInput').value.trim();
    const code = document.getElementById('codeInput').value.trim();
    if (!name) { errorMsg = '\u0422\u043e\u0433\u043b\u043e\u0433\u0447\u0438\u0439\u043d \u043d\u044d\u0440\u044d\u044d \u043e\u0440\u0443\u0443\u043b\u043d\u0430 \u0443\u0443.'; render(); return; }
    if (!code || code.length !== 4) { errorMsg = '\u04e8\u0440\u04e9\u04e9\u043d\u0438\u0439 \u043a\u043e\u0434 4 \u0442\u044d\u043c\u0434\u044d\u0433\u0442 \u0431\u0430\u0439\u0445 \u0451\u0441\u0442\u043e\u0439.'; render(); return; }
    myName = name; errorMsg = ''; if (!authState.user) { try { localStorage.setItem('ikhKhorongoGuestName', name); } catch (e) {} }
    joinRoom(code, name, TOKENS[myAvatarIndex]);
  };
  document.getElementById('codeInput').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); });
  const cycleAvatar = (dir) => {
    myAvatarIndex = ((myAvatarIndex + dir) % TOKENS.length + TOKENS.length) % TOKENS.length;
    try { localStorage.setItem('ikhKhorongoAvatarIdx', String(myAvatarIndex)); } catch (e) {}
    render();
  };
  document.getElementById('avatarPrevBtn').onclick = () => cycleAvatar(-1);
  document.getElementById('avatarNextBtn').onclick = () => cycleAvatar(1);
  const profileLink = document.getElementById('landingProfileLink'); if (profileLink) profileLink.onclick = (e) => { e.preventDefault(); view = 'profile'; render(); };
  const logoutLink = document.getElementById('landingLogoutLink'); if (logoutLink) logoutLink.onclick = async (e) => { e.preventDefault(); await authSignOut(); view = 'auth'; render(); };
  const signupLink = document.getElementById('landingSignupLink'); if (signupLink) signupLink.onclick = (e) => { e.preventDefault(); authFormState = { loading: false, error: '', info: '' }; view = 'auth-signup'; render(); };
  const signupLink2 = document.getElementById('landingSignupLink2'); if (signupLink2) signupLink2.onclick = (e) => { e.preventDefault(); authFormState = { loading: false, error: '', info: '' }; view = 'auth-signup'; render(); };
  const signinLink = document.getElementById('landingSigninLink'); if (signinLink) signinLink.onclick = (e) => { e.preventDefault(); authFormState = { loading: false, error: '', info: '' }; view = 'auth-signin'; render(); };
  const findOpponentBtn = document.getElementById('findOpponentBtn'); if (findOpponentBtn) findOpponentBtn.onclick = openMatchmakingModal;
  attachMatchmakingEvents();
  if (authState.user && !authState._stats) {
    fetchStatistics(authState.user.id).then(s => { authState._stats = s || {}; if (mmState.isOpen) render(); });
  }
}

  const room = currentRoom;
  const isHost = room.players.find(p => p.id === myId)?.isHost;
  return `<div class="screen">
    <div class="eyebrow">\u0425\u04af\u043b\u044d\u044d\u043b\u0433\u0438\u0439\u043d \u04e9\u0440\u04e9\u04e9</div>

function renderMobileActionDock(room, myTurn, me, currentPlayer, d1, d2, rolling) {
  const locked = isAnimatingMovement || buildingAnimationActive || rentCinematicActive || wealthModalOpen || (room.cardDraw && !room.cardDraw.resolved);
  const pending = room.pendingAction && room.pendingAction.playerId === myId;
  const rollDisabled = !myTurn || room.hasRolled || room.pendingAction || locked;
  const endDisabled = !myTurn || !room.hasRolled || room.pendingAction || locked;

  let centerHtml;
  if (pending && room.pendingAction.type === 'buy') {
    centerHtml = `<button class="mad-roll-btn mad-alt-btn" id="mobileBuyBtn"><span class="mad-alt-icon">\ud83d\udcb0</span><span>\u0410\u0412\u0410\u0425</span></button>`;
  } else if (pending && room.pendingAction.type === 'build') {
    centerHtml = `<button class="mad-roll-btn mad-alt-btn" id="mobileBuildBtn"><span class="mad-alt-icon">\ud83c\udfd7\ufe0f</span><span>\u0411\u0410\u0420\u0418\u0425</span></button>`;
  } else {
    centerHtml = `<button class="mad-roll-btn" id="mobileRollBtn" ${rollDisabled ? 'disabled' : ''}>
      <span class="mad-dice-pair">${renderDie(d1, rolling)}${renderDie(d2, rolling)}</span>
      <span class="mad-roll-label">\u0428\u041e\u041e \u0425\u0410\u042f\u0425</span>
    </button>`;
  }

  const statusText = pending && room.pendingAction.type === 'buy' ? '\u0425\u0423\u0414\u0410\u041b\u0414\u0410\u0416 \u0410\u0412\u0410\u0425 \u0423\u0423?'
    : pending && room.pendingAction.type === 'build' ? '\u0411\u0410\u0420\u0418\u0425 \u0423\u0423?'
    : (room.cardDraw && !room.cardDraw.resolved) ? '\u041a\u0410\u0420\u0422 \u0428\u0418\u0419\u0414\u0412\u042d\u0420\u041b\u042d\u0416 \u0411\u0410\u0419\u041d\u0410'
    : myTurn ? '\u0422\u0410\u041d\u042b \u042d\u042d\u041b\u0416' : `${currentPlayer.name}-\u0418\u0419\u041d \u042d\u042d\u041b\u0416`;

  const endBtnHtml = pending && room.pendingAction.type === 'buy'
    ? `<button class="mad-endturn-btn mad-skip-btn" id="mobileSkipBuyBtn">\u25c6 \u0410\u041b\u0413\u0410\u0421\u0410\u0425</button>`
    : pending && room.pendingAction.type === 'build'
    ? `<button class="mad-endturn-btn mad-skip-btn" id="mobileSkipBuildBtn">\u25c6 \u0410\u041b\u0413\u0410\u0421\u0410\u0425</button>`
    : `<button class="mad-endturn-btn" id="mobileEndTurnBtn" ${endDisabled ? 'disabled' : ''}>\u25c6 \u042d\u042d\u041b\u0416 \u0414\u0423\u0423\u0421\u0413\u0410\u0425</button>`;

  return `<div class="mobile-action-dock">
    <div class="mad-row">
      <button class="mad-side-btn" id="madCompanyBtn"><span class="mad-side-icon">\ud83c\udfe2</span><span>\u041a\u041e\u041c\u041f\u0410\u041d\u0418</span></button>
      ${centerHtml}
      <button class="mad-side-btn" id="madWealthBtn"><span class="mad-side-icon">\ud83d\udcb0</span><span>\u0425\u04e8\u0420\u04e8\u041d\u0413\u04e8</span></button>
    </div>
    <div class="mad-status ${myTurn && !pending ? 'mad-status-active' : ''}">\u2756 ${statusText} \u2756</div>
    ${endBtnHtml}
  </div>`;
}

  return `<div class="sb-header">

function renderPlayersPanel(room, currentPlayer) {
  const maxWorth = Math.max(1, ...room.players.map(p => netWorth(room, p)));
  const rows = room.players.map(p => {
    const worth = netWorth(room, p);
    const ownedCount = Object.values(room.propOwner).filter(oid => oid === p.id).length;
    const pct = Math.max(4, Math.round(worth / maxWorth * 100));
    const isCurrent = p.id === currentPlayer.id;
    return `<div class="sb-player-card ${isCurrent ? 'sb-player-current' : ''} ${p.bankrupt ? 'sb-player-bankrupt' : ''}" style="--pcolor:${p.color}">
      ${isCurrent ? '<span class="sb-crown">\ud83d\udc51</span>' : ''}
      <div class="sb-player-top">
        <span class="sb-player-avatar" style="--ring-color:${p.color}">${p.token}</span>
        <span class="sb-player-name">${p.name}${p.id === myId ? ' <em>(\u0442\u0430)</em>' : ''}</span>
        <span class="sb-player-props">\ud83c\udfe2${ownedCount}</span>
        <span class="sb-player-money">\u20ae${fmt(p.money)}</span>
      </div>
      <div class="sb-progress-track"><div class="sb-progress-fill" style="width:${pct}%; background:${p.color};"></div></div>
    </div>`;
  }).join('');
  return `<div class="sb-panel"><div class="sb-panel-title">\u25c8 \u0422\u041e\u0413\u041b\u041e\u0413\u0427\u0418\u0414 \u25c8</div>${rows}</div>`;
}

  if (isAnimatingMovement) {
    return `<div class="sb-panel sb-dice-panel"><div class="sb-panel-title">\u25c8 \u0422\u0410\u041d\u042b \u042d\u042d\u041b\u0416 \u25c8</div>

  }
  if (buildingAnimationActive) {
    return `<div class="sb-panel sb-dice-panel"><div class="sb-panel-title">\u25c8 \u0422\u0410\u041d\u042b \u042d\u042d\u041b\u0416 \u25c8</div>
      <div class="sb-waiting"><span class="pulse-dot"></span>\ud83c\udfd7\ufe0f \u0411\u0430\u0440\u0438\u043b\u0433\u0430 \u0431\u0430\u0440\u0438\u0433\u0434\u0430\u0436 \u0431\u0430\u0439\u043d\u0430...</div>

    </div>`;
  }
  if (rentCinematicActive) {
    return `<div class="sb-panel sb-dice-panel"><div class="sb-panel-title">\u25c8 \u0422\u0410\u041d\u042b \u042d\u042d\u041b\u0416 \u25c8</div>
      <div class="sb-waiting"><span class="pulse-dot"></span>\ud83d\udcb8 \u0422\u04af\u0440\u044d\u044d\u0441 \u0448\u0438\u043b\u0436\u0438\u0436 \u0431\u0430\u0439\u043d\u0430...</div>

    </div>`;
  }
  if (room.cardDraw && !room.cardDraw.resolved) {
    return `<div class="sb-panel sb-dice-panel"><div class="sb-panel-title">\u25c8 \u0422\u0410\u041d\u042b \u042d\u042d\u041b\u0416 \u25c8</div>
      <div class="sb-waiting">\ud83c\udccf \u041a\u0430\u0440\u0442 \u0448\u0438\u0439\u0434\u0432\u044d\u0440\u043b\u044d\u0436 \u0431\u0430\u0439\u043d\u0430...</div>
      <button class="sb-dice-btn" disabled>\ud83d\udd12 \u0428\u041e\u041e \u0425\u0410\u042f\u0425</button>

    </div>`;
  }
  if (room.pendingAction && room.pendingAction.playerId === myId && room.pendingAction.type === 'buy') {
    return `<div class="sb-panel sb-dice-panel"><div class="sb-panel-title">\u25c8 \u0425\u0423\u0414\u0410\u041b\u0414\u0410\u0410\u041d\u042b \u0417\u04e8\u0412\u0428\u04e8\u04e8\u0420\u04e8\u041b \u25c8</div>
      <div class="sb-waiting">\ud83d\udcc4 \u0421\u0430\u043d\u0430\u043b\u044b\u0433 \u0445\u04af\u043b\u044d\u044d\u0436 \u0431\u0430\u0439\u043d\u0430...</div>
      <button class="sb-dice-btn" disabled>\ud83d\udd12 \u0428\u041e\u041e \u0425\u0410\u042f\u0425</button>

  }
  if (room.pendingAction && room.pendingAction.playerId === myId && room.pendingAction.type === 'build') {
    const sp = BOARD_CONFIG[room.pendingAction.spaceIndex];

/* ===== WEALTH CANDLESTICK CHART ===== */
const CHART_MARKER_ICON = {
  buy_company: { icon: '\ud83c\udfe2', color: '#f5c94f' },
  receive_rent: { icon: '\ud83e\ude99', color: '#23d18b' },
  pay_rent: { icon: '\ud83e\ude99', color: '#ef5b5b' },
  build_house: { icon: '\ud83c\udfe0', color: '#4599ff' },
  build_corporation: { icon: '\ud83d\uddfc', color: '#a855f7' },
  tax: { icon: '\u2b07\ufe0f', color: '#ef5b5b' },
  chance_card: { icon: '\u2b50', color: '#f5c94f' },
  pass_go: { icon: '\ud83e\ude99', color: '#23d18b' },
};
function renderCandlestickSVG(candles, opts) {
  opts = opts || {};
  const w = opts.width || 560, h = opts.height || 200;
  const padL = 44, padR = 14, padT = 16, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  if (!candles || candles.length === 0) {
    return `<svg viewBox="0 0 ${w} ${h}" class="wealth-chart-svg"><text x="${w/2}" y="${h/2}" text-anchor="middle" fill="var(--chart-text)" font-size="12">\u041e\u0434\u043e\u043e\u0433\u043e\u043e\u0440 \u0442\u04af\u04af\u0445 \u0431\u0430\u0439\u0445\u0433\u04af\u0439</text></svg>`;
  }
  const allVals = candles.flatMap(c => [c.high, c.low]);
  let vMin = Math.min(...allVals), vMax = Math.max(...allVals);
  if (vMin === vMax) { vMin -= 100; vMax += 100; }
  const vPad = (vMax - vMin) * 0.1;
  vMin -= vPad; vMax += vPad;
  const yOf = v => padT + plotH - ((v - vMin) / (vMax - vMin)) * plotH;
  const n = candles.length;
  const slot = plotW / n;
  const candleW = Math.max(3, Math.min(22, slot * 0.55));

  let gridHtml = '';
  for (let i = 0; i <= 4; i++) {
    const gy = padT + (plotH / 4) * i;
    const val = vMax - ((vMax - vMin) / 4) * i;
    gridHtml += `<line x1="${padL}" y1="${gy}" x2="${w - padR}" y2="${gy}" stroke="var(--chart-grid)" stroke-width="1"></line>
      <text x="${padL - 6}" y="${gy + 3}" text-anchor="end" font-size="9" fill="var(--chart-text)" opacity="0.7">\u20ae${fmt(val)}</text>`;
  }

  let candlesHtml = '';
  candles.forEach((c, i) => {
    const cx = padL + slot * i + slot / 2;
    const isUp = c.close > c.open;
    const isFlat = c.close === c.open;
    const color = isFlat ? 'var(--candle-neutral)' : (isUp ? 'var(--candle-up)' : 'var(--candle-down)');
    const yHigh = yOf(c.high), yLow = yOf(c.low);
    const yOpen = yOf(c.open), yClose = yOf(c.close);
    const bodyTop = Math.min(yOpen, yClose), bodyBot = Math.max(yOpen, yClose);
    const bodyH = Math.max(1.5, bodyBot - bodyTop);
    candlesHtml += `<g class="wealth-candle" data-round="${c.round}" data-open="${c.open}" data-high="${c.high}" data-low="${c.low}" data-close="${c.close}" data-change="${c.change}" data-changepct="${c.changePercent.toFixed(2)}">
      <line x1="${cx}" y1="${yHigh}" x2="${cx}" y2="${yLow}" stroke="${color}" stroke-width="1.5"></line>
      <rect x="${cx - candleW/2}" y="${bodyTop}" width="${candleW}" height="${bodyH}" fill="${color}" rx="1"></rect>
    </g>`;
    if (c.events && c.events.length > 0 && opts.showMarkers !== false) {
      const uniqueTypes = [...new Set(c.events.map(e => e.type))].slice(0, 3);
      uniqueTypes.forEach((type, mi) => {
        const m = CHART_MARKER_ICON[type] || { icon: '\u2022', color: '#e4b943' };
        const my = yHigh - 12 - mi * 13;
        candlesHtml += `<text class="wealth-marker" data-round="${c.round}" data-type="${type}" x="${cx}" y="${my}" text-anchor="middle" font-size="10" style="cursor:pointer;">${m.icon}</text>`;
      });
    }
  });

  const lastClose = candles[candles.length - 1].close;
  const lineY = yOf(lastClose);
  const lineHtml = `<line x1="${padL}" y1="${lineY}" x2="${w - padR}" y2="${lineY}" stroke="${opts.playerColor || 'var(--crosshair)'}" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"></line>`;

  return `<svg viewBox="0 0 ${w} ${h}" class="wealth-chart-svg" role="img" aria-label="\u0425\u04e9\u0440\u04e9\u043d\u0433\u0438\u0439\u043d \u0433\u0440\u0430\u0444\u0438\u043a, ${n} \u04af\u0435">
    ${gridHtml}${lineHtml}${candlesHtml}
  </svg>`;
}
function renderMiniWealthChart(room, player) {
  const hist = (room.wealthHistory && room.wealthHistory[player.id]) || [];
  const last5 = hist.slice(-5);
  const latest = hist.length > 0 ? hist[hist.length - 1] : null;
  const netWorth = latest ? latest.close : netWorth2(room, player);
  const changePct = latest ? latest.changePercent : 0;
  const arrow = changePct > 0 ? '\u25b2' : (changePct < 0 ? '\u25bc' : '\u2013');
  const colorClass = changePct > 0 ? 'wc-up' : (changePct < 0 ? 'wc-down' : 'wc-flat');
  return `<div class="sb-panel wealth-mini-panel">
    <div class="sb-panel-title">\u25c8 \u0425\u04e8\u0420\u04e8\u041d\u0413\u0418\u0419\u041d \u0413\u0420\u0410\u0424\u0418\u041a \u25c8</div>
    <div class="wc-mini-header">
      <span class="wc-mini-value">\u20ae${fmt(netWorth)}</span>
      <span class="wc-mini-change ${colorClass}">${arrow} ${Math.abs(changePct).toFixed(1)}%</span>
    </div>
    ${renderCandlestickSVG(last5, { width: 280, height: 90, showMarkers: false })}
    <button class="wc-detail-btn" id="wealthChartDetailBtn" data-player="${player.id}">\u0414\u044d\u043b\u0433\u044d\u0440\u044d\u043d\u0433\u04af\u0439 \u2192</button>
  </div>`;
}
function netWorth2(room, player) { return computePlayerWealth(room, player).total; }

function renderMarketEffectsPanel(room) {
  const effects = room.activeMarketEffects || [];
  if (effects.length === 0) return '';
  const badges = effects.map(eff => {
    const card = findCardById('market', eff.sourceCardId);
    const pct = Math.round((eff.multiplier - 1) * 100);
    const sign = pct >= 0 ? '+' : '';
    const label = card ? card.title : eff.effectType;
    return `<div class="market-effect-badge" data-tip="${label}">
      <span class="me-icon">\ud83d\udcc8</span>
      <span class="me-text">${label} ${sign}${pct}%</span>
      <span class="me-rounds">${eff.remainingRounds} \u04af\u0435</span>
    </div>`;
  }).join('');
  return `<div class="sb-panel"><div class="sb-panel-title">\u25c8 \u0417\u0410\u0425 \u0417\u042d\u042d\u041b\u0418\u0419\u041d \u041d\u04e8\u041b\u04e8\u04e8 \u25c8</div>${badges}</div>`;
}

function renderActivityTimeline(room) {
  const recent = room.log.slice(-3).reverse();
  const items = recent.map((line, i) => {
    const playerMatch = room.players.find(p => line.startsWith(p.name));
    const avatar = playerMatch ? playerMatch.token : '\ud83d\udcdc';
    const color = playerMatch ? playerMatch.color : 'var(--gold)';
    const text = playerMatch ? line.slice(playerMatch.name.length).replace(/^[:\s]+/, '') : line;
    return `<div class="sb-timeline-item">
      <span class="sb-timeline-dot" style="background:${color};"></span>
      <span class="sb-timeline-avatar">${avatar}</span>
      <div class="sb-timeline-body"><span class="sb-timeline-player" style="color:${color};">${playerMatch ? playerMatch.name : ''}</span> <span class="sb-timeline-text">${text}</span></div>
      <span class="sb-timeline-time">${timeAgoLabel(i)}</span>

  }).join('');
  return `<div class="sb-panel"><div class="sb-panel-title">\u25c8 \u0421\u04af\u04af\u041b\u0418\u0419\u041d \u04ae\u0419\u041b \u042f\u0412\u0414\u0410\u041b \u25c8</div>
    <div class="sb-timeline">${items || `<div class="sb-empty-state">\u0410\u043b\u0438 \u04af\u0439\u043b \u044f\u0432\u0434\u0430\u043b \u0431\u0430\u0439\u0445\u0433\u04af\u0439.</div>`}</div>

function showFullLogModal(room) {

function renderRentCinematic(room, txn) {
  const sp = BOARD_CONFIG[txn.tileIdx];
  const payer = room.players.find(p => p.id === txn.payerId);
  const owner = room.players.find(p => p.id === txn.ownerId);
  if (!payer || !owner) return '';
  const b = txn.breakdown;
  const fileName = BUILDING_FILE_MAP[sp.buildingType] || sp.buildingType;
  const intensity = getRentIntensity(txn);
  const showFlow = rentCinematicStage !== 'appear';
  const showResult = rentCinematicStage === 'received' || rentCinematicStage === 'done';
  const isCorp = b.level >= 4;

  const breakdownRows = [];
  breakdownRows.push({ label: '\u0421\u0443\u0443\u0440\u044c \u0442\u04af\u0440\u044d\u044d\u0441', value: b.baseRent, plain: true });
  if (b.buildingBonus > 0) breakdownRows.push({ label: isCorp ? '\u041a\u043e\u0440\u043f\u043e\u0440\u0430\u0446\u0438\u0439\u043d \u043d\u044d\u043c\u044d\u0433\u0434\u044d\u043b' : `${b.level} \u0431\u0430\u0439\u0448\u0438\u043d\u0433\u0438\u0439\u043d \u043d\u044d\u043c\u044d\u0433\u0434\u044d\u043b`, value: b.buildingBonus, plain: false });
  if (b.sectorBonus > 0) breakdownRows.push({ label: `\u0421\u0430\u043b\u0431\u0430\u0440\u044b\u043d \u0431\u043e\u043d\u0443\u0441 +${b.sectorBonusPct}%`, value: b.sectorBonus, plain: false });
  if (b.marketBonus !== 0) breakdownRows.push({ label: `\u0417\u0430\u0445 \u0437\u044d\u044d\u043b\u0438\u0439\u043d \u043d\u04e9\u043b\u04e9\u04e9 \u00d7${b.marketMultiplier.toFixed(2)}`, value: b.marketBonus, plain: false });

  return `<div class="rent-cinematic rent-${intensity.key}">
    <div class="results-backdrop"></div>
    <div class="rent-cinematic-inner">
      <div class="rent-side rent-side-payer ${rentCinematicStage==='flying'?'rent-shake':''}">
        <span class="rent-avatar rent-avatar-payer" style="--ring-color:${payer.color}">${payer.token}</span>
        <div class="rent-pname">${payer.name}</div>
        <div class="rent-balance rent-balance-payer">${showResult ? `<span class="count-value" data-count-from="${txn.payerBalanceBefore}" data-count-to="${txn.payerBalanceAfter}">\u20ae${fmt(txn.payerBalanceBefore)}</span>` : `\u20ae${fmt(txn.payerBalanceBefore)}`}</div>
        ${showFlow ? `<div class="rent-delta rent-delta-neg">\u2212\u20ae${fmt(b.total)}</div>` : ''}
      </div>

      <div class="rent-center">
        ${isCorp ? `<div class="rent-corp-badge">\ud83c\udfe6 \u041a\u041e\u0420\u041f\u041e\u0420\u0410\u0426\u0418\u0419\u041d \u0422\u04ae\u0420\u042d\u042d\u0421</div>` : ''}
        <div class="rent-title">\u0422\u04ae\u0420\u042d\u042d\u0421 \u0422\u04e8\u041b\u04e8\u0425</div>
        <div class="rent-company-icon"><img src="${fileName}.png" onerror="this.style.display='none'"></div>
        <div class="rent-company-name">${sp.name}</div>
        <div class="rent-breakdown">
          ${breakdownRows.map(r => `<div class="rent-breakdown-row"><span>${r.label}</span><span>${r.plain ? '' : '+'}\u20ae${fmt(r.value)}</span></div>`).join('')}
          <div class="rent-breakdown-total"><span>\u041d\u0418\u0419\u0422 \u0422\u04ae\u0420\u042d\u042d\u0421</span><span>\u20ae${fmt(b.total)}</span></div>
        </div>
        ${intensity.label ? `<div class="rent-intensity-label">${intensity.label}</div>` : ''}
        ${rentCinematicStage === 'flying' && !reducedMotion ? `<div class="rent-coin-fly">${Array.from({length: Math.min(14, Math.max(8, Math.round(b.total/40)))}, (_, i) => `<span style="--delay:${(i*0.05).toFixed(2)}s;">\ud83e\ude99</span>`).join('')}</div>` : ''}
      </div>

      <div class="rent-side rent-side-owner ${rentCinematicStage==='received'?'rent-bounce':''}">

        <div class="rent-pname">${owner.name}</div>
        <div class="rent-balance rent-balance-owner">${showResult ? `<span class="count-value" data-count-from="${txn.ownerBalanceBefore}" data-count-to="${txn.ownerBalanceAfter}">\u20ae${fmt(txn.ownerBalanceBefore)}</span>` : `\u20ae${fmt(txn.ownerBalanceBefore)}`}</div>
        ${showResult ? `<div class="rent-delta rent-delta-pos">+\u20ae${fmt(b.total)}</div><span class="rent-owner-crown">\ud83d\udc51</span>` : ''}

    ${txn.payerBalanceAfter < 0 ? `<div class="rent-debt-notice">
      <div class="rent-debt-title">\u0422\u04e8\u041b\u0411\u04e8\u0420 \u0425\u04ae\u0420\u042d\u041b\u0426\u042d\u0425\u0413\u04ae\u0419</div>
      <div class="rent-debt-row"><span>\u0422\u04e9\u043b\u04e9\u0445 \u0434\u04af\u043d:</span><span>\u20ae${fmt(b.total)}</span></div>
      <div class="rent-debt-row"><span>\u0411\u044d\u043b\u044d\u043d \u043c\u04e9\u043d\u0433\u04e9:</span><span>\u20ae${fmt(txn.payerBalanceBefore)}</span></div>

    </div>` : ''}
  </div>`;
}

        ${ach.bestRentIncome ? `<div class="results-achieve-card"><span class="ra-icon">\ud83d\udcb0</span><span class="ra-value">\u20ae${fmt(ach.bestRentIncome.amount)}</span><span class="ra-label">\u0425\u0430\u043c\u0433\u0438\u0439\u043d \u0438\u0445 \u0442\u04af\u0440\u044d\u044d\u0441\u0438\u0439\u043d \u043e\u0440\u043b\u043e\u0433\u043e (${ach.bestRentIncome.name})</span></div>` : ''}
        ${ach.highestSingleRent ? `<div class="results-achieve-card"><span class="ra-icon">\u26a1</span><span class="ra-value">\u20ae${fmt(ach.highestSingleRent.amount)}</span><span class="ra-label">\u0425\u0430\u043c\u0433\u0438\u0439\u043d \u04e9\u043d\u0434\u04e9\u0440 \u043d\u044d\u0433 \u0443\u0434\u0430\u0430\u0433\u0438\u0439\u043d \u0442\u04af\u0440\u044d\u044d\u0441 (${ach.highestSingleRent.name})</span></div>` : ''}
        ${ach.totalRentPaid > 0 ? `<div class="results-achieve-card"><span class="ra-icon">\ud83d\udcca</span><span class="ra-value">\u20ae${fmt(ach.totalRentPaid)}</span><span class="ra-label">\u041d\u0438\u0439\u0442 \u0442\u04e9\u043b\u0441\u04e9\u043d \u0442\u04af\u0440\u044d\u044d\u0441</span></div>` : ''}
      </div>
      <div class="results-wealth-charts">
        <div class="results-stage-subtitle">\u25c8 \u0425\u04e8\u0420\u04e8\u041d\u0413\u0418\u0419\u041d \u0413\u0420\u0410\u0424\u0418\u041a \u25c8</div>
        ${room.players.map(p => {
          const hist = (room.wealthHistory && room.wealthHistory[p.id]) || [];
          return `<div class="results-player-chart">
            <div class="results-player-chart-head" style="--ring-color:${p.color}">${p.token} ${p.name}</div>
            ${renderCandlestickSVG(hist, { width: 560, height: 130, playerColor: p.color })}
          </div>`;
        }).join('')}
      </div>`;
  } else if (stage === 'podium' || stage === 'celebration' || stage === 'completed') {
    const top3 = rankings.slice(0, Math.min(3, rankings.length));
    const podiumOrder = top3.length === 3 ? [1, 0, 2] : [0, 1];
    bodyHtml = `<div class="results-stage-title">\u25c8 \u0428\u0410\u0422\u041b\u0410\u041b \u25c8</div>
      <div class="results-podium ${stage === 'celebration' || stage === 'completed' ? 'results-podium-lit' : ''}">

          return `<div class="podium-block podium-rank-${rank}">

        <div class="winner-crown">\ud83d\udc51</div>

function attachResultsEvents() {

  const menuBtn = document.getElementById('resultsMenuBtn'); if (menuBtn) menuBtn.onclick = () => { gameResults.isOpen = false; view = 'landing'; render(); };
  const detailsBtn = document.getElementById('resultsDetailsBtn'); if (detailsBtn) detailsBtn.onclick = () => showFullLogModal(currentRoom);
}
function animateRentCounters() {
  const els = document.querySelectorAll('.rent-cinematic .count-value[data-count-from]');
  if (els.length === 0) return;
  const dur = reducedMotion ? 250 : 900;
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    els.forEach(el => {
      const from = parseFloat(el.dataset.countFrom) || 0;
      const to = parseFloat(el.dataset.countTo) || 0;
      el.textContent = '\u20ae' + fmt(Math.round(from + (to - from) * eased));
    });
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function animateResultsCounters() {
  const els = document.querySelectorAll('.count-value[data-target]');
  const dur = reducedMotion ? 300 : 1400;
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    els.forEach(el => {
      const target = parseFloat(el.dataset.target) || 0;
      el.textContent = '\u20ae' + fmt(Math.round(target * eased));
    });
    if (t < 1) requestAnimationFrame(tick); else els.forEach(el => { el.textContent = '\u20ae' + fmt(parseFloat(el.dataset.target) || 0); });
  }
  requestAnimationFrame(tick);
}

function renderGame() {
  const room = currentRoom;
  if (room.winnerId && gameResults.isOpen) {
    return renderGameResultsCinematic(room);
  }
  const me = room.players.find(p => p.id === myId);
  const myTurn = isMyTurn(room);
  const currentPlayer = room.players[room.currentPlayerIndex];
  const d1 = diceRollingNow && diceTempFaces ? diceTempFaces[0] : (room.lastDice ? room.lastDice[0] : null);
  const d2 = diceRollingNow && diceTempFaces ? diceTempFaces[1] : (room.lastDice ? room.lastDice[1] : null);

  const CORNER_IDS = [0,8,16,24];
  let tilesHtml = '';
  let debugZonesHtml = '';
  const buildingsToRender = [];
  const upgradesToRender = [];
  BOARD_CONFIG.forEach(tile => {
    const idx = tile.id;
    const owner = room.propOwner[idx] ? room.players.find(p => p.id === room.propOwner[idx]) : null;
    const isFullGroup = owner && tile.type === 'property' && ownsFullGroup(room, owner.id, idx);
    const isActivePos = displayPos(room, currentPlayer) === idx;
    const level = tile.type === 'property' ? houseLevel(room, idx) : 0;
    const isCorner = CORNER_IDS.includes(idx);
    const pts = tile.polygon.map(p => p.join(',')).join(' ');
    const lines = wrapLabel(shortLabel(tile.name), isCorner ? 10 : 8);
    const fontSize = isCorner ? 15 : 12.5;
    let tspans = `<tspan x="${tile.labelX}" dy="${lines.length > 1 ? '-0.55em' : '0.3em'}">${lines[0]}</tspan>`;
    if (lines[1]) tspans += `<tspan x="${tile.labelX}" dy="1.05em">${lines[1]}</tspan>`;
    if (tile.price) tspans += `<tspan class="tile-price" x="${tile.labelX}" dy="1.15em" font-size="${fontSize*0.78}">\u20ae${fmt(tile.price)}</tspan>`;
    const vs = getTileVisualState(tile, room, currentPlayer, me);
    const ownerStyle = owner ? `--owner-color:${owner.color}; --owner-fill:${hexToRgba(owner.color,0.28)};` : '';
    const stateClasses = tileStateClasses(vs);
    const ariaLabel = tileAriaLabel(tile, vs);
    const debugStateLabel = debugMode ? Object.keys(vs).filter(k => vs[k] === true).join(' ') : '';
    tilesHtml += `<g class="tile ${stateClasses} ${isFullGroup?'group-complete':''}"
      data-idx="${idx}" style="${ownerStyle}"
      role="button" tabindex="0" aria-label="${ariaLabel}">
      <polygon class="tile-hit-area" points="${pts}" vector-effect="non-scaling-stroke"></polygon>
      <polygon class="tile-surface" points="${pts}" vector-effect="non-scaling-stroke"></polygon>
      ${''}
      <text x="${tile.labelX}" y="${tile.labelY}" text-anchor="middle" font-size="${fontSize}" transform="rotate(${tile.labelRotation} ${tile.labelX} ${tile.labelY})">${tspans}</text>
      ${owner ? `<circle class="owner-dot" cx="${tile.labelX + 22}" cy="${tile.labelY - 22}" r="9" fill="${owner.color}" stroke="#18382d" stroke-width="1.5"></circle>` : ''}
      ${vs.mortgaged ? `<g class="mortgage-lock" transform="translate(${tile.labelX},${tile.labelY + 20})"><rect x="-7" y="-2" width="14" height="10" rx="2" fill="#2b3440" stroke="#c8ccd6" stroke-width="1"></rect><path d="M -4 -2 L -4 -6 A 4 4 0 0 1 4 -6 L 4 -2" fill="none" stroke="#c8ccd6" stroke-width="1.6"></path></g>` : ''}
      ${debugMode ? `<text x="${tile.labelX}" y="${tile.labelY + 34}" text-anchor="middle" font-size="6.5" fill="#fff" stroke="#000" stroke-width="0.3" paint-order="stroke">${idx}: ${debugStateLabel}</text>` : ''}
    </g>`;
    if (debugMode && tile.type === 'property') {
      const zonePts = tile.buildingZone ? tile.buildingZone.map(p => p.join(',')).join(' ') : '';
      debugZonesHtml += `<g class="debug-overlay">
        ${zonePts ? `<polygon points="${zonePts}" fill="rgba(40,140,255,0.35)" stroke="#2b8cff" stroke-width="1.5"></polygon>` : ''}
        <circle cx="${tile.buildingX}" cy="${tile.buildingY}" r="4" fill="#ffd400" stroke="#000" stroke-width="0.8"></circle>
        <circle cx="${tile.labelX}" cy="${tile.labelY}" r="4" fill="#22c55e" stroke="#000" stroke-width="0.8"></circle>
      </g>`;
    }
    if (debugMode) {
      const wpPts = tile.movementWaypoints ? tile.movementWaypoints.map(p => `${p[0]},${p[1]}`).join(' ') : '';
      debugZonesHtml += `<g class="debug-overlay">
        ${wpPts ? `<polyline points="${wpPts}" fill="none" stroke="#ff8a00" stroke-width="1.5" stroke-dasharray="3,2"></polyline>` : ''}
        <circle cx="${tile.tokenX}" cy="${tile.tokenY}" r="4.5" fill="#ff8a00" stroke="#000" stroke-width="1"></circle>
        <text x="${tile.tokenX}" y="${tile.tokenY - 9}" text-anchor="middle" font-size="9" fill="#fff" stroke="#000" stroke-width="0.4" paint-order="stroke">${idx}</text>
      </g>`;
    }
    let constructionHtml = '';
    if (owner && tile.buildingType) {
      const ownerIdx = room.players.findIndex(p => p.id === owner.id);
      buildingsToRender.push({ tile, level, idx, depth: tile.depth });
      const isConstructing = buildingAnim && buildingAnim.tileId === idx && buildingAnim.stage !== 'completed';
      if (isConstructing) {
        constructionHtml = renderBuildingConstructionOverlay(tile, idx, owner, buildingAnim, room);
      } else {
        upgradesToRender.push({ tile, level, idx, depth: tile.depth + 0.5, ownerIdx, owner });
      }
    }
    if (constructionHtml) upgradesToRender.push({ tile, level, idx, depth: tile.depth + 0.5, ownerIdx: -1, owner, __rawHtml: constructionHtml });
  });
  buildingsToRender.sort((a, b) => a.depth - b.depth);
  const buildingsHtml = buildingsToRender.map(b => renderBuildingIcon(b.tile, b.level, b.idx)).join('');
  upgradesToRender.sort((a, b) => a.depth - b.depth);
  const upgradesHtml = upgradesToRender.map(u => u.__rawHtml || renderUpgradeIcons(u.tile, u.level, u.idx, u.ownerIdx)).join('');

  const clampPct = v => Math.min(97, Math.max(3, v));
  const tokenOffsets = [[-14,-8],[14,-8],[-14,10],[14,10]];
  const tokensHtml = room.players.filter(p => !p.bankrupt).map(p => {
    const pos = displayPos(room, p);
    const tile = BOARD_CONFIG[pos];
    const sameTile = room.players.filter(o => !o.bankrupt && displayPos(room, o) === pos).sort((a,b) => a.id.localeCompare(b.id));
    const slot = Math.max(0, sameTile.findIndex(o => o.id === p.id));
    const off = tokenOffsets[slot % 4];
    const left = clampPct((tile.tokenX + off[0]) / 1672 * 100);
    const top = clampPct((tile.tokenY + off[1]) / 941 * 100);
    const isMover = isAnimatingMovement && movingPlayerId === p.id;
    const scale = tile.tokenScale || 0.85;
    return `<div class="ptoken ${isMover ? (reducedMotion ? 'token-hop-reduced' : 'token-hop') : ''}"
      style="left:${left}%; top:${top}%; --token-ring:${p.color}; --token-scale:${scale}; z-index:${isMover ? 20 : 10 + Math.round(tile.tokenY / 20)};">${p.token}</div>`;
  }).join('');

  const camZoom = (buildingAnim && buildingAnim.type === 'corp' && (buildingAnim.stage === 'rising' || buildingAnim.stage === 'celebration') && !reducedMotion);
  let camStyle = '';
  const camTransform = renderCameraTransformStyle();

  return `<div class="game-wrap">
    ${isMobileView ? renderMobileHUD(room, currentPlayer) : ''}
    <div class="game-layout">
      <div class="board-outer">
        <div class="board-viewport ${debugMode?'debug':''} ${environment.timeOfDay==='night'?'env-night-active':''}" id="boardViewport">
          <div class="board-frame" id="boardFrame">
            <div class="board-camera" id="boardCamera" style="${camTransform}">
              <img class="board-image" src="board.png" alt="\u0418\u0445 \u0425\u04e9\u0440\u04e9\u043d\u0433\u04e9 \u0442\u043e\u0433\u043b\u043e\u043e\u043c\u044b\u043d \u0445\u04e9\u043b\u04e9\u0433">
              <div class="env-lighting env-${environment.timeOfDay} ${environment.isTransitioning ? 'env-transitioning' : ''}">
                <div class="env-night-overlay"></div>
                <div class="env-moonlight"></div>
                <div class="env-streetlights"></div>
              </div>
              <svg class="board-overlay" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                ${tilesHtml}
                ${debugMode ? debugZonesHtml : ''}
              </svg>
              ${buildingsHtml}
              ${upgradesHtml}
              <div class="money-float-anchor" id="moneyFloatAnchor" style="position:absolute; left:50%; top:50%;"></div>
              ${tokensHtml}
            </div>
            ${cameraState.mode === 'corporation' ? '<div class="camera-dim-overlay"></div>' : ''}
            ${debugMode ? renderCameraDebugPanel() : ''}
          </div>
          <div class="mobile-board-controls">
            <button class="mbc-btn" id="mbcZoomIn" aria-label="Zoom in">+</button>
            <button class="mbc-btn" id="mbcZoomOut" aria-label="Zoom out">\u2212</button>
            <button class="mbc-btn mbc-wide" id="mbcFullBoard">\ud83c\udfde\ufe0f \u0411\u04af\u0442\u044d\u043d \u0445\u04e9\u043b\u04e9\u0433</button>
            <button class="mbc-btn mbc-wide" id="mbcFocusPlayer">\ud83c\udfaf \u0422\u043e\u0433\u043b\u043e\u0433\u0447 \u0434\u044d\u044d\u0440</button>
          </div>
        </div>
      </div>
      <div class="game-sidebar">
        ${!isMobileView ? `
        ${renderTurnStatusHeader(room, currentPlayer)}
        ${renderPlayersPanel(room, currentPlayer)}
        ${renderDiceControlPanel(room, myTurn, me, currentPlayer, d1, d2, diceRollingNow)}
        ${me ? renderMiniWealthChart(room, me) : ''}
        ${renderMarketEffectsPanel(room)}
        ${renderOwnedCompaniesPanel(room)}

function playCardSound(kind) {
  try {
    if (!playCardSound._ctx) playCardSound._ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = playCardSound._ctx;
    const freqMap = { draw: 300, flip: 420, positive: 660, negative: 220, legendary: 880 };
    const freq = freqMap[kind] || 400;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = kind === 'negative' ? 'sawtooth' : 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.07, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
    if (kind === 'legendary') {
      [880, 1108, 1318].forEach((f, i) => {
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.type = 'sine'; o2.frequency.value = f;
        const t0 = ctx.currentTime + 0.1 + i * 0.08;
        g2.gain.setValueAtTime(0.001, t0);
        g2.gain.linearRampToValueAtTime(0.06, t0 + 0.02);
        g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
        o2.connect(g2); g2.connect(ctx.destination);
        o2.start(t0); o2.stop(t0 + 0.3);
      });
    }
  } catch (e) {}
}

function getRentIntensity(txn) {
  const ratio = txn.breakdown.total / Math.max(txn.payerBalanceBefore, 1);
  if (ratio >= 0.5) return { key: 'massive', label: '\u0410\u0421\u0410\u0420 \u0418\u0425 \u0422\u04ae\u0420\u042d\u042d\u0421!' };
  if (ratio >= 0.25) return { key: 'big', label: '\u0418\u0425 \u0422\u04ae\u0420\u042d\u042d\u0421!' };
  if (ratio >= 0.10) return { key: 'valuable', label: '\u0421\u0410\u0419\u041d \u041e\u0420\u041b\u041e\u0413\u041e' };
  return { key: 'normal', label: '' };
}

function computePlayerWealth(room, player) {
  let companyValue = 0, houseValue = 0, corporationValue = 0, companyCount = 0, corpCount = 0, houseCount = 0;
  let mortgageDebt = 0;
  Object.keys(room.propOwner).forEach(idx => {
    if (room.propOwner[idx] !== player.id) return;
    const sp = BOARD_CONFIG[idx];
    companyValue += sp.price; companyCount++;
    const level = houseLevel(room, idx);
    if (level >= 4) { corporationValue += buildingResaleValue(sp, level); corpCount++; }
    else if (level > 0) { houseValue += buildingResaleValue(sp, level); houseCount += level; }
    if (room.mortgaged && room.mortgaged[idx]) mortgageDebt += getMortgageValue(sp);
  });
  const total = player.money + companyValue + houseValue + corporationValue - mortgageDebt;
  return { playerId: player.id, cash: player.money, companyValue, houseValue, corporationValue, mortgageDebt, total, companyCount, corpCount, houseCount };
}

/* ===== ECONOMY BALANCE SIMULATION (dev tool: run in browser console as runEconomySimulation(1000)) ===== */
function runEconomySimulation(numGames) {
  numGames = numGames || 1000;
  const properties = BOARD_CONFIG.filter(t => t.type === 'property');
  const results = { durations: [], rounds: [], bankruptcies: 0, winnerWealth: [], companyProfit: {}, groupWinRate: {}, unpurchased: {} };
  properties.forEach(sp => { results.companyProfit[sp.id] = 0; results.unpurchased[sp.id] = 0; });
  ['A', 'B', 'C', 'D'].forEach(g => { results.groupWinRate[g] = 0; });

  for (let g = 0; g < numGames; g++) {
    const numPlayers = 2 + Math.floor(Math.random() * 3); // 2-4
    const players = Array.from({ length: numPlayers }, (_, i) => ({ id: i, money: ECONOMY_CONFIG.startingCash, position: 0, bankrupt: false }));
    const propOwner = {}; const houses = {};
    let turnCount = 0; const maxTurns = ECONOMY_CONFIG.matchLimits.maxRounds * numPlayers;
    let winnerId = null;

    function ownsFullGroupSim(pid, sp) {
      return properties.filter(p => p.colorGroup === sp.colorGroup).every(p => propOwner[p.id] === pid);
    }
    function rentFor(sp, ownerId) {
      const lvl = houses[sp.id] || 0;
      const m = ECONOMY_CONFIG.rentMultipliers;
      if (lvl > 0) { const mm = [m.noBuilding, m.oneHouse, m.twoHouses, m.threeHouses, m.corporation]; return Math.round(sp.rent * mm[lvl]); }
      if (ownsFullGroupSim(ownerId, sp)) return Math.round(sp.rent * ECONOMY_CONFIG.completeGroupBaseRentMultiplier);
      return sp.rent;
    }

    while (turnCount < maxTurns) {
      const active = players.filter(p => !p.bankrupt);
      if (active.length <= 1) { winnerId = active[0] ? active[0].id : null; break; }
      const cur = players[turnCount % numPlayers];
      if (!cur.bankrupt) {
        const roll = 2 + Math.floor(Math.random() * 11);
        const old = cur.position;
        cur.position = (old + roll) % properties.length === 0 ? 0 : (old + roll) % BOARD_CONFIG.length;
        if (cur.position < old) cur.money += (cur.position === 0) ? ECONOMY_CONFIG.landOnStartReward : ECONOMY_CONFIG.passStartReward;
        const sp = properties.find(p => p.id === cur.position);
        if (sp) {
          const owner = propOwner[sp.id];
          if (owner === undefined) {
            if (cur.money >= sp.price && Math.random() > 0.15) { cur.money -= sp.price; propOwner[sp.id] = cur.id; }
          } else if (owner === cur.id) {
            const lvl = houses[sp.id] || 0;
            const costs = getTierCosts(sp.tier);
            const cost = lvl + 1 >= 4 ? costs.corporationCost : costs.houseCost;
            if (lvl < 4 && ownsFullGroupSim(cur.id, sp) && cur.money >= cost && Math.random() > 0.35) { cur.money -= cost; houses[sp.id] = lvl + 1; }
          } else {
            const rent = rentFor(sp, owner);
            cur.money -= rent;
            const ownerP = players.find(p => p.id === owner);
            ownerP.money += rent;
            results.companyProfit[sp.id] += rent;
            if (cur.money < 0) { cur.bankrupt = true; results.bankruptcies++; properties.forEach(p => { if (propOwner[p.id] === cur.id) { delete propOwner[p.id]; delete houses[p.id]; } }); }
          }
        }
      }
      turnCount++;
    }
    if (!winnerId) {
      const active = players.filter(p => !p.bankrupt);
      const worths = active.map(p => {
        let w = p.money;
        properties.forEach(sp => { if (propOwner[sp.id] === p.id) { w += sp.price; const lvl = houses[sp.id] || 0; if (lvl > 0) w += buildingInvestment(sp, lvl) * ECONOMY_CONFIG.mortgageRate; } });
        return { id: p.id, w };
      }).sort((a, b) => b.w - a.w);
      winnerId = worths.length > 0 ? worths[0].id : null;
    }
    const finalWinner = players.find(p => p.id === winnerId);
    if (finalWinner) {
      let w = finalWinner.money;
      properties.forEach(sp => { if (propOwner[sp.id] === finalWinner.id) w += sp.price; });
      results.winnerWealth.push(w);
    }
    results.durations.push(turnCount);
    results.rounds.push(Math.ceil(turnCount / numPlayers));
    properties.forEach(sp => { if (propOwner[sp.id] === undefined) results.unpurchased[sp.id] = (results.unpurchased[sp.id] || 0) + 1; });
  }

  const avg = arr => arr.reduce((a, b) => a + b, 0) / (arr.length || 1);
  const bestCompany = Object.entries(results.companyProfit).sort((a, b) => b[1] - a[1])[0];
  const worstCompany = Object.entries(results.unpurchased).sort((a, b) => b[1] - a[1])[0];
  const summary = {
    games: numGames,
    avgRounds: avg(results.rounds).toFixed(1),
    avgTurnsPerGame: avg(results.durations).toFixed(1),
    estAvgMinutes: (avg(results.rounds) * 0.9).toFixed(1) + ' (\u0442\u0430\u0430\u043c\u0430\u0433, \u0440\u0430\u0443\u043d\u0434 \u0431\u04af\u0440\u0438\u0434 ~0.9\u043c\u0438\u043d)',
    bankruptcyRatePct: ((results.bankruptcies / (numGames * 3)) * 100).toFixed(1) + '% (\u0442\u0430\u0430\u043c\u0430\u0433, \u0434\u0443\u043d\u0434\u0430\u0436 3 \u0442\u043e\u0433\u043b\u043e\u0433\u0447/\u0442\u043e\u0433\u043b\u043e\u043b\u0442)',
    avgWinnerWealth: fmt(avg(results.winnerWealth)),
    mostProfitableCompany: bestCompany ? BOARD_CONFIG[bestCompany[0]].name + ' (\u20ae' + fmt(bestCompany[1] / numGames) + '/\u0442\u043e\u0433\u043b\u043e\u043b\u0442)' : 'N/A',
    leastPurchasedCompany: worstCompany ? BOARD_CONFIG[worstCompany[0]].name + ' (' + Math.round(worstCompany[1] / numGames * 100) + '% \u0442\u043e\u0433\u043b\u043e\u043b\u0442\u043e\u0434 \u0430\u0432\u0430\u0430\u0433\u04af\u0439)' : 'N/A',
  };
  console.table(summary);
  return summary;
}

function computeRankings(room) {
  const rows = room.players.map(p => computePlayerWealth(room, p));
  rows.sort((a, b) => {
    if (b.total !== a.total) return b.total - a.total;
    if (b.cash !== a.cash) return b.cash - a.cash;
    if (b.companyCount !== a.companyCount) return b.companyCount - a.companyCount;
    return b.corpCount - a.corpCount;
  });
  return rows;
}

function maybeTriggerGameResults(room) {
  if (!room || !room.winnerId) return;
  if (resultsTriggered) return;
  resultsTriggered = true;
  const rankings = computeRankings(room);
  gameResults = { isOpen: true, stage: 'counting', rankings, winnerId: room.winnerId };
  if (gameSettings.musicEnabled) audioManager.playMusic('victoryTheme');
  if (room.rankedGameId && authState.user) grantRankedReward(room, rankings);
  runResultsSequence();
}
async function grantRankedReward(room, rankings) {
  try {
    const myRankRow = rankings.find(r => r.playerId === myId);
    if (!myRankRow) return;
    const placement = rankings.findIndex(r => r.playerId === myId) + 1;
    const { data, error } = await supabaseClient.rpc('grant_game_reward', {
      p_game_id: room.rankedGameId, p_placement: placement,
      p_companies_purchased: myRankRow.companyCount || 0,
      p_houses_built: myRankRow.houseCount || 0,
      p_corporations_built: myRankRow.corpCount || 0,
      p_left_early: false,
    });
    if (!error && data && data.length > 0 && authState._stats) {
      authState._stats.level = data[0].new_level; authState._stats.xp = data[0].new_xp; authState._stats.mmr = data[0].new_mmr;
    }
  } catch (e) {}
}

function computeAchievements(room) {
  let housesBuilt = 0, corpsFounded = 0, mostCompanies = null;
  let bestRentIncome = null, highestSingleRent = null, totalRentPaid = 0;
  room.players.forEach(p => {
    const w = computePlayerWealth(room, p);
    housesBuilt += w.houseCount;
    corpsFounded += w.corpCount;
    if (!mostCompanies || w.companyCount > mostCompanies.count) mostCompanies = { name: p.name, count: w.companyCount };
    const s = p.statistics;
    if (s) {
      if (s.rentReceived > 0 && (!bestRentIncome || s.rentReceived > bestRentIncome.amount)) bestRentIncome = { name: p.name, amount: s.rentReceived };
      if (s.highestRentPaid > 0 && (!highestSingleRent || s.highestRentPaid > highestSingleRent.amount)) highestSingleRent = { name: p.name, amount: s.highestRentPaid };
      totalRentPaid += s.rentPaid;
    }
  });
  return { housesBuilt, corpsFounded, mostCompanies, bestRentIncome, highestSingleRent, totalRentPaid };
}

      <div class="detail-row"><span>\u0411\u0430\u0439\u0448\u0438\u043d \u0431\u0430\u0440\u0438\u0445 \u04af\u043d\u044d</span><span>\u20ae${fmt(tierCosts.houseCost)}</span></div>
      <div class="detail-row"><span>\u041a\u043e\u0440\u043f\u043e\u0440\u0430\u0446 \u0431\u043e\u043b\u0433\u043e\u0445 \u04af\u043d\u044d</span><span>\u20ae${fmt(tierCosts.corporationCost)}</span></div>
      <div class="detail-row"><span>\u0411\u0430\u0440\u044c\u0446\u0430\u0430\u043d\u044b \u04af\u043d\u044d</span><span>\u20ae${fmt(getMortgageValue(sp))}</span></div>
      <div class="detail-row"><span>\u04e8\u043d\u0433\u0438\u0439\u043d \u0431\u04af\u043b\u044d\u0433\u0438\u0439\u043d \u0431\u043e\u043d\u0443\u0441</span><span>+${groupBonusPct}%</span></div>
      ${marketMult !== 1 ? `<div class="detail-row"><span>\u0417\u0430\u0445 \u0437\u044d\u044d\u043b\u0438\u0439\u043d \u043d\u04e9\u043b\u04e9\u04e9</span><span>\u00d7${marketMult.toFixed(2)}</span></div>` : ''}
      <div class="detail-row"><span>\u042d\u0437\u044d\u043c\u0448\u0438\u0433\u0447</span><span>${owner ? owner.token+' '+owner.name : '\u0425\u044d\u043d \u0447 \u0431\u0438\u0448'}</span></div>
      <div class="detail-row"><span>Upgrade</span><span>${level >= 4 ? '\ud83c\udfe6 \u041a\u043e\u0440\u043f\u043e\u0440\u0430\u0446' : level > 0 ? `LV.${level}` : '\u2014'}</span></div>
      <div class="detail-row"><span>\u0411\u0430\u0440\u044c\u0446\u0430\u0430</span><span>${isMortgaged ? '\ud83d\udd12 \u0411\u0430\u0440\u044c\u0446\u0430\u0430\u043b\u0441\u0430\u043d' : '\u0423\u0433\u0443\u0439'}</span></div>`;
  } else if (sp.type === 'tax') {
    bodyHtml = `<div class="detail-row"><span>\u0422\u0430\u0442\u0432\u0430\u0440</span><span>\u20ae${fmt(sp.amount)}</span></div>`;
  } else {
    bodyHtml = `<div class="detail-row-single">\u0422\u0443\u0441\u0433\u0430\u0439 \u043d\u04af\u0434 \u2014 \u0445\u0443\u0434\u0430\u043b\u0434\u0430\u0436 \u0430\u0432\u0430\u0445 \u0431\u043e\u043b\u043e\u043c\u0436\u0433\u04af\u0439</div>`;
  }
  if (isMobileView) {
    root.innerHTML = `<div class="card-popup-backdrop bottom-sheet-backdrop" id="detailBackdrop">
      <div class="bottom-sheet">
        <div class="bottom-sheet-handle"></div>
        <div class="card-popup-eyebrow">${sp.name}</div>${bodyHtml}
        <button class="btn btn-secondary" id="closeDetailBtn" style="margin-top:14px;">\u0425\u0430\u0430\u0445</button>
      </div>
    </div>`;
  } else {
    root.innerHTML = `<div class="card-popup-backdrop" id="detailBackdrop"><div class="card-popup detail-popup">
      <div class="card-popup-eyebrow">${sp.name}</div>${bodyHtml}
      <button class="btn btn-secondary" id="closeDetailBtn" style="margin-top:14px;">\u0425\u0430\u0430\u0445</button>
    </div></div>`;
  }
  const backdrop = document.getElementById('detailBackdrop');
  if (backdrop) backdrop.onclick = closeCellDetail;
  const closeBtn = document.getElementById('closeDetailBtn');
  if (closeBtn) closeBtn.onclick = closeCellDetail;
  document.addEventListener('keydown', handleDetailEscape);
}

function attachGameEvents() {
  const withClickFx = (fn) => (...args) => { audioManager.playSfx('buttonClick'); vibrate(15); return fn(...args); };
  const roll = document.getElementById('rollBtn'); if (roll) roll.onclick = withClickFx(rollDice);
  const end = document.getElementById('endTurnBtn'); if (end) end.onclick = withClickFx(endTurn);
  const buy = document.getElementById('buyBtn'); if (buy) buy.onclick = withClickFx(buyProperty);
  const skip = document.getElementById('skipBtn'); if (skip) skip.onclick = withClickFx(skipBuy);
  const build = document.getElementById('buildBtn'); if (build) build.onclick = withClickFx(buildProperty);
  const skipBuild2 = document.getElementById('skipBuildBtn'); if (skipBuild2) skipBuild2.onclick = withClickFx(skipBuild);
  const dbg = document.getElementById('debugToggle'); if (dbg) dbg.onclick = () => { debugMode = !debugMode; render(); };
  const mbcZoomIn = document.getElementById('mbcZoomIn'); if (mbcZoomIn) mbcZoomIn.onclick = () => mobileZoomBy(0.3);
  const mbcZoomOut = document.getElementById('mbcZoomOut'); if (mbcZoomOut) mbcZoomOut.onclick = () => mobileZoomBy(-0.3);
  const mbcFull = document.getElementById('mbcFullBoard'); if (mbcFull) mbcFull.onclick = () => mobileFullBoard();
  const mbcFocus = document.getElementById('mbcFocusPlayer'); if (mbcFocus) mbcFocus.onclick = () => mobileFocusCurrentPlayer();
  const mobileRoll = document.getElementById('mobileRollBtn'); if (mobileRoll) mobileRoll.onclick = () => { audioManager.playSfx('buttonClick'); vibrate(15); rollDice(); };
  const mobileEnd = document.getElementById('mobileEndTurnBtn'); if (mobileEnd) mobileEnd.onclick = () => { audioManager.playSfx('buttonClick'); vibrate(15); endTurn(); };
  const mobileBuy = document.getElementById('mobileBuyBtn'); if (mobileBuy) mobileBuy.onclick = () => { audioManager.playSfx('buttonClick'); vibrate(15); buyProperty(); };
  const mobileSkipBuy = document.getElementById('mobileSkipBuyBtn'); if (mobileSkipBuy) mobileSkipBuy.onclick = () => { audioManager.playSfx('buttonClick'); vibrate(15); skipBuy(); };
  const mobileBuild = document.getElementById('mobileBuildBtn'); if (mobileBuild) mobileBuild.onclick = () => { audioManager.playSfx('buttonClick'); vibrate(15); buildProperty(); };
  const mobileSkipBuild = document.getElementById('mobileSkipBuildBtn'); if (mobileSkipBuild) mobileSkipBuild.onclick = () => { audioManager.playSfx('buttonClick'); vibrate(15); skipBuild(); };
  const quickMute = document.getElementById('quickMuteToggle');
  if (quickMute) quickMute.onclick = () => {
    const nowMuted = gameSettings.sfxEnabled || gameSettings.musicEnabled;
    gameSettings.sfxEnabled = !nowMuted; gameSettings.musicEnabled = !nowMuted;
    audioManager.setMuted('sfx', nowMuted); audioManager.setMuted('music', nowMuted);
    saveSettings(); render();
  };
  const openSettings = document.getElementById('openSettingsBtn'); if (openSettings) openSettings.onclick = () => toggleSettingsModal(true);
  const mobileSettingsBtn = document.getElementById('mobileSettingsBtn'); if (mobileSettingsBtn) mobileSettingsBtn.onclick = () => toggleSettingsModal(true);
  const sheetToggle = document.getElementById('mobileSheetToggle');
  if (sheetToggle) sheetToggle.onclick = () => { mobileSheetExpanded = !mobileSheetExpanded; audioManager.playSfx('buttonClick'); vibrate(15); render(); };
  const madCompanyBtn = document.getElementById('madCompanyBtn');
  if (madCompanyBtn) madCompanyBtn.onclick = () => { mobileSheetExpanded = true; render(); setTimeout(() => { const el = document.querySelector('.sb-company-scroll') || document.querySelector('.mobile-sheet-content'); if (el) el.scrollIntoView({ block: 'nearest' }); }, 50); };
  const madWealthBtn = document.getElementById('madWealthBtn');
  if (madWealthBtn) madWealthBtn.onclick = () => { wealthModalOpen = true; wealthModalPlayerId = myId; render(); };
  const wealthDetailBtn = document.getElementById('wealthChartDetailBtn');
  if (wealthDetailBtn) wealthDetailBtn.onclick = () => { wealthModalOpen = true; wealthModalPlayerId = wealthDetailBtn.dataset.player; render(); };
  if (wealthModalOpen) attachWealthModalEvents();
  const viewAll = document.getElementById('viewAllLogBtn'); if (viewAll) viewAll.onclick = () => showFullLogModal(currentRoom);
  document.querySelectorAll('.sb-company-card[data-idx]').forEach(el => {
    const idx = parseInt(el.dataset.idx, 10);
    el.onclick = () => { if (buyModalOpen || buildingAnimationActive || cardModalOpen || rentCinematicActive || wealthModalOpen) return; showCellDetail(idx); };
  });
  const tooltip = document.getElementById('tile-tooltip');
  document.querySelectorAll('.tile[data-idx]').forEach(el => {
    const idx = parseInt(el.dataset.idx, 10);
    const tileInteractionDisabled = isAnimatingMovement || buyModalOpen || buildingAnimationActive || cardModalOpen || rentCinematicActive || wealthModalOpen;
    const selectTile = () => {
      if (tileInteractionDisabled) return;
      selectedTileId = idx;
      showCellDetail(idx);
    };
    el.onclick = selectTile;
    el.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectTile(); }
    };
    el.onmouseenter = (e) => {
      hoveredTileId = idx;
      el.classList.add('tile--hovered');
      if (!tooltip || !currentRoom) return;
      const sp = BOARD_CONFIG[idx];
      const priceLine = sp.price ? `\u20ae${fmt(sp.price)}` : (sp.amount ? `\u20ae${fmt(sp.amount)}` : '');
      tooltip.innerHTML = `<div class="tt-name">${sp.name}</div>${priceLine ? `<div class="tt-price">${priceLine}</div>` : ''}`;
      tooltip.style.display = 'block';
    };
    el.onmousemove = (e) => {
      if (!tooltip) return;
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
    };
    el.onmouseleave = () => {
      if (hoveredTileId === idx) hoveredTileId = null;
      el.classList.remove('tile--hovered');
      if (tooltip) tooltip.style.display = 'none';
    };
  });
  document.querySelectorAll('.tile-building-badge[data-idx]').forEach(el => {
    const idx = parseInt(el.dataset.idx, 10);
    el.onclick = (e) => { e.stopPropagation(); if (buyModalOpen || buildingAnimationActive || cardModalOpen || rentCinematicActive || wealthModalOpen) return; showCellDetail(idx); };
  });
  document.querySelectorAll('.upgrade-icon[data-idx]').forEach(el => {
    const idx = parseInt(el.dataset.idx, 10);
    el.onclick = (e) => { e.stopPropagation(); if (buyModalOpen || buildingAnimationActive || cardModalOpen || rentCinematicActive || wealthModalOpen) return; showCellDetail(idx); };
  });
}

window.addEventListener('resize', () => {
  if (isMobileView) syncBoardFrameSize();
  if (cameraState.mode !== 'overview' && cameraState.targetTileId !== null) {
    const tile = BOARD_CONFIG[cameraState.targetTileId];
    if (tile) applyCameraDirect(tile.tokenX, tile.tokenY, cameraState.scale, cameraState.mode, cameraState.targetTileId);
  } else if (isMobileView && cameraState.mode === 'overview') {
    requestAnimationFrame(() => returnCameraToOverview());
  }
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    if (isMobileView) syncBoardFrameSize();
    returnCameraToOverview();
  }, 100);
});

render();
initAuth();
</script>
</body>
</html>
