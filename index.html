<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Талын Эзэнт Улс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --night-indigo: #161616;
    --night-indigo-deep: #060606;
    --steppe-gold: #D4AF37;
    --seal-red: #C1553A;
    --parchment: #F2E7C6;
    --grass-green: #2E9E6B;
    --slate-line: #33291A;
    --steppe-blue: #3A6EA5;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse at 50% -10%, #1c1710 0%, var(--night-indigo-deep) 60%),
      var(--night-indigo-deep);
    color: var(--parchment);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }

  .eyebrow {
    font-size: 10.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--steppe-gold);
    text-align: center; opacity: 0.85; margin-bottom: 6px;
  }
  .screen { max-width: 480px; margin: 0 auto; padding: 48px 20px 30px; }
  .seal-title {
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: 27px;
    letter-spacing: 2px;
    background: linear-gradient(180deg, #F7E7B0 0%, #D4AF37 45%, #A9822A 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 4px;
    filter: drop-shadow(0 2px 6px rgba(212,175,55,0.2));
  }
  .subtitle { text-align: center; color: #9AA6BE; font-size: 13px; margin-bottom: 8px; }
  .motif-strip { text-align: center; font-size: 15px; letter-spacing: 6px; opacity: 0.55; margin: 14px 0 28px; }
  .landing-card {
    background: linear-gradient(160deg, #1c1c1c 0%, #131313 100%);
    border: 1px solid var(--slate-line); border-radius: 16px;
    padding: 22px 20px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  label { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #8b96b0; margin: 18px 0 7px; }
  input[type=text] {
    width: 100%; padding: 13px 14px; border-radius: 8px; border: 1px solid var(--slate-line);
    background: var(--night-indigo); color: var(--parchment); font-size: 16px; font-family: 'Work Sans', sans-serif;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type=text]:focus { outline: none; border-color: var(--steppe-gold); box-shadow: 0 0 0 3px rgba(212,162,78,0.15); }
  input[type=text]::placeholder { color: #5c6a86; }

  .btn {
    display: block; width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 8px;
    font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.5px;
    cursor: pointer; text-align: center; transition: transform 0.08s ease, filter 0.15s ease;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn-primary { background: linear-gradient(180deg, #E0B266, var(--steppe-gold)); color: var(--night-indigo-deep); box-shadow: 0 3px 0 #9c7735; }
  .btn-primary:active:not(:disabled) { box-shadow: 0 1px 0 #9c7735; }
  .btn-secondary { background: var(--night-indigo); border: 1px solid var(--slate-line); color: var(--parchment); }
  .btn-danger { background: var(--seal-red); color: var(--parchment); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .divider { text-align: center; color: #5c6a86; font-size: 10.5px; margin: 24px 0; letter-spacing: 1.5px; text-transform: uppercase; }
  .divider::before, .divider::after { content: ''; }
  .error-msg { color: #E28E7D; font-size: 13px; margin-top: 8px; min-height: 16px; text-align: center; }

  .wait-list { margin: 18px 0; }
  .wait-player {
    display: flex; align-items: center; gap: 12px; background: var(--night-indigo);
    border: 1px solid var(--slate-line); border-radius: 10px; padding: 11px 14px; margin-bottom: 8px;
    animation: popIn 0.25s ease;
  }
  .wait-token {
    font-size: 26px; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--token-color, var(--steppe-gold)) 55%, white 45%) 0%, var(--night-indigo-deep) 78%);
    border: 2.5px solid var(--token-color, var(--steppe-gold));
    box-shadow: inset -2px -2px 3px rgba(0,0,0,0.55), inset 2px 2px 3px rgba(255,255,255,0.3), 0 3px 5px rgba(0,0,0,0.5);
  }
  .room-code-box {
    text-align: center; margin: 20px 0; padding: 18px 10px; border: 1.5px dashed var(--steppe-gold);
    border-radius: 12px; background: rgba(212,162,78,0.05); position: relative;
  }
  .room-code-box::before { content: '⛺'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--night-indigo-deep); padding: 0 8px; font-size: 16px; }
  .room-code { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: var(--steppe-gold); }

  /* Game screen */
  .game-wrap { max-width: 1260px; margin: 0 auto; padding: 12px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 6px 16px; }
  .top-bar .seal-title { font-size: 18px; margin: 0; text-align: left; }
  .turn-indicator {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    background: linear-gradient(160deg, #1c1c1c 0%, #131313 100%);
    border: 1px solid var(--steppe-gold); border-radius: 20px; padding: 8px 18px; color: var(--parchment);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .turn-indicator .pulse-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--grass-green); margin-right: 6px; animation: pulse 1.4s infinite; }

  .game-layout { display: grid; grid-template-columns: minmax(0,1fr) 280px; gap: 20px; }
  @media (max-width: 800px) { .game-layout { grid-template-columns: 1fr; } }

  .board-outer {
    display: flex; justify-content: center; align-items: center;
    padding: clamp(24px, 5vw, 50px) clamp(10px, 2.5vw, 26px) clamp(40px, 7vw, 70px);
    background:
      radial-gradient(ellipse at 50% 40%, #1a2e24 0%, #0c1712 75%);
    border-radius: 20px;
    box-shadow: inset 0 4px 18px rgba(0,0,0,0.55), inset 0 -2px 8px rgba(0,0,0,0.4), 0 8px 26px rgba(0,0,0,0.4);
    perspective: 1600px;
    position: relative;
    overflow: hidden;
  }
  .board-outer::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 22% 12%, rgba(255,244,210,0.22) 0%, transparent 52%);
    pointer-events: none; z-index: 3;
  }
  .board-outer::after {
    content: '';
    position: absolute; bottom: clamp(10px, 3vw, 22px); left: 50%;
    transform: translateX(-50%);
    width: 68%; height: clamp(14px, 3vw, 26px);
    background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 72%);
    filter: blur(6px);
    pointer-events: none; z-index: 0;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, minmax(32px, 1fr));
    grid-template-rows: repeat(8, minmax(32px, 1fr));
    width: min(94vw, 880px);
    height: min(94vw, 880px);
    gap: 4px;
    background: #2a2f1f;
    border: 6px solid #FFC93C;
    outline: 3px solid #1a1a1a;
    outline-offset: 0px;
    border-radius: 18px;
    padding: 5px;
    box-shadow: 0 22px 40px rgba(0,0,0,0.6), 0 0 0 2px rgba(0,0,0,0.3);
    transform: rotateX(30deg);
    transform-origin: center bottom;
    position: relative; z-index: 1;
  }
  .cell {
    position: relative;
    background: linear-gradient(160deg, #FFFBF0 0%, #FFF3D6 100%);
    border-radius: 10px;
    display: flex; flex-direction: column;
    overflow: visible;
    box-shadow: inset 0 0 0 2.5px #241a0d, inset 0 -4px 8px -5px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.25);
  }
  .cell.corner {
    background: linear-gradient(160deg, #FFFBF0 0%, #FCE8B8 100%);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px;
    padding: 3px;
  }
  .cell.owned-glow { box-shadow: inset 0 0 0 2.5px #241a0d, inset 0 0 0 5px var(--owner-color, var(--steppe-gold)), 0 0 10px -2px var(--owner-color, var(--steppe-gold)); }
  .cell.group-complete { box-shadow: inset 0 0 0 2.5px #241a0d, inset 0 0 0 5px var(--owner-color, var(--steppe-gold)), 0 0 14px var(--owner-color, var(--steppe-gold)); }
  .cell-tint { position: absolute; inset: 0; pointer-events: none; z-index: 0; border-radius: 8px; overflow: hidden; }
  .cell-header {
    flex: 0 0 38%;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
    box-shadow: inset 0 -2.5px 0 #241a0d;
    border-radius: 8px 8px 0 0;
  }
  .cell-header.side-bottom { background: linear-gradient(160deg, #FF9A4D 0%, #FF6B1F 100%); }
  .cell-header.side-left   { background: linear-gradient(160deg, #FF6FA8 0%, #E8317A 100%); }
  .cell-header.side-top    { background: linear-gradient(160deg, #4FE8B0 0%, #14C088 100%); }
  .cell-header.side-right  { background: linear-gradient(160deg, #B48CFF 0%, #8A4FE8 100%); }
  .icon-standee {
    position: absolute; top: clamp(-15px, -2.9vw, -10px); left: 50%; transform: translateX(-50%);
    width: clamp(19px, 3.8vw, 29px); height: clamp(19px, 3.8vw, 29px);
    border-radius: 50%; z-index: 5;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #fff3d6 60%, #ffe08a 100%);
    border: 2.5px solid #241a0d;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(9px, 2.1vw, 16px);
    box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 6px 8px rgba(0,0,0,0.4);
  }
  .cell-body {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; z-index: 1; padding: 1px 2px;
  }
  .corner-badge {
    width: clamp(23px, 4.8vw, 40px); height: clamp(23px, 4.8vw, 40px); border-radius: 50%;
    border: 2.5px solid #241a0d; display: flex; align-items: center; justify-content: center;
    font-size: clamp(11px, 2.7vw, 21px);
    background: radial-gradient(circle, #FFC93C 0%, #FF9A1F 100%);
    box-shadow: 0 3px 0 rgba(0,0,0,0.25), 0 4px 6px rgba(0,0,0,0.35);
    position: relative; z-index: 1;
  }
  .cell-name {
    font-size: clamp(6.5px, 1.2vw, 9.5px); text-align: center; line-height: 1.15; margin-top: 1px;
    color: #241a0d; font-weight: 800; letter-spacing: 0.1px;
    padding: 0 1px;
  }
  .cell-name.corner-name { font-size: clamp(6.5px, 1.2vw, 9px); margin-top: 0; font-weight: 800; }
  .cell-price {
    font-family: 'JetBrains Mono', monospace; font-size: clamp(6px, 1.05vw, 7.8px);
    color: #B8721A; margin-top: 1px; font-weight: 800;
  }
  .buildings-row { display: flex; gap: clamp(1.5px, 0.4vw, 3px); justify-content: center; margin-top: 1px; z-index: 3; position: relative; }
  .build-icon {
    display: block;
  }
  .build-icon.house {
    width: clamp(10px, 2.3vw, 16px); height: clamp(10px, 2.3vw, 16px);
    background: linear-gradient(155deg, #E8FFD8 0%, #9AE87E 22%, #3E8A34 62%, #1c4d18 100%);
    clip-path: polygon(50% 0%, 100% 40%, 100% 100%, 0% 100%, 0% 40%);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
  }
  .build-icon.corp {
    width: clamp(13px, 3vw, 21px); height: clamp(13px, 3vw, 21px);
    background: linear-gradient(155deg, #FFFCEE 0%, #FBEDC0 20%, #D4AF37 55%, #7a5f1c 100%);
    clip-path: polygon(20% 0%, 80% 0%, 100% 30%, 100% 100%, 0% 100%, 0% 30%);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.55));
  }
  .cell-center {
    grid-column: 2 / 8; grid-row: 2 / 8;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(6px, 1.3vw, 12px);
    background:
      radial-gradient(circle at 50% 40%, #1e4634 0%, #0f2a1f 75%);
    padding: clamp(10px, 2vw, 20px);
    overflow: hidden;
    position: relative;
    border-radius: 6px;
    box-shadow:
      inset 0 0 0 3px var(--steppe-gold),
      inset 0 0 0 6px #0f2a1f,
      inset 0 0 0 7px rgba(212,175,55,0.55),
      0 0 30px rgba(0,0,0,0.5);
  }
  .cell-center::before {
    content: '◆'; position: absolute; top: 6px; left: 8px; color: var(--steppe-gold);
    font-size: clamp(8px, 1.4vw, 12px); opacity: 0.85;
  }
  .cell-center::after {
    content: '◆'; position: absolute; bottom: 6px; right: 8px; color: var(--steppe-gold);
    font-size: clamp(8px, 1.4vw, 12px); opacity: 0.85;
  }
  .center-seal {
    width: clamp(64px, 13vw, 120px); height: auto; aspect-ratio: 100 / 62;
    display: flex; align-items: center; justify-content: center;
    position: relative; opacity: 0.97;
  }
  .emblem-svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
  .center-title {
    font-family: 'Cinzel', serif; font-weight: 800; font-size: clamp(10px, 2.2vw, 17px);
    background: linear-gradient(180deg, #F7E7B0 0%, #D4AF37 45%, #A9822A 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 1.5px; text-align: center; line-height: 1.2; text-transform: uppercase;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }
  .center-subtitle {
    font-size: clamp(6px, 1.1vw, 8.5px); letter-spacing: 1.5px; color: var(--steppe-gold);
    opacity: 0.85; text-transform: uppercase; text-align: center;
  }
  .center-dice-row { display: flex; justify-content: center; gap: clamp(8px, 1.8vw, 18px); }
  .center-leaderboard {
    width: min(90%, 280px); background: rgba(0,0,0,0.35); border: 1px solid rgba(212,175,55,0.35);
    border-radius: 10px; padding: clamp(6px, 1.2vw, 10px) clamp(8px, 1.6vw, 14px);
  }
  .lb-title {
    font-family: 'Cinzel', serif; font-size: clamp(8px, 1.4vw, 10.5px); letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--steppe-gold); text-align: center; margin-bottom: 4px; opacity: 0.9;
  }
  .lb-row { display: flex; align-items: center; gap: clamp(5px, 1vw, 8px); padding: clamp(2px, 0.6vw, 4px) 0; }
  .lb-row.lb-bankrupt { opacity: 0.4; text-decoration: line-through; }
  .lb-medal { font-size: clamp(9px, 1.6vw, 12px); width: 16px; text-align: center; }
  .lb-token { font-size: clamp(9px, 1.7vw, 13px); }
  .lb-name { flex: 1; font-size: clamp(8px, 1.5vw, 11px); color: var(--parchment); }
  .lb-worth { font-family: 'JetBrains Mono', monospace; font-size: clamp(8px, 1.5vw, 11px); color: var(--steppe-gold); }
  .center-ticker {
    width: min(90%, 300px); font-size: clamp(8px, 1.4vw, 11px); color: #cfd7e6; text-align: center;
    padding: clamp(4px, 1vw, 7px) clamp(8px, 1.6vw, 12px); border-top: 1px dashed rgba(212,175,55,0.3);
    animation: tickerFade 0.4s ease;
  }
  .dice-result-text { font-size: 12.5px; color: #9AA6BE; margin-bottom: 10px; min-height: 16px; }
  .tokens-row { position: absolute; bottom: 1px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; flex-wrap: wrap; z-index: 2; }
  .token-dot {
    font-size: clamp(14px, 3.1vw, 23px); width: clamp(22px, 4.6vw, 33px); height: clamp(22px, 4.6vw, 33px);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--token-ring, var(--steppe-gold)) 55%, white 45%) 0%, var(--night-indigo-deep) 78%);
    border: 3px solid #241a0d;
    box-shadow: inset -2px -2px 3px rgba(0,0,0,0.55), inset 2px 2px 3px rgba(255,255,255,0.3), 0 3px 0 rgba(0,0,0,0.35), 0 4px 6px rgba(0,0,0,0.5);
    animation: popIn 0.35s ease;
  }
  .token-dot.token-landed { animation: tokenLand 0.55s cubic-bezier(.34,1.56,.64,1); }
  .owner-badge {
    position: absolute; top: 1px; right: 1px; z-index: 3;
    width: clamp(11px, 2.2vw, 16px); height: clamp(11px, 2.2vw, 16px);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.5vw, 10px); line-height: 1;
    background: var(--owner-color, var(--steppe-gold));
    border: 2px solid #241a0d;
    box-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }

  .card-popup-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 2000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    animation: popIn 0.2s ease;
  }
  .card-popup {
    width: min(90vw, 380px); background: linear-gradient(155deg, #1c1c1c 0%, #0c0c0c 100%);
    border: 2px solid var(--steppe-gold); border-radius: 16px; padding: 28px 22px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,175,55,0.15);
    animation: cardFlip 0.4s cubic-bezier(.2,1.4,.4,1);
  }
  .card-popup-eyebrow {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; letter-spacing: 1.5px;
    color: var(--steppe-gold); margin-bottom: 10px;
  }
  .card-popup-player { font-size: 13px; color: #9AA6BE; margin-bottom: 14px; }
  .card-popup-text { font-size: 17px; line-height: 1.5; color: var(--parchment); margin-bottom: 16px; }
  .card-popup-money { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; }
  .card-popup-money.positive { color: var(--grass-green); }
  .card-popup-money.negative { color: var(--seal-red); }

  .side-panel { display: flex; flex-direction: column; gap: 14px; }
  .panel-box {
    background: linear-gradient(160deg, #1c1c1c 0%, #131313 100%);
    border: 1px solid var(--slate-line);
    border-radius: 12px; padding: 15px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .panel-box h3 {
    font-family: 'Cinzel', serif; font-size: 11.5px; letter-spacing: 1.8px; text-transform: uppercase;
    color: var(--steppe-gold); margin: 0 0 11px; padding-bottom: 9px; border-bottom: 1px dashed var(--slate-line);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .player-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
  .player-row:last-child { border-bottom: none; }
  .player-avatar {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 14px; background: rgba(255,255,255,0.04); border: 2px solid var(--ring-color, var(--steppe-gold));
    flex-shrink: 0;
  }
  .player-row.active-turn { color: var(--steppe-gold); font-weight: 700; }
  .player-row.active-turn .player-avatar { box-shadow: 0 0 0 3px rgba(212,162,78,0.18); }
  .player-row .p-money { margin-left: auto; font-family: 'JetBrains Mono', monospace; }
  .player-row .p-props { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #9AA6BE; }
  .asset-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12.5px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .asset-row:last-child { border-bottom: none; }
  .asset-name { flex: 1; }
  .asset-rent { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--steppe-gold); }
  .no-assets { font-size: 12.5px; color: #6b7690; padding: 4px 0; }
  .group-badge { color: var(--steppe-gold); font-size: 10px; letter-spacing: 0.5px; }
  .p-bankrupt { text-decoration: line-through; opacity: 0.4; }

  .action-area { text-align: center; }
  .die {
    width: 42px; height: 42px; background: linear-gradient(160deg, #FBF3DC, var(--parchment)); border-radius: 9px;
    display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
    padding: 6px; gap: 2px; box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 6px 10px rgba(0,0,0,0.25);
  }
  .die.die-large {

function gridPos(i) {
  if (i <= 7) return { row: 8, col: 8 - i };
  if (i <= 13) return { row: 8 - (i - 7), col: 1 };
  if (i <= 21) return { row: 1, col: 1 + (i - 14) };
  return { row: 1 + (i - 21), col: 8 };
}
function sideOf(i) {
  if (i <= 7) return 'side-bottom';
  if (i <= 13) return 'side-left';
  if (i <= 21) return 'side-top';
  return 'side-right';
}

function randCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let s = '';
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function uid() { return Math.random().toString(36).slice(2, 10); }
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

let myId = uid();
let myName = '';
let currentRoom = null;
let view = 'landing'; // landing | waiting | game
let errorMsg = '';
let justRolled = false;

async function getRoom(code) {
  try {
    const { data, error } = await supabaseClient.from('rooms').select('state').eq('room_code', code).single();
    if (error || !data) return null;
    return data.state;
  } catch (e) { return null; }
}
async function saveRoom(roomState) {
  roomState.updatedAt = Date.now();
  await supabaseClient.from('rooms').upsert({ room_code: roomState.roomCode, state: roomState });
}

function newPlayer(name, token, isHost) {
  return { id: myId, name, token, color: TOKEN_COLORS[TOKENS.indexOf(token)], money: 1500, position: 0, jailTurns: 0, bankrupt: false, isHost };
}

async function createRoom(name) {
  const code = randCode();
  const room = {
    roomCode: code,
    started: false,
    players: [newPlayer(name, TOKENS[0], true)],
    propOwner: {},
    currentPlayerIndex: 0,
    hasRolled: false,
    pendingAction: null,
    lastDice: null,
    winnerId: null,
    log: ['Өрөө үүсгэлээ. Тоглогчид нэгдэхийг хүлээж байна...'],
  };
  await saveRoom(room);
  currentRoom = room;
  view = 'waiting';
  startPolling();
  render();
}

async function joinRoom(code, name) {
  code = code.toUpperCase().trim();
  const room = await getRoom(code);
  if (!room) { errorMsg = 'Ийм өрөө олдсонгүй.'; render(); return; }
  const existing = room.players.find(p => p.name === name);
  if (existing) {
    myId = existing.id;
    currentRoom = room;
    view = room.started ? 'game' : 'waiting';
    startPolling();
    render();
    return;
  }
  if (room.started) { errorMsg = 'Энэ тоглоом аль хэдийн эхэлсэн байна.'; render(); return; }
  if (room.players.length >= 4) { errorMsg = 'Өрөө дүүрсэн байна (дээд тал нь 4 тоглогч).'; render(); return; }

  const usedTokens = room.players.map(p => p.token);
  const freeToken = TOKENS.find(t => !usedTokens.includes(t));
  const player = newPlayer(name, freeToken, false);
  const { data, error } = await supabaseClient.rpc('join_room', { p_room_code: code, p_player: player });

  if (error || !data) { errorMsg = 'Нэгдэхэд алдаа гарлаа, дахин оролдоно уу.'; render(); return; }
  currentRoom = data;
  view = 'waiting';
  startPolling();
  render();
}

async function startGame() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || room.players.length < 2) return;
  room.started = true;
  room.log.push('Тоглоом эхэллээ! ' + room.players[0].name + '-ийн ээлж.');
  await saveRoom(room);
  currentRoom = room;
  view = 'game';
  render();
}

function isMyTurn(room) {
  return room.players[room.currentPlayerIndex] && room.players[room.currentPlayerIndex].id === myId;
}

function pushLog(room, text) {
  room.log.push(text);
  if (room.log.length > 40) room.log = room.log.slice(-40);
}

function checkWinner(room) {
  const active = room.players.filter(p => !p.bankrupt);
  if (active.length === 1) {
    room.winnerId = active[0].id;
  }
}

function bankrupt(room, player) {
  player.bankrupt = true;
  Object.keys(room.propOwner).forEach(k => {
    if (room.propOwner[k] === player.id) {
      delete room.propOwner[k];
      if (room.houses) delete room.houses[k];
    }
  });
  pushLog(room, `${player.name} дампуурлаа!`);
  checkWinner(room);
}

async function rollDice() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !isMyTurn(room) || room.hasRolled || room.pendingAction) return;
  const player = room.players[room.currentPlayerIndex];

  if (player.jailTurns > 0) {
    player.jailTurns--;
    room.hasRolled = true;
    pushLog(room, `${player.name} шоронд байгаа тул алгасав (${player.jailTurns} ээлж үлдлээ).`);
    await saveRoom(room);
    currentRoom = room; justRolled = true; render();
    return;
  }

  const d1 = 1 + Math.floor(Math.random() * 6);
  const d2 = 1 + Math.floor(Math.random() * 6);
  const sum = d1 + d2;
  room.lastDice = [d1, d2];
  const oldPos = player.position;
  const newPos = (oldPos + sum) % spaces.length;
  const passedGo = newPos < oldPos;
  room.animPath = { playerId: player.id, from: oldPos, steps: sum, id: Date.now() + Math.random() };
  if (passedGo) { player.money += 200; pushLog(room, `${player.name} ЭХЛЭЛ дээгүүр өнгөрч ₮200 авлаа.`); }
  player.position = newPos;
  room.hasRolled = true;
  pushLog(room, `${player.name} 🎲${d1}+${d2}=${sum}, ${spaces[newPos].name} дээр очив.`);

  resolveSpace(room, player, newPos);
  checkWinner(room);
  await saveRoom(room);
  currentRoom = room; justRolled = true; render();
}

function propertiesInGroup(idx) {
  const side = sideOf(idx);
  return spaces.map((sp, i) => i).filter(i => spaces[i].type === 'property' && sideOf(i) === side);
}
function ownsFullGroup(room, ownerId, idx) {
  const group = propertiesInGroup(idx);
  return group.length > 0 && group.every(i => room.propOwner[i] === ownerId);
}
function houseLevel(room, idx) {
  return (room.houses && room.houses[idx]) || 0;
}
function buildLevelLabel(level) {
  if (level >= 4) return 'Корпорац';
  return level + ' байшин';
}
function buildCost(sp) {
  return Math.round(sp.price * 0.5 / 10) * 10;
}

function resolvePropertyOrTax(room, player, idx) {
  const sp = spaces[idx];
  if (sp.type === 'property') {
    const owner = room.propOwner[idx];
    if (!owner) {
      room.pendingAction = { type: 'buy', playerId: player.id, spaceIndex: idx };
    } else if (owner === player.id) {
      const level = houseLevel(room, idx);
      if (level < 4) {
        room.pendingAction = { type: 'build', playerId: player.id, spaceIndex: idx };
      }
    } else {
      const ownerPlayer = room.players.find(p => p.id === owner);
      const level = houseLevel(room, idx);
      let rent, note;
      if (level > 0) {
        const mult = [1, 2, 4, 6, 10][level];
        rent = sp.rent * mult;
        note = ` (${buildLevelLabel(level)})`;
      } else {
        const fullGroup = ownsFullGroup(room, owner, idx);
        rent = fullGroup ? sp.rent * 2 : sp.rent;
        note = fullGroup ? ' (бүлэг бүрэн — 2x)' : '';
      }
      player.money -= rent;
      ownerPlayer.money += rent;
      pushLog(room, `${player.name} ${ownerPlayer.name}-д түрээс ₮${rent} төлөв${note}.`);
      if (player.money < 0) bankrupt(room, player);
    }
  } else if (sp.type === 'tax') {
    player.money -= sp.amount;
    pushLog(room, `${player.name} татвар ₮${sp.amount} төлөв.`);
    if (player.money < 0) bankrupt(room, player);
  }
}

function resolveSpace(room, player, idx) {
  const sp = spaces[idx];
  if (sp.type === 'property' || sp.type === 'tax') {
    resolvePropertyOrTax(room, player, idx);
  } else if (sp.type === 'chance' || sp.type === 'chest') {
    const pool = sp.type === 'chance' ? CHANCE_CARDS : CHEST_CARDS;
    const card = pool[Math.floor(Math.random() * pool.length)];
    pushLog(room, `${player.name}: "${card.text}"`);
    room.cardDraw = {
      type: sp.type,
      playerName: player.name,
      text: card.text,
      money: typeof card.money === 'number' ? card.money : null,
      id: Date.now() + Math.random(),
    };
    if (typeof card.money === 'number') player.money += card.money;
    if (typeof card.moveTo === 'number') {
      player.position = card.moveTo;
      if (card.collect) player.money += card.collect;
      resolvePropertyOrTax(room, player, player.position);
    }
    if (typeof card.moveRel === 'number') {
      player.position = ((player.position + card.moveRel) % spaces.length + spaces.length) % spaces.length;
      resolvePropertyOrTax(room, player, player.position);
    }
    if (card.gotoJail) { player.position = 7; player.jailTurns = 2; }
    if (player.money < 0) bankrupt(room, player);
  } else if (sp.type === 'gotojail') {
    player.position = 7;
    player.jailTurns = 2;
    pushLog(room, `${player.name} шоронд орлоо.`);
  }
}

async function buyProperty() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !room.pendingAction || room.pendingAction.playerId !== myId) return;
  const idx = room.pendingAction.spaceIndex;
  const player = room.players.find(p => p.id === myId);
  const sp = spaces[idx];
  if (player.money < sp.price) { room.pendingAction = null; await saveRoom(room); currentRoom = room; render(); return; }
  player.money -= sp.price;
  room.propOwner[idx] = player.id;
  pushLog(room, `${player.name} "${sp.name}"-г ₮${sp.price}-р худалдаж авав.`);
  room.pendingAction = null;
  await saveRoom(room);
  currentRoom = room; render();
}

async function skipBuy() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !room.pendingAction || room.pendingAction.playerId !== myId) return;
  room.pendingAction = null;
  await saveRoom(room);
  currentRoom = room; render();
}

async function buildProperty() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !room.pendingAction || room.pendingAction.type !== 'build' || room.pendingAction.playerId !== myId) return;
  const idx = room.pendingAction.spaceIndex;
  const player = room.players.find(p => p.id === myId);
  const sp = spaces[idx];
  const cost = buildCost(sp);
  if (player.money < cost) { room.pendingAction = null; await saveRoom(room); currentRoom = room; render(); return; }
  if (!room.houses) room.houses = {};
  const level = houseLevel(room, idx) + 1;
  room.houses[idx] = level;
  player.money -= cost;
  pushLog(room, `${player.name} "${sp.name}"-д ${buildLevelLabel(level)} барив (₮${cost}).`);
  room.pendingAction = null;
  await saveRoom(room);
  currentRoom = room; render();
}

async function skipBuild() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !room.pendingAction || room.pendingAction.type !== 'build' || room.pendingAction.playerId !== myId) return;
  room.pendingAction = null;
  await saveRoom(room);
  currentRoom = room; render();
}

async function endTurn() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !isMyTurn(room) || room.pendingAction) return;
  const active = room.players.filter(p => !p.bankrupt);
  if (active.length <= 1) return;
  let next = room.currentPlayerIndex;
  do { next = (next + 1) % room.players.length; } while (room.players[next].bankrupt);
  room.currentPlayerIndex = next;
  room.hasRolled = false;
  room.lastDice = null;
  pushLog(room, `— ${room.players[next].name}-ийн ээлж —`);
  await saveRoom(room);
  currentRoom = room; render();
}

let roomChannel = null;
function startPolling() {
  if (roomChannel) supabaseClient.removeChannel(roomChannel);
  roomChannel = supabaseClient
    .channel('room-' + currentRoom.roomCode)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'rooms', filter: `room_code=eq.${currentRoom.roomCode}` },
      payload => {
        if (!payload.new || !payload.new.state) return;
        currentRoom = payload.new.state;
        if (view === 'waiting' && currentRoom.started) view = 'game';
        if (view !== 'landing') render();
      }
    )
    .subscribe();
}

/* ---------- RENDER ---------- */

let animOverride = null;
let lastAnimId = null;
let lastCardId = null;
let cardPopupTimer = null;

function maybeTriggerMoveAnimation(room) {
  const ap = room.animPath;
  if (ap && ap.id !== lastAnimId) {
    lastAnimId = ap.id;
    animOverride = { playerId: ap.playerId, pos: ap.from };
    animateTokenMove(ap.playerId, ap.from, ap.steps);
  }
}
function animateTokenMove(playerId, from, steps) {
  let i = 1;
  function step() {
    animOverride = { playerId, pos: (from + i) % spaces.length };
    render();
    i++;
    if (i <= steps) {
      setTimeout(step, 160);
    } else {
      animOverride = null;
    }
  }
  setTimeout(step, 160);
}
function displayPos(room, p) {
  if (animOverride && animOverride.playerId === p.id) return animOverride.pos;
  return p.position;
}

function maybeShowCardPopup(room) {
  const cd = room.cardDraw;
  if (cd && cd.id !== lastCardId) {
    lastCardId = cd.id;
    showCardPopup(cd);
  }
}
function showCardPopup(draw) {
  const root = document.getElementById('card-popup-root');
  if (!root) return;
  const isChance = draw.type === 'chance';
  const hasMoney = typeof draw.money === 'number';
  const moneyHtml = hasMoney
    ? `<div class="card-popup-money ${draw.money >= 0 ? 'positive' : 'negative'}">${draw.money >= 0 ? '+' : '−'}₮${fmt(Math.abs(draw.money))}</div>`
    : '';
  root.innerHTML = `
    <div class="card-popup-backdrop" id="cardPopupBackdrop">
      <div class="card-popup ${isChance ? 'chance' : 'court'}">
        <div class="card-popup-eyebrow">${isChance ? '🎴 Азын карт' : '⚖️ Шүүхийн тогтоол'}</div>
        <div class="card-popup-player">${draw.playerName}</div>
        <div class="card-popup-text">"${draw.text}"</div>
        ${moneyHtml}
      </div>
    </div>`;
  const backdrop = document.getElementById('cardPopupBackdrop');
  if (backdrop) backdrop.onclick = () => { root.innerHTML = ''; };
  clearTimeout(cardPopupTimer);
  cardPopupTimer = setTimeout(() => { root.innerHTML = ''; }, 4500);
}

function netWorth(room, player) {
  let worth = player.money;
  Object.keys(room.propOwner).forEach(idx => {
    if (room.propOwner[idx] === player.id) {
      const sp = spaces[idx];
      worth += sp.price;
      const level = houseLevel(room, idx);
      if (level > 0) worth += buildCost(sp) * level;
    }
  });
  return worth;
}

function renderCenterLeaderboard(room) {
  const ranked = room.players.slice().sort((a, b) => netWorth(room, b) - netWorth(room, a));
  const medals = ['🥇', '🥈', '🥉', '4️⃣'];
  const rows = ranked.map((p, i) => `
    <div class="lb-row ${p.bankrupt ? 'lb-bankrupt' : ''}">
      <span class="lb-medal">${medals[i] || (i + 1)}</span>
      <span class="lb-token" style="--token-ring:${p.color}">${p.token}</span>
      <span class="lb-name">${p.name}</span>
      <span class="lb-worth">₮${fmt(netWorth(room, p))}</span>
    </div>`).join('');
  return `<div class="center-leaderboard"><div class="lb-title">Хөрөнгийн шатлага</div>${rows}</div>`;
}

function renderCenterTicker(room) {
  const latest = room.log.length ? room.log[room.log.length - 1] : 'Тоглоом эхэллээ';
  return `<div class="center-ticker">${latest}</div>`;
}

function renderEmblemSvg() {
  return `
  <svg viewBox="0 0 100 62" xmlns="http://www.w3.org/2000/svg" class="emblem-svg">
    <defs>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F7E7B0"/>
        <stop offset="45%" stop-color="#D4AF37"/>
        <stop offset="100%" stop-color="#8a6d1f"/>
      </linearGradient>
    </defs>
    <g stroke="url(#goldGrad)" stroke-width="1" opacity="0.65" stroke-linecap="round">
      <line x1="50" y1="21" x2="50" y2="3"/>
      <line x1="50" y1="21" x2="37" y2="5"/>
      <line x1="50" y1="21" x2="63" y2="5"/>
      <line x1="50" y1="21" x2="25" y2="11"/>
      <line x1="50" y1="21" x2="75" y2="11"/>
    </g>
    <polygon points="6,52 26,20 46,52" fill="url(#goldGrad)" opacity="0.5"/>
    <polygon points="56,52 76,18 96,52" fill="url(#goldGrad)" opacity="0.5"/>
    <polygon points="28,52 50,13 72,52" fill="url(#goldGrad)" opacity="0.85"/>
    <rect x="33" y="36" width="6" height="16" fill="url(#goldGrad)"/>
    <rect x="41" y="29" width="7" height="23" fill="url(#goldGrad)"/>
    <rect x="50" y="20" width="8" height="32" fill="url(#goldGrad)"/>
    <polygon points="50,20 54,11 58,20" fill="url(#goldGrad)"/>
    <rect x="60" y="31" width="6" height="21" fill="url(#goldGrad)"/>
    <rect x="68" y="38" width="5" height="14" fill="url(#goldGrad)"/>
  </svg>`;
}

function renderBuildings(level) {
  if (level >= 4) return `<div class="buildings-row"><span class="build-icon corp" title="Корпорац"></span></div>`;
  let html = '<div class="buildings-row">';
  for (let i = 0; i < level; i++) html += `<span class="build-icon house" title="Байшин"></span>`;
  html += '</div>';
  return html;
}

function renderDie(value, rolling, large) {
  const on = value ? (DIE_PIPS[value] || []) : [];
  let pipsHtml = '';
  for (let i = 1; i <= 9; i++) pipsHtml += `<div class="pip ${on.includes(i) ? 'on' : ''}"></div>`;
  return `<div class="die ${large ? 'die-large' : ''} ${rolling ? 'rolling' : ''}">${pipsHtml}</div>`;
}

function render() {
  const app = document.getElementById('app');
  if (currentRoom) {
    maybeShowCardPopup(currentRoom);
  }
  if (view === 'landing') { app.innerHTML = renderLanding(); attachLandingEvents(); return; }
  if (view === 'waiting') { app.innerHTML = renderWaiting(); attachWaitingEvents(); return; }
  if (view === 'game') {
    if (currentRoom) maybeTriggerMoveAnimation(currentRoom);
    const rollingNow = justRolled;
    justRolled = false;
    app.innerHTML = renderGame(rollingNow);
    attachGameEvents();
    return;
  }
}

function renderLanding() {
  return `
    <div class="screen">
      <div class="eyebrow">Онлайн олон тоглогчийн тэмцээн</div>
      <div class="seal-title">Талын Эзэнт Улс</div>
      <div class="subtitle">Аймаг худалдаж ав, түрээсээ цуглуул, эзэнт улсаа өргөтгө</div>
      <div class="motif-strip">⛺ · 🐫 · 🏮 · 🏭 · 🏢</div>
      <div class="landing-card">
        <label>Таны нэр</label>
        <input type="text" id="nameInput" maxlength="16" placeholder="Нэрээ бичнэ үү" value="${myName}">
        <button class="btn btn-primary" id="createBtn">Шинэ өрөө үүсгэх</button>
        <div class="divider">эсвэл</div>
        <label>Өрөөний код</label>
        <input type="text" id="codeInput" maxlength="4" placeholder="ЖИШЭЭ: ABCD" style="text-transform:uppercase;letter-spacing:3px;">
        <button class="btn btn-secondary" id="joinBtn">Өрөөнд нэгдэх</button>
        <div class="error-msg">${errorMsg}</div>
      </div>
    </div>
  `;
}
function attachLandingEvents() {
  document.getElementById('createBtn').onclick = () => {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) { errorMsg = 'Нэрээ оруулна уу.'; render(); return; }
    myName = name; errorMsg = '';
    createRoom(name);
  };
  document.getElementById('joinBtn').onclick = () => {
    const name = document.getElementById('nameInput').value.trim();
    const code = document.getElementById('codeInput').value.trim();
    if (!name) { errorMsg = 'Нэрээ оруулна уу.'; render(); return; }
    if (!code) { errorMsg = 'Өрөөний кодоо оруулна уу.'; render(); return; }
    myName = name; errorMsg = '';
    joinRoom(code, name);
  };
}

function renderWaiting() {
  const room = currentRoom;
  const isHost = room.players.find(p => p.id === myId)?.isHost;
  return `
    <div class="screen">
      <div class="eyebrow">Хүлээлгийн өрөө</div>
      <div class="seal-title">Тоглогчид цугларч байна</div>
      <div class="landing-card">
        <div class="room-code-box">
          <div style="font-size:11px;color:#9AA6BE;letter-spacing:2px;text-transform:uppercase;">Өрөөний код</div>
          <div class="room-code">${room.roomCode}</div>
          <div style="font-size:12px;color:#6b7690;margin-top:4px;">Энэ кодыг найзууддаа илгээгээрэй</div>
        </div>
        <div class="wait-list">
          ${room.players.map(p => `<div class="wait-player"><span class="wait-token" style="--token-color:${p.color}">${p.token}</span> <span>${p.name}</span> ${p.isHost ? '<span style="color:#9AA6BE;font-size:11px;margin-left:auto;">эзэн</span>' : ''}</div>`).join('')}
        </div>
        ${isHost
          ? `<button class="btn btn-primary" id="startBtn" ${room.players.length < 2 ? 'disabled' : ''}>Тоглоом эхлүүлэх ${room.players.length < 2 ? '(доод тал нь 2 тоглогч)' : ''}</button>`
          : `<div class="waiting-note"><span class="pulse-dot"></span>Өрөөний эзний тоглоом эхлүүлэхийг хүлээж байна...</div>`}
      </div>
    </div>
  `;
}
function attachWaitingEvents() {
  const btn = document.getElementById('startBtn');
  if (btn) btn.onclick = startGame;
}

function renderGame(rollingNow) {
  const room = currentRoom;
  if (room.winnerId) {
    const winner = room.players.find(p => p.id === room.winnerId);
    return `<div class="screen victory-box">
      <div class="eyebrow">Тэмцээн дуусав</div>
      <div class="victory-seal">${winner.token}</div>
      <div class="seal-title" style="font-size:22px;">Ялагч</div>
      <div class="victory-name">${winner.name}</div>
      <div class="victory-sub">Талын эзэнт улсыг бүрэн эзэгнэлээ · ₮${fmt(winner.money)}</div>
    </div>`;
  }

  const me = room.players.find(p => p.id === myId);
  const myTurn = isMyTurn(room);
  const currentPlayer = room.players[room.currentPlayerIndex];
  const centerD1 = room.lastDice ? room.lastDice[0] : null;
  const centerD2 = room.lastDice ? room.lastDice[1] : null;

  let cellsHtml = '';
  spaces.forEach((sp, idx) => {
    const pos = gridPos(idx);
    const isCorner = [0, 7, 14, 21].includes(idx);
    const owner = room.propOwner[idx] ? room.players.find(p => p.id === room.propOwner[idx]) : null;
    const isFullGroup = owner && sp.type === 'property' && ownsFullGroup(room, owner.id, idx);
    const tokensHere = room.players.filter(p => !p.bankrupt && displayPos(room, p) === idx);
    const tintStyle = owner ? `background-color: ${hexToRgba(owner.color, 0.16)};` : '';
    const level = sp.type === 'property' ? houseLevel(room, idx) : 0;
    const buildingsHtml = level > 0 ? renderBuildings(level) : '';
    const bodyInner = `
        ${buildingsHtml}
        <div class="cell-name">${sp.name}</div>
        ${sp.price ? `<div class="cell-price">₮${sp.price}</div>` : ''}`;
    const cellInner = isCorner
      ? `<div class="corner-badge">${sp.icon}</div><div class="cell-name corner-name">${sp.name}</div>`
      : `<div class="cell-header ${sideOf(idx)}"><span class="icon-standee">${sp.icon}</span></div><div class="cell-body">${bodyInner}</div>`;
    cellsHtml += `
      <div class="cell ${isCorner ? 'corner' : ''} ${owner ? 'owned-glow' : ''} ${isFullGroup ? 'group-complete' : ''}" style="grid-row:${pos.row};grid-column:${pos.col};${owner ? `--owner-color:${owner.color}` : ''}">
        ${owner ? `<span class="owner-badge" style="--owner-color:${owner.color}" title="${owner.name} эзэмшдэг">${owner.token}</span>` : ''}
        ${cellInner}
        <div class="cell-tint" style="${tintStyle}"></div>
        <div class="tokens-row">${tokensHere.map(p => `<span class="token-dot ${rollingNow && p.id === currentPlayer.id ? 'token-landed' : ''}" style="--token-ring:${p.color}">${p.token}</span>`).join('')}</div>
      </div>`;
  });
  cellsHtml += `<div class="cell-center">
    <div class="center-seal">${renderEmblemSvg()}</div>
    <div class="center-title">ТАЛЫН ЭЗЭНТ УЛС</div>
    <div class="center-subtitle">БИЗНЕС · ХӨРӨНГӨ · СТРАТЕГИ</div>
    <div class="center-dice-row">${renderDie(centerD1, rollingNow, true)}${renderDie(centerD2, rollingNow, true)}</div>
    ${renderCenterLeaderboard(room)}
    ${renderCenterTicker(room)}
  </div>`;

  let actionHtml = '';
  if (room.pendingAction && room.pendingAction.playerId === myId && room.pendingAction.type === 'buy') {
    const sp = spaces[room.pendingAction.spaceIndex];
    actionHtml = `
      <div class="buy-prompt">
        <div class="permit-eyebrow">🏮 Худалдааны зөвшөөрөл</div>
        "${sp.name}"-г ₮${sp.price}-р худалдаж авах уу?<br><span style="color:#9AA6BE;">Түрээс: ₮${sp.rent}/удаа</span>
        <button class="btn btn-primary" id="buyBtn" ${me.money < sp.price ? 'disabled' : ''}>Худалдаж авах</button>
        <button class="btn btn-secondary" id="skipBtn">Алгасах</button>
      </div>`;
  } else if (room.pendingAction && room.pendingAction.playerId === myId && room.pendingAction.type === 'build') {
    const sp = spaces[room.pendingAction.spaceIndex];
    const level = houseLevel(room, room.pendingAction.spaceIndex);
    const cost = buildCost(sp);
    const nextLabel = level + 1 >= 4 ? 'Корпорац' : `${level + 1}-р байшин`;
    actionHtml = `
      <div class="buy-prompt">
        <div class="permit-eyebrow">🏗️ Барилгын зөвшөөрөл</div>
        "${sp.name}" дээр ${nextLabel} барих уу?<br><span style="color:#9AA6BE;">Зардал: ₮${cost} · Одоогийн: ${level === 0 ? 'Байхгүй' : buildLevelLabel(level)}</span>
        <button class="btn btn-primary" id="buildBtn" ${me.money < cost ? 'disabled' : ''}>Барих</button>
        <button class="btn btn-secondary" id="skipBuildBtn">Алгасах</button>
      </div>`;
  } else if (myTurn) {
    const resultText = room.lastDice ? `Сүүлд гарсан: ${room.lastDice[0]} + ${room.lastDice[1]} = ${room.lastDice[0] + room.lastDice[1]}` : 'Тавцангийн голоос шоогоо хараарай';
    actionHtml = `
      <div class="dice-result-text">${resultText}</div>
      <button class="btn btn-primary" id="rollBtn" ${room.hasRolled ? 'disabled' : ''}>Шоо шидэх</button>
      <button class="btn btn-secondary" id="endTurnBtn" ${!room.hasRolled ? 'disabled' : ''}>Ээлжийг дуусгах</button>
    `;
  } else {
    actionHtml = `<div class="waiting-note"><span class="pulse-dot"></span>${currentPlayer.name}-ийн ээлж байна...</div>`;
  }

  return `
    <div class="game-wrap">
      <div class="top-bar">
        <div class="seal-title">Талын Эзэнт Улс</div>
        <div class="turn-indicator"><span class="pulse-dot"></span>Өрөө: ${room.roomCode} · ${currentPlayer.token} ${currentPlayer.name}-ийн ээлж</div>
      </div>
      <div class="game-layout">
        <div class="board-outer"><div class="board">${cellsHtml}</div></div>
        <div class="side-panel">
          <div class="panel-box">
            <h3>Тоглогчид</h3>
            ${room.players.map(p => {
              const ownedCount = Object.values(room.propOwner).filter(oid => oid === p.id).length;
              return `
              <div class="player-row ${p.id === currentPlayer.id ? 'active-turn' : ''} ${p.bankrupt ? 'p-bankrupt' : ''}">
                <span class="player-avatar" style="--ring-color:${p.color}">${p.token}</span>
                <span>${p.name}${p.id === myId ? ' (та)' : ''}</span>
                <span class="p-props">🏢${ownedCount}</span>
                <span class="p-money">₮${fmt(p.money)}</span>
              </div>`;
            }).join('')}
          </div>
          <div class="panel-box">
            <h3>Миний компаниуд</h3>
            ${(() => {
              const myProps = Object.keys(room.propOwner).filter(idx => room.propOwner[idx] === myId).map(Number).sort((a,b) => a-b);
              if (myProps.length === 0) return `<div class="no-assets">Одоогоор юу ч худалдаж аваагүй байна.</div>`;
              return myProps.map(idx => {
                const sp = spaces[idx];
                const full = ownsFullGroup(room, myId, idx);
                const level = houseLevel(room, idx);
                const levelTag = level > 0 ? ` <span class="group-badge">🏗️ ${buildLevelLabel(level)}</span>` : '';
                const rentShown = level > 0 ? sp.rent * [1,2,4,6,10][level] : (full ? sp.rent * 2 : sp.rent);
                return `<div class="asset-row"><span class="cell-icon">${sp.icon}</span><span class="asset-name">${sp.name}${full && level === 0 ? ' <span class="group-badge">★ бүлэг бүрэн</span>' : ''}${levelTag}</span><span class="asset-rent">₮${rentShown}/удаа</span></div>`;
              }).join('');
            })()}
          </div>
          <div class="panel-box action-area">
            <h3>Таны ээлж</h3>
            ${actionHtml}
          </div>
          <div class="panel-box">
            <h3>Тэмдэглэл</h3>
            <div class="log-box">${room.log.slice().reverse().map(l => `<div>${l}</div>`).join('')}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}
function attachGameEvents() {
  const roll = document.getElementById('rollBtn'); if (roll) roll.onclick = rollDice;
  const end = document.getElementById('endTurnBtn'); if (end) end.onclick = endTurn;
  const buy = document.getElementById('buyBtn'); if (buy) buy.onclick = buyProperty;
  const skip = document.getElementById('skipBtn'); if (skip) skip.onclick = skipBuy;
  const build = document.getElementById('buildBtn'); if (build) build.onclick = buildProperty;
  const skipBuild2 = document.getElementById('skipBuildBtn'); if (skipBuild2) skipBuild2.onclick = skipBuild;
}

render();
</script>
</body>
</html>
