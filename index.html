<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Их Хөрөнгө</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --night-indigo: #161616;
    --night-indigo-deep: #060606;
    --steppe-gold: #D4AF37;
    --seal-red: #C1553A;
    --parchment: #F2E7C6;
    --grass-green: #2E9E6B;
    --slate-line: #33291A;
    --grp-A: #E8317A;
    --grp-B: #14C088;
    --grp-C: #8A4FE8;
    --grp-D: #FF6B1F;

    --sidebar-bg: #041a16;
    --sidebar-bg-2: #092b24;
    --card-bg: rgba(8, 38, 31, 0.96);
    --card-light: rgba(18, 65, 52, 0.94);
    --gold: #f5ca55;
    --gold-light: #ffe69a;
    --gold-dark: #8e5c0a;
    --emerald: #087557;
    --emerald-light: #22c58b;
    --emerald-dark: #043c30;
    --cream: #fff2cf;
    --sb-text: #fff7df;
    --sb-muted: #a9c2b9;
    --sb-danger: #e85d5d;
    --sb-blue: #4599ff;
    --radius-large: 22px;
    --radius-medium: 16px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body { overflow-x: hidden; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% -10%, #1c1710 0%, var(--night-indigo-deep) 60%), var(--night-indigo-deep);
    color: var(--parchment);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }
  .eyebrow { font-size: 10.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--steppe-gold); text-align: center; opacity: 0.85; margin-bottom: 6px; }
  .screen { max-width: 480px; margin: 0 auto; padding: 48px 20px 30px; }
  .seal-title {
    font-family: 'Cinzel', serif; font-weight: 800; font-size: 27px; letter-spacing: 2px;
    background: linear-gradient(180deg, #F7E7B0 0%, #D4AF37 45%, #A9822A 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-transform: uppercase; text-align: center; margin-bottom: 4px;
    filter: drop-shadow(0 2px 6px rgba(212,175,55,0.2));
  }
  .subtitle { text-align: center; color: #9AA6BE; font-size: 13px; margin-bottom: 8px; }
  .motif-strip { text-align: center; font-size: 15px; letter-spacing: 6px; opacity: 0.55; margin: 14px 0 28px; }

  /* ===== PREMIUM LOBBY ===== */
  :root {
    --bg-deep: #020c09;
    --bg-emerald: #063c2d;
    --panel: rgba(5, 30, 24, 0.88);
    --panel-light: rgba(14, 61, 47, 0.86);
    --lp-muted: #a9beb7;
    --chart-bg: #041713;
    --chart-grid: rgba(255,255,255,0.06);
    --candle-up: #23d18b;
    --candle-down: #ef5b5b;
    --candle-neutral: #e4b943;
    --chart-text: #e9ddba;
    --crosshair: #f5c94f;
  }
  .lobby-screen { position: relative; min-height: 100vh; overflow: hidden; padding: 0; }
  .lobby-bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 100%, var(--bg-emerald) 0%, var(--bg-deep) 65%), var(--bg-deep); }
  .lobby-glow-top { position: absolute; top: -20%; left: 50%; transform: translateX(-50%); width: 900px; height: 500px; background: radial-gradient(ellipse, rgba(245,202,85,0.16) 0%, transparent 70%); animation: lobbyGlowTop 6s ease-in-out infinite; }
  .lobby-glow-center { position: absolute; top: 40%; left: 30%; width: 700px; height: 700px; background: radial-gradient(circle, rgba(37,203,144,0.14) 0%, transparent 65%); animation: lobbyGlowCenter 8s ease-in-out infinite; }
  @keyframes lobbyGlowTop { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
  @keyframes lobbyGlowCenter { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .lobby-pattern {
    position: absolute; inset: 0; opacity: 0.05;
    background-image: repeating-linear-gradient(45deg, var(--gold) 0 2px, transparent 2px 30px), repeating-linear-gradient(-45deg, var(--gold) 0 2px, transparent 2px 30px);
  }
  .lobby-vignette { position: absolute; inset: 0; box-shadow: inset 0 0 220px rgba(0,0,0,0.75); }

  .lobby-auth-bar { position: relative; z-index: 5; display: flex; justify-content: flex-end; gap: 14px; padding: 16px 24px 0; font-size: 12px; font-weight: 700; }
  .lobby-auth-bar a { color: var(--gold); text-decoration: none; padding: 6px 14px; border: 1px solid rgba(245,202,85,0.4); border-radius: 16px; }
  .lobby-auth-bar a.muted-link { color: var(--lp-muted); border-color: rgba(255,255,255,0.15); }
  .lobby-auth-bar #landingProfileLink { background: rgba(245,202,85,0.1); }

  .lobby-layout {
    position: relative; z-index: 2; display: grid; grid-template-columns: 58% 42%;
    align-items: center; gap: 0; max-width: 1400px; margin: 0 auto; padding: 10px 40px 40px;
    min-height: calc(100vh - 50px);
  }

  .lobby-hero { padding-right: 30px; animation: heroFadeIn 0.8s ease both; }
  @keyframes heroFadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .hero-badge {
    display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: 2.5px;
    color: var(--gold-light); border: 1px solid rgba(245,202,85,0.4); border-radius: 20px;
    padding: 6px 16px; margin-bottom: 18px; background: rgba(245,202,85,0.06);
  }
  .hero-title {
    font-family: 'Cinzel', serif; font-weight: 800; font-size: clamp(46px, 6.5vw, 92px);
    line-height: 0.95; margin: 0 0 18px; text-transform: uppercase;
    color: var(--cream);
    animation: heroTitleGlow 0.9s 0.3s ease both;
  }
  .hero-title span {
    display: block;
    background: linear-gradient(180deg, #fff6d8 0%, var(--gold) 40%, var(--gold-dark) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(245,202,85,0.35));
  }
  @keyframes heroTitleGlow { from { opacity: 0; letter-spacing: 8px; } to { opacity: 1; letter-spacing: normal; } }
  .hero-divider { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; max-width: 220px; }
  .hero-divider span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .hero-divider i { color: var(--gold); font-size: 12px; font-style: normal; }
  .hero-subtitle { font-size: clamp(15px, 1.6vw, 19px); line-height: 1.55; color: var(--lp-muted); font-weight: 500; margin-bottom: 26px; }

  .hero-city { position: relative; height: clamp(180px, 24vw, 300px); margin-bottom: 26px; }
  .hero-city-glow { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 70%; height: 60%; background: radial-gradient(ellipse, rgba(37,203,144,0.28) 0%, transparent 75%); }
  .hero-bldg { position: absolute; bottom: 0; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0,0,0,0.5)); }
  .hero-bldg-corp { left: 50%; transform: translateX(-50%); height: 100%; max-width: 40%; z-index: 4; animation: corpRiseIn 0.8s 0.5s cubic-bezier(.2,.9,.3,1) both, heroFloat 6s 1.3s ease-in-out infinite; }
  @keyframes corpRiseIn { from { opacity: 0; transform: translateX(-50%) scale(0.85) translateY(20px); } to { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); } }
  @keyframes heroFloat { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-6px); } }
  .hero-bldg-bank { left: 0%; height: 55%; max-width: 22%; z-index: 2; opacity: 0.85; animation: bldgFadeIn 0.7s 0.7s ease both; }
  .hero-bldg-mine { display: none; }
  .hero-bldg-telecom { right: 0%; height: 62%; max-width: 22%; z-index: 2; opacity: 0.85; animation: bldgFadeIn 0.7s 0.75s ease both; }
  .hero-bldg-retail { display: none; }
  .hero-bldg-factory { display: none; }
  @keyframes bldgFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: var(--final-op, 0.85); transform: translateY(0); } }
  .hero-coins { position: absolute; inset: 0; pointer-events: none; }
  .hero-coins span { position: absolute; bottom: 10%; font-size: 18px; opacity: 0; left: calc(10% + var(--i) * 11%); animation: coinFloatUp 4.5s calc(var(--i) * 0.4s + 1.4s) ease-in-out infinite; }
  @keyframes coinFloatUp { 0% { opacity: 0; transform: translateY(0) rotate(0deg); } 15% { opacity: 0.9; } 85% { opacity: 0.6; } 100% { opacity: 0; transform: translateY(-90px) rotate(200deg); } }

  .hero-features { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; animation: heroFadeIn 0.8s 1.1s ease both; }
  .hf-item { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--cream); background: rgba(255,255,255,0.05); border: 1px solid rgba(245,202,85,0.25); border-radius: 20px; padding: 8px 14px; }
  .hf-icon { font-size: 15px; }
  .hero-live { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--lp-muted); animation: heroFadeIn 0.8s 1.2s ease both; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald-light); animation: pulse 1.4s infinite; }

  .lobby-panel-wrap { display: flex; justify-content: center; animation: panelSlideIn 0.7s 0.5s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes panelSlideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
  .lobby-panel {
    position: relative; width: 100%; max-width: 400px;
    background: linear-gradient(160deg, var(--panel-light) 0%, var(--panel) 100%);
    border: 2px solid transparent;
    border-image: linear-gradient(160deg, var(--gold-light), var(--gold-dark)) 1;
    border-radius: 26px; padding: 30px 26px 26px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
  }
  .lp-corner { position: absolute; width: 22px; height: 22px; border: 2px solid var(--gold); opacity: 0.7; }
  .lp-corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
  .lp-corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
  .lp-corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
  .lp-corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }
  .lp-title { text-align: center; font-family: 'Cinzel', serif; font-weight: 800; font-size: 17px; letter-spacing: 2.5px; color: var(--gold-light); margin-bottom: 20px; }

  .lp-profile-preview { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px; }
  .lp-avatar { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--ring-color, var(--gold)) 55%, white 45%) 0%, var(--bg-deep) 78%); border: 3px solid var(--ring-color, var(--gold)); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
  .lp-avatar-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid rgba(245,202,85,0.4); background: rgba(0,0,0,0.25); color: var(--gold-light); font-size: 18px; cursor: pointer; }

  .lp-input-row { position: relative; }
  .lp-input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: 0.6; }
  .lp-input-row input { padding-left: 40px !important; height: 58px; font-size: 15px !important; }

  .lp-cta {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 62px; margin-top: 18px; border: none; border-radius: 16px;
    background: linear-gradient(180deg, #ffd876 0%, #f5a623 55%, #d9740d 100%);
    color: #2a1a05; font-weight: 800; font-size: 16px; letter-spacing: 0.5px; cursor: pointer;
    border: 2px solid var(--gold-light);
    box-shadow: 0 6px 0 var(--gold-dark), 0 12px 24px rgba(0,0,0,0.4);
    position: relative; overflow: hidden;
    animation: ctaPulse 2.4s 1.8s ease-in-out 2;
  }
  .lp-cta-icon { font-size: 19px; }
  .lp-cta:hover::after { content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent); animation: sbShine 0.9s ease; }
  .lp-cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gold-dark); }
  @keyframes ctaPulse { 0%,100% { box-shadow: 0 6px 0 var(--gold-dark), 0 12px 24px rgba(0,0,0,0.4); } 50% { box-shadow: 0 6px 0 var(--gold-dark), 0 12px 24px rgba(0,0,0,0.4), 0 0 26px rgba(245,202,85,0.6); } }

  .lp-or { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; color: var(--gold-light); font-size: 11px; font-weight: 800; letter-spacing: 2px; }
  .lp-or span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(245,202,85,0.5), transparent); }

  .lp-code-input { text-align: center; text-transform: uppercase; letter-spacing: 10px; font-size: 22px !important; font-weight: 800; height: 58px; }
  .lp-join-btn {
    width: 100%; height: 54px; margin-top: 12px; border-radius: 14px;
    background: linear-gradient(160deg, var(--emerald-light), var(--emerald));
    color: var(--cream); border: 1.5px solid var(--gold); font-weight: 800; font-size: 14px; letter-spacing: 0.5px; cursor: pointer;
  }
  .lp-join-btn:hover { box-shadow: 0 0 18px rgba(37,203,144,0.5); }

  .lp-guest-note { text-align: center; font-size: 11.5px; color: var(--lp-muted); margin-top: 14px; }

  /* ===== PROFILE LEVEL/RANK ===== */
  .profile-title-badge { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--gold-light); border: 1px solid rgba(245,202,85,0.4); border-radius: 14px; padding: 4px 12px; margin: 6px 0 12px; background: rgba(245,202,85,0.08); }
  .profile-level-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .profile-level-num { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 13px; color: var(--gold-light); flex-shrink: 0; }
  .profile-xp-bar { flex: 1; height: 8px; border-radius: 5px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .profile-xp-fill { height: 100%; background: linear-gradient(90deg, var(--emerald-light), var(--gold)); border-radius: 5px; transition: width 0.4s ease; }
  .profile-xp-label { font-size: 10px; color: var(--lp-muted, #9AA6BE); flex-shrink: 0; }
  .profile-rank-badge { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--rank-color, var(--gold)); border-radius: 16px; padding: 6px 16px; margin-bottom: 14px; }
  .prb-tier { font-weight: 800; font-size: 13px; color: var(--rank-color, var(--gold)); }
  .prb-mmr { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--lp-muted, #9AA6BE); }

  /* ===== RANKED MATCHMAKING ===== */
  .lp-mm-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 54px; margin-top: 10px; border-radius: 14px;
    background: linear-gradient(160deg, #3a1030, #1a0818); border: 1.5px solid #c94fd8;
    color: #f3d8ff; font-weight: 800; font-size: 13.5px; letter-spacing: 0.5px; cursor: pointer;
  }
  .lp-mm-btn:hover { box-shadow: 0 0 18px rgba(201,79,216,0.5); }

  .mm-modal-backdrop { position: fixed; inset: 0; z-index: 3300; background: rgba(2,10,8,0.82); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .mm-modal { position: relative; width: min(92vw, 420px); background: linear-gradient(160deg, var(--panel-light), var(--panel)); border: 2px solid var(--gold); border-radius: 22px; padding: 26px 22px 22px; text-align: center; }
  .mm-modal-title { font-family: 'Cinzel', serif; font-weight: 800; font-size: 15px; letter-spacing: 2px; color: var(--gold-light); margin-bottom: 18px; }
  .mm-mode-select { display: flex; flex-direction: column; gap: 10px; }
  .mm-mode-btn { width: 100%; }

  .mm-searching { display: flex; flex-direction: column; align-items: center; }
  .mm-radar { position: relative; width: 120px; height: 120px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
  .mm-radar-ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(245,202,85,0.4); animation: mmRadarPulse 2.4s ease-out infinite; }
  .mm-r2 { animation-delay: 0.6s; }
  .mm-r3 { animation-delay: 1.2s; }
  @keyframes mmRadarPulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.15); opacity: 0; } }
  .mm-radar-scan { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(245,202,85,0.5), transparent 60%); animation: mmScanSpin 2.2s linear infinite; }
  @keyframes mmScanSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .mm-radar-avatar { position: relative; z-index: 1; width: 56px; height: 56px; border-radius: 50%; background: var(--bg-deep, #041a16); border: 2.5px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .mm-search-mode { font-weight: 800; font-size: 11px; letter-spacing: 1.5px; color: var(--gold-light); margin-bottom: 4px; }
  .mm-search-text { font-size: 14px; color: var(--sb-text, #e8e0c8); margin-bottom: 6px; }
  .mm-search-time { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 800; color: var(--gold); margin-bottom: 6px; }
  .mm-search-mmr { font-size: 11px; color: var(--lp-muted, #9AA6BE); margin-bottom: 16px; }

  .mm-found-title { font-family: 'Cinzel', serif; font-weight: 800; font-size: 17px; color: var(--gold); margin-bottom: 16px; animation: prepGlow 1s ease-in-out infinite; }
  .mm-vs-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .mm-vs-side { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 110px; }
  .mm-vs-avatar { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 2.5px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .mm-vs-name { font-weight: 800; font-size: 12.5px; color: var(--sb-text, #e8e0c8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .mm-vs-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--lp-muted, #9AA6BE); }
  .mm-vs-mark { font-family: 'Cinzel', serif; font-weight: 800; font-size: 20px; color: #e85d5d; }
  .mm-countdown { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 800; color: var(--gold-light); margin-bottom: 16px; }
  .mm-accept-row { display: flex; gap: 10px; }
  .mm-accept-row .btn { flex: 1; }
  .mm-waiting-accept { color: var(--emerald-light, #25cb90); font-size: 13px; font-weight: 700; }

  .lp-guest-note a { color: var(--gold); }

  @media (max-width: 1050px) {
    .lobby-layout { grid-template-columns: 1fr; padding: 10px 24px 30px; gap: 20px; }
    .lobby-hero { padding-right: 0; order: 1; text-align: center; }
    .hero-divider, .hero-features { justify-content: center; margin-left: auto; margin-right: auto; }
    .lobby-panel-wrap { order: 2; }
    .hero-city { height: 200px; }
  }
  @media (max-width: 560px) {
    .lobby-auth-bar { padding: 12px 14px 0; justify-content: center; }
    .lobby-layout { padding: 6px 14px calc(20px + env(safe-area-inset-bottom)); }
    .hero-title { font-size: 44px; }
    .hero-subtitle { font-size: 14px; }
    .lobby-panel { padding: 22px 16px 20px; max-width: 100%; }
    .lp-cta, .lp-join-btn, .lp-avatar-btn { min-height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lobby-hero, .hero-title, .hero-city, .hero-bldg, .hero-features, .hero-live, .lobby-panel-wrap, .lp-cta {
      animation: none !important; opacity: 1 !important; transform: none !important;
    }
    .hero-coins, .lobby-glow-top, .lobby-glow-center, .live-dot { animation: none !important; }
  }

  .landing-card {
    background: linear-gradient(160deg, #1c1c1c 0%, #131313 100%);
    border: 1px solid var(--slate-line); border-radius: 16px; padding: 22px 20px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  label { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #8b96b0; margin: 18px 0 7px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 13px 14px; border-radius: 8px; border: 1px solid var(--slate-line);
    background: var(--night-indigo); color: var(--parchment); font-size: 16px; font-family: 'Work Sans', sans-serif;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type=text]:focus, input[type=email]:focus, input[type=password]:focus { outline: none; border-color: var(--steppe-gold); box-shadow: 0 0 0 3px rgba(212,162,78,0.15); }

  .pw-row { position: relative; }

  .btn {

  /* Game screen */

  /* Owned companies */
  .sb-company-scroll { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }

  .sb-viewall-btn {

  @keyframes sbCardEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .board-outer { display: flex; justify-content: center; min-width: 0; overflow: hidden; }

  /* ===== MOBILE BOARD MODE (reference-matched) ===== */
  :root { --mobile-dock-height: 186px; }
  @media (max-width: 768px) {
    body.view-game { height: 100%; overflow: hidden; }
    .game-wrap {
      padding: 0; background: radial-gradient(ellipse at 50% 0%, var(--bg-emerald) 0%, var(--bg-deep) 70%), var(--bg-deep);
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .game-layout { display: flex; flex-direction: column; gap: 0; background: transparent; flex: 1 1 auto; min-height: 0; }
    .board-outer {
      padding: 0; background: var(--bg-deep);
      display: flex; justify-content: center; align-items: center;
      flex: 1 1 auto; min-height: 0; width: 100%;
      overflow: hidden;
    }
    .board-viewport {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      aspect-ratio: unset;
      touch-action: none;
      border-radius: 0;
      margin: 0;
      background: var(--bg-deep);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .board-frame { aspect-ratio: 1672 / 941; height: 100%; width: auto; max-width: 100%; margin: 0 auto; }
    .board-camera { touch-action: none; }
    .game-sidebar { display: none; }
    .mobile-board-controls { display: flex; }
    .mobile-sticky-bar { display: none; }
    .mobile-hud { flex: 0 0 auto; }
    .mobile-action-dock { flex: 0 0 auto; min-height: calc(var(--mobile-dock-height) + env(safe-area-inset-bottom)); }
    .mobile-sheet {
      flex: 0 0 auto;
      position: static;
    }
    .mobile-sheet.expanded {
      position: fixed; left: 0; right: 0;
      bottom: calc(var(--mobile-dock-height) + env(safe-area-inset-bottom));
      z-index: 35;
      max-height: 55vh;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }
  }
  .mobile-board-controls {
    display: none; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 25;
    flex-direction: column; gap: 10px; align-items: center;
  }
  .mbc-btn {

    color: var(--cream); border-radius: 50%; width: 42px; height: 42px; font-size: 19px; font-weight: 800; cursor: pointer;

    background: linear-gradient(180deg, #0a2b22 0%, #072019 100%);

  .mhud-row { display: flex; align-items: center; gap: 8px; }

  /* ===== TILE INTERACTION STATE SYSTEM ===== */
  .tile-hit-area { fill: transparent; stroke: none; cursor: pointer; pointer-events: all; }
  .tile-surface { fill: transparent; stroke: transparent; stroke-width: 2; pointer-events: none; transition: fill 0.18s ease, stroke 0.18s ease, stroke-width 0.18s ease; }
  .tile { transform-box: fill-box; transform-origin: center; transition: filter 0.2s ease; }
  .tile:focus-visible .tile-surface { fill: transparent; stroke: transparent; }
  .tile:focus-visible { outline: none; }

  /* 1. available */
  .tile--available .tile-surface { fill: transparent; stroke: transparent; }

  /* 2. owned (base ring stays visible under other states) */
  .tile--owned .tile-surface { fill: transparent; }

  /* 3. hovered */
  .tile--hovered { transform: none; }
  .tile--hovered .tile-surface { fill: transparent; stroke: transparent; }

  /* 4. buildable */
  .tile--buildable .tile-surface { fill: transparent; stroke: transparent; animation: none; }

  /* 5. current (player standing here) */
  .tile--current .tile-surface { fill: transparent; stroke: transparent; }
  .tile--current::before { content: ''; }

  /* 6. selected (strongest, drawn last visually via filter+transform) */
  .tile--selected { transform: none; filter: none; }
  .tile--selected .tile-surface { fill: transparent; stroke: transparent; }

  /* 7. mortgaged (strongest precedence, dampens everything else) */
  .tile--mortgaged .tile-surface { fill: rgba(20,25,30,0.55); stroke: #6b7688; stroke-width: 2; }
  .tile--mortgaged { filter: saturate(0.45) brightness(0.75); }
  .tile--mortgaged.tile--buildable .tile-surface { animation: none; stroke: #6b7688; }
  .tile--mortgaged.tile--available .tile-surface { fill: rgba(20,25,30,0.55); stroke: #6b7688; }
  .mortgage-lock { pointer-events: none; }

let mmState = {
  isOpen: false,
  stage: 'idle', // idle | searching | found | accepting | error

function openMatchmakingModal() {
  if (!authState.user) { view = 'auth-signup'; authFormState = { loading: false, error: '\u041c\u0430\u0442\u0447\u043c\u0435\u0439\u043a\u0438\u043d\u0433 \u0430\u0448\u0438\u0433\u043b\u0430\u0445\u044b\u043d \u0442\u0443\u043b\u0434 \u0431\u04af\u0440\u0442\u0433\u04af\u04af\u043b\u043d\u04af\u04af.', info: '' }; render(); return; }
  mmState = { isOpen: true, stage: 'idle', mode: 'ranked_1v1', queueId: null, searchStartedAt: null, opponent: null, gameId: null, myAccepted: false, opponentAccepted: false, acceptDeadline: null, error: '' };

function closeMatchmakingModal() {
  stopMatchmakingTimers();
  if (mmState.queueId && mmState.stage === 'searching') cancelMatchmaking();

  render();
}
function stopMatchmakingTimers() {
  if (mmPollTimer) { clearInterval(mmPollTimer); mmPollTimer = null; }
  if (mmTickTimer) { clearInterval(mmTickTimer); mmTickTimer = null; }
}

async function startMatchmaking(mode) {
  mmState.mode = mode; mmState.error = '';
  try {
    const { data, error } = await supabaseClient.rpc('join_matchmaking_queue', { p_mode: mode });
    if (error || !data) { mmState.error = '\u0425\u0430\u0439\u043b\u0442 \u044d\u0445\u043b\u04af\u04af\u043b\u044d\u0445\u044d\u0434 \u0430\u043b\u0434\u0430\u0430 \u0433\u0430\u0440\u043b\u0430\u0430.'; mmState.stage = 'error'; render(); return; }
    mmState.queueId = data.id; mmState.searchStartedAt = Date.now(); mmState.stage = 'searching';
    render();
    audioManager.playSfx('buttonClick');
    mmTickTimer = setInterval(() => { if (mmState.stage === 'searching') render(); }, 1000);
    mmPollTimer = setInterval(pollForMatch, 2500);
    pollForMatch();
  } catch (e) { mmState.error = '\u0410\u043b\u0434\u0430\u0430 \u0433\u0430\u0440\u043b\u0430\u0430.'; mmState.stage = 'error'; render(); }
}

async function pollForMatch() {
  if (!mmState.queueId || mmState.stage !== 'searching') return;
  try {
    await supabaseClient.rpc('matchmaking_heartbeat', { p_queue_id: mmState.queueId });
    const { data, error } = await supabaseClient.rpc('try_find_match', { p_queue_id: mmState.queueId });
    if (error || !data || data.length === 0) return;
    const result = data[0];
    if (result.matched) {
      stopMatchmakingTimers();
      mmState.gameId = result.game_id;
      mmState.stage = 'found';
      mmState.acceptDeadline = Date.now() + 15000;
      const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', result.opponent_user_id).single();
      const { data: oppStats } = await supabaseClient.from('player_statistics').select('*').eq('user_id', result.opponent_user_id).single();
      mmState.opponent = { id: result.opponent_user_id, name: (prof && prof.display_name) || '\u0422\u043e\u0433\u043b\u043e\u0433\u0447', avatar: (prof && prof.avatar) || '\ud83d\udc0e', level: (oppStats && oppStats.level) || 1, mmr: (oppStats && oppStats.mmr) || 1000 };
      audioManager.playSfx('bonusUnlocked'); vibrate([60, 40, 60]);
      mmTickTimer = setInterval(() => { render(); if (mmState.acceptDeadline && Date.now() > mmState.acceptDeadline && mmState.stage === 'found') handleAcceptTimeout(); }, 500);
      render();
    }
  } catch (e) { /* transient network errors: keep polling silently */ }
}

async function cancelMatchmaking() {
  stopMatchmakingTimers();
  if (mmState.queueId) {
    try { await supabaseClient.rpc('cancel_matchmaking', { p_queue_id: mmState.queueId }); } catch (e) {}
  }
  mmState = { isOpen: mmState.isOpen, stage: 'idle', mode: mmState.mode, queueId: null, searchStartedAt: null, opponent: null, gameId: null, myAccepted: false, opponentAccepted: false, acceptDeadline: null, error: '' };
  render();
}

function handleAcceptTimeout() {
  stopMatchmakingTimers();
  mmState.stage = 'idle';
  mmState.error = '\u0425\u0443\u0433\u0430\u0446\u0430\u0430 \u0434\u0443\u0443\u0441\u0441\u0430\u043d, \u0434\u0430\u0445\u0438\u043d \u043e\u0440\u043e\u043b\u0434\u043e\u043d\u043e \u0443\u0443.';
  render();

async function acceptMatch() {

async function pollOpponentAccept() {
  if (mmState.stage !== 'found' || !mmState.opponent) return;
  try {
    const { data, error } = await supabaseClient.from('matchmaking_queue').select('accepted, declined, status')
      .eq('matched_game_id', mmState.gameId).eq('user_id', mmState.opponent.id).single();
    if (error || !data) return;
    if (data.declined || data.status === 'searching') {
      stopMatchmakingTimers();
      mmState.stage = 'idle'; mmState.error = '\u04e8\u0440\u0441\u04e9\u043b\u0434\u04e9\u0433\u0447 \u0442\u0430\u0442\u0433\u0430\u043b\u0437\u043b\u0430\u0430.'; mmState.opponent = null;
      render(); return;

let cardDecks = null;
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(deckRandom() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function deckRandom() { return Math.random(); }
function ensureDecks(room) {
  if (!room.decks) {
    room.decks = {
      chance: { draw: shuffleArr(CHANCE_CARDS.map(c => c.id)), discard: [] },
      market: { draw: shuffleArr(MARKET_CARDS.map(c => c.id)), discard: [] },
    };
  }
  cardDecks = room.decks;
}
function drawCardFromDeck(room, deckType) {
  ensureDecks(room);
  const deck = room.decks[deckType];
  if (deck.draw.length === 0) {
    if (deck.discard.length === 0) return null;
    deck.draw = shuffleArr(deck.discard);
    deck.discard = [];
  }
  const id = deck.draw.shift();
  deck.discard.push(id);
  const pool = deckType === 'chance' ? CHANCE_CARDS : MARKET_CARDS;
  return pool.find(c => c.id === id) || null;
}

function getActiveMultiplier(room, sp, kind) {
  if (!room.activeMarketEffects) return 1;
  let mult = 1;
  for (const eff of room.activeMarketEffects) {

    } else if (kind === 'buildingCost') {
      if (eff.effectType === 'buildingCostMultiplier') mult *= eff.multiplier;
    }
  }
  return mult;
}

/* ===== AUDIO MANAGER ===== */
const SOUND_ASSETS = {
  diceRoll: 'dice-roll.mp3', tokenStep: 'token-step.mp3', coinReward: 'coin-reward.mp3',
  companyPurchase: 'company-purchase.mp3', buildingRise: 'building-rise.mp3',
  corporationVictory: 'corporation-victory.mp3', auctionTick: 'auction-tick.mp3',
  buttonClick: 'button-click.mp3', cardFlip: 'card-flip.mp3', bonusUnlocked: 'bonus-unlocked.mp3',
  dayTheme: 'day-theme.mp3', nightTheme: 'night-theme.mp3', victoryTheme: 'victory-theme.mp3',
  rentStart: 'rent-start.mp3', moneyTransfer: 'money-transfer.mp3', rentReceived: 'rent-received.mp3', bigRent: 'big-rent.mp3',
  lobbyTheme: 'day-theme.mp3',
  gameDayTheme: 'game-day-theme.mp3', gameNightTheme: 'game-night-theme.mp3', gameTensionTheme: 'game-tension-theme.mp3',
};
const MUSIC_DUCK_AMOUNT = {
  diceRoll: 0.20, companyPurchase: 0.35, rentStart: 0.40, corporationVictory: 0.55, cardFlip: 0.25,
};
const AudioManager = (function () {
  const sfxCache = {};
  const failedAssets = new Set();
  let musicEl = null;
  let musicKey = null;
  let unlocked = false;
  const pendingMusic = { key: null };
  let duckLevel = 0; // 0 = no duck, up to 1 = fully ducked
  let duckRestoreTimer = null;
  let victoryLocked = false;
  let wasPlayingBeforeHidden = false;

  function getSfxAudio(key) {
    if (failedAssets.has(key)) return null;
    if (!sfxCache[key]) {
      const a = new Audio(SOUND_ASSETS[key]);
      a.addEventListener('error', () => { failedAssets.add(key); }, { once: true });
      sfxCache[key] = a;
    }
    return sfxCache[key];
  }

  function applyMusicVolume() {
    if (!musicEl) return;
    musicEl.volume = Math.max(0, gameSettings.musicVolume * (1 - duckLevel));
  }

  function duck(amount, restoreMs) {
    if (!musicEl || !gameSettings.musicEnabled) return;
    duckLevel = Math.max(duckLevel, amount);
    applyMusicVolume();
    if (duckRestoreTimer) clearTimeout(duckRestoreTimer);
    duckRestoreTimer = setTimeout(() => {
      const steps = 10, stepMs = (restoreMs || 650) / steps;
      let i = 0;
      const startDuck = duckLevel;
      const restoreInterval = setInterval(() => {
        i++;
        duckLevel = Math.max(0, startDuck * (1 - i / steps));
        applyMusicVolume();
        if (i >= steps) { duckLevel = 0; applyMusicVolume(); clearInterval(restoreInterval); }
      }, stepMs);
    }, 60);
  }

  function playSfx(key) {
    if (!gameSettings.sfxEnabled) return;
    if (!SOUND_ASSETS[key]) return;
    if (MUSIC_DUCK_AMOUNT[key]) duck(MUSIC_DUCK_AMOUNT[key], 650);
    try {
      const a = getSfxAudio(key);
      if (!a) return;
      const clone = a.cloneNode();
      clone.volume = gameSettings.sfxVolume;
      const p = clone.play();
      if (p && p.catch) p.catch(() => { failedAssets.add(key); });
    } catch (e) {}
  }

  function playMusic(key, opts) {
    opts = opts || {};
    if (victoryLocked && key !== 'victoryTheme') return;
    if (key === 'victoryTheme') victoryLocked = true;
    if (!SOUND_ASSETS[key]) return;
    if (!gameSettings.musicEnabled) { musicKey = key; return; }
    if (!unlocked) { pendingMusic.key = key; musicKey = key; return; }
    if (musicKey === key && musicEl && !musicEl.paused) return;
    const newEl = new Audio(SOUND_ASSETS[key]);
    newEl.loop = opts.loop !== false;
    newEl.volume = 0;
    newEl.addEventListener('error', () => {}, { once: true });
    const oldEl = musicEl;
    musicEl = newEl; musicKey = key; duckLevel = 0;
    const p = newEl.play();
    if (p && p.catch) p.catch(() => {});
    const steps = 24, dur = 1200, stepMs = dur / steps;
    let i = 0;
    const fade = setInterval(() => {
      i++;
      const t = i / steps;
      newEl.volume = Math.min(gameSettings.musicVolume, gameSettings.musicVolume * t);
      if (oldEl) oldEl.volume = Math.max(0, gameSettings.musicVolume * (1 - t));
      if (i >= steps) {
        clearInterval(fade);
        if (oldEl) { oldEl.pause(); }
      }
    }, stepMs);
  }

  function stopMusic() {
    if (musicEl) { musicEl.pause(); musicEl = null; }
    musicKey = null;
  }

  function resetVictoryLock() { victoryLocked = false; }

  function setSfxVolume(v) { gameSettings.sfxVolume = v; saveSettings(); }
  function setMusicVolume(v) {
    gameSettings.musicVolume = v; saveSettings();
    applyMusicVolume();
  }
  function setMuted(type, muted) {
    if (type === 'sfx') gameSettings.sfxEnabled = !muted;
    if (type === 'music') {
      gameSettings.musicEnabled = !muted;
      if (muted) { stopMusic(); } else if (musicKey) { playMusic(musicKey); }
    }
    saveSettings();
  }

  function unlock() {
    if (unlocked) return;
    unlocked = true;
    if (pendingMusic.key) { const k = pendingMusic.key; pendingMusic.key = null; playMusic(k); }
  }
  ['click', 'touchstart', 'keydown'].forEach(evt => document.addEventListener(evt, unlock, { once: true }));

  document.addEventListener('visibilitychange', () => {
    if (!musicEl) return;
    if (document.hidden) {
      wasPlayingBeforeHidden = !musicEl.paused;
      duck(0.85, 400);
    } else if (wasPlayingBeforeHidden && gameSettings.musicEnabled) {
      if (duckRestoreTimer) clearTimeout(duckRestoreTimer);
      duckLevel = 0;
      applyMusicVolume();
    }
  });

  return { playSfx, playMusic, stopMusic, setSfxVolume, setMusicVolume, setMuted, duck, resetVictoryLock };
})();

function isMyTurn(room) { return room.players[room.currentPlayerIndex] && room.players[room.currentPlayerIndex].id === myId; }
function pushLog(room, text) { room.log.push(text); if (room.log.length > 40) room.log = room.log.slice(-40); }

/* ===== WEALTH CANDLESTICK HISTORY ===== */
function currentRoundNumber(room) { return Math.floor((room.turnCount || 0) / room.players.length) + 1; }
function ensureWealthHistory(room) {
  if (!room.wealthHistory) room.wealthHistory = {};
  room.players.forEach(p => { if (!room.wealthHistory[p.id]) room.wealthHistory[p.id] = []; });
}
function ensureCurrentCandle(room, playerId) {
  ensureWealthHistory(room);
  const hist = room.wealthHistory[playerId];
  const round = currentRoundNumber(room);
  let candle = hist.length > 0 ? hist[hist.length - 1] : null;
  if (!candle || candle.round !== round) {
    const player = room.players.find(p => p.id === playerId);
    const netWorth = player ? computePlayerWealth(room, player).total : 1500;
    candle = { playerId, round, open: netWorth, high: netWorth, low: netWorth, close: netWorth, change: 0, changePercent: 0, transactionVolume: 0, events: [] };
    hist.push(candle);
    if (hist.length > 260) room.wealthHistory[playerId] = hist.slice(-220);
  }
  return candle;
}
function recordWealthChange(room, { playerId, type, amount, tileId, companyId, description, eventId }) {
  if (!room || !playerId) return;
  const player = room.players.find(p => p.id === playerId);
  if (!player) return;
  if (eventId) {
    if (!room._recordedEventIds) room._recordedEventIds = [];
    if (room._recordedEventIds.includes(eventId)) return;
    room._recordedEventIds.push(eventId);
    if (room._recordedEventIds.length > 400) room._recordedEventIds = room._recordedEventIds.slice(-400);
  }
  const candle = ensureCurrentCandle(room, playerId);
  const netWorth = computePlayerWealth(room, player).total;
  candle.high = Math.max(candle.high, netWorth);
  candle.low = Math.min(candle.low, netWorth);
  candle.close = netWorth;
  candle.change = candle.close - candle.open;
  candle.changePercent = candle.open !== 0 ? (candle.change / Math.abs(candle.open) * 100) : 0;
  candle.transactionVolume = (candle.transactionVolume || 0) + Math.abs(amount || 0);
  if (type) {
    candle.events.push({
      id: eventId || (Date.now() + '-' + Math.random().toString(36).slice(2)),
      type, amount: amount || 0, tileId: tileId != null ? tileId : null, companyId: companyId || null,
      description: description || '', round: candle.round, netWorthAfter: netWorth,
    });
  }
}
function ensureRoundCandles(room) {
  ensureWealthHistory(room);
  room.players.forEach(p => ensureCurrentCandle(room, p.id));
}

function checkWinner(room) { const active = room.players.filter(p => !p.bankrupt); if (active.length === 1) room.winnerId = active[0].id; }

function bankrupt(room, player) {
  player.bankrupt = true;
  Object.keys(room.propOwner).forEach(k => { if (room.propOwner[k] === player.id) { delete room.propOwner[k]; if (room.houses) delete room.houses[k]; } });
  pushLog(room, `${player.name} \u0434\u0430\u043c\u043f\u0443\u0443\u0440\u043b\u0430\u0430!`);
  checkWinner(room);
}

function propertiesInGroup(idx) {
  const grp = BOARD_CONFIG[idx].colorGroup;
  if (!grp) return [];
  return BOARD_CONFIG.filter(t => t.type === 'property' && t.colorGroup === grp).map(t => t.id);
}
function ownsFullGroup(room, ownerId, idx) {
  const group = propertiesInGroup(idx);
  return group.length > 0 && group.every(i => room.propOwner[i] === ownerId);
}
function houseLevel(room, idx) { return (room.houses && room.houses[idx]) || 0; }
function buildLevelLabel(level) { return level >= 4 ? '\u041a\u043e\u0440\u043f\u043e\u0440\u0430\u0446' : level + ' \u0431\u0430\u0439\u0448\u0438\u043d'; }
function buildCost(sp, room) {
  const costs = getTierCosts(sp.tier);
  const currentLevel = room ? houseLevel(room, sp.id) : 0;
  const base = (currentLevel + 1 >= 4) ? costs.corporationCost : costs.houseCost;
  if (!room) return base;
  const mult = getActiveMultiplier(room, sp, 'buildingCost');
  return Math.round(base * mult / 10) * 10;
}

function calculateRentBreakdown(room, sp, idx, ownerId) {
  const level = houseLevel(room, idx);
  const baseRent = sp.rent;
  let buildingBonus = 0, sectorBonus = 0, sectorBonusPct = 0;
  if (level > 0) {
    const m = ECONOMY_CONFIG.rentMultipliers;
    const multipliers = [m.noBuilding, m.oneHouse, m.twoHouses, m.threeHouses, m.corporation];
    buildingBonus = Math.round(sp.rent * (multipliers[level] - 1));
  } else {
    const fullGroup = ownsFullGroup(room, ownerId, idx);
    if (fullGroup) { sectorBonus = Math.round(sp.rent * (ECONOMY_CONFIG.completeGroupBaseRentMultiplier - 1)); sectorBonusPct = Math.round((ECONOMY_CONFIG.completeGroupBaseRentMultiplier - 1) * 100); }
  }
  const preMarket = baseRent + buildingBonus + sectorBonus;
  const marketMultiplier = getActiveMultiplier(room, sp, 'income');
  const total = Math.round(preMarket * marketMultiplier);
  const marketBonus = total - preMarket;
  return { baseRent, buildingBonus, sectorBonus, sectorBonusPct, marketMultiplier, marketBonus, total, level };
}

function ensureStats(player) {
  if (!player.statistics) player.statistics = { rentPaid: 0, rentReceived: 0, highestRentPaid: 0, highestRentReceived: 0, rentTransactions: 0 };
  return player.statistics;
}

function resolvePropertyOrTax(room, player, idx) {
  const sp = BOARD_CONFIG[idx];
  if (sp.type === 'property') {
    const owner = room.propOwner[idx];
    if (!owner) {
      room.pendingAction = { type: 'buy', playerId: player.id, spaceIndex: idx };
    } else if (owner === player.id) {
      const level = houseLevel(room, idx);
      if (level < 4) room.pendingAction = { type: 'build', playerId: player.id, spaceIndex: idx };
    } else if (room.mortgaged && room.mortgaged[idx]) {
      pushLog(room, `${player.name} "${sp.name}" (\u0431\u0430\u0440\u044c\u0446\u0430\u0430\u043b\u0441\u0430\u043d) \u0434\u044d\u044d\u0440 \u0431\u0443\u0443\u0432, \u0442\u04af\u0440\u044d\u044d\u0441\u0433\u04af\u0439 \u0431\u0430\u0439\u043d\u0430.`);
    } else {
      const ownerPlayer = room.players.find(p => p.id === owner);
      const breakdown = calculateRentBreakdown(room, sp, idx, owner);
      const rent = breakdown.total;
      const payerBalanceBefore = player.money;
      const ownerBalanceBefore = ownerPlayer.money;
      player.money -= rent; ownerPlayer.money += rent;
      const payerStats = ensureStats(player), ownerStats = ensureStats(ownerPlayer);
      payerStats.rentPaid += rent; payerStats.highestRentPaid = Math.max(payerStats.highestRentPaid, rent); payerStats.rentTransactions++;
      ownerStats.rentReceived += rent; ownerStats.highestRentReceived = Math.max(ownerStats.highestRentReceived, rent);
      pushLog(room, `${player.name} "${sp.name}" \u0434\u044d\u044d\u0440 \u0431\u0443\u0443\u0436, ${ownerPlayer.name}-\u0434 \u20ae${rent} \u0442\u04af\u0440\u044d\u044d\u0441 \u0442\u04e9\u043b\u04e9\u0432.`);
      const rentEventId = 'rent-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      recordWealthChange(room, { playerId: player.id, type: 'pay_rent', amount: -rent, tileId: idx, companyId: idx, description: `"${sp.name}" \u0434\u044d\u044d\u0440 \u0442\u04af\u0440\u044d\u044d\u0441 \u20ae${rent} \u0442\u04e9\u043b\u04e9\u0432`, eventId: rentEventId + '-payer' });
      recordWealthChange(room, { playerId: ownerPlayer.id, type: 'receive_rent', amount: rent, tileId: idx, companyId: idx, description: `"${sp.name}"-\u0433\u0430\u0430\u0441 \u20ae${rent} \u0442\u04af\u0440\u044d\u044d\u0441 \u0430\u0432\u0430\u0432`, eventId: rentEventId + '-owner' });
      room.lastRentTransaction = {
        id: Date.now() + '-' + Math.random().toString(36).slice(2),
        payerId: player.id, ownerId: owner, tileIdx: idx, breakdown,
        payerBalanceBefore, payerBalanceAfter: player.money,
        ownerBalanceBefore, ownerBalanceAfter: ownerPlayer.money,
      };
      if (player.money < 0) bankrupt(room, player);
    }
  } else if (sp.type === 'tax') {
    player.money -= sp.amount;
    pushLog(room, `${player.name} \u0442\u0430\u0442\u0432\u0430\u0440 \u20ae${sp.amount} \u0442\u04e9\u043b\u04e9\u0432.`);
    recordWealthChange(room, { playerId: player.id, type: 'tax', amount: -sp.amount, tileId: idx, description: `\u0422\u0430\u0442\u0432\u0430\u0440 \u20ae${sp.amount} \u0442\u04e9\u043b\u04e9\u0432` });
    if (player.money < 0) bankrupt(room, player);
  }
}

function resolveSpace(room, player, idx) {
  const sp = BOARD_CONFIG[idx];
  if (sp.type === 'property' || sp.type === 'tax') {
    resolvePropertyOrTax(room, player, idx);
  } else if (sp.type === 'chance' || sp.type === 'chest') {
    const deckType = sp.type === 'chance' ? 'chance' : 'market';
    const card = drawCardFromDeck(room, deckType);
    if (!card) { pushLog(room, `${player.name}: (\u043a\u0430\u0440\u0442\u044b\u043d \u0441\u0430\u0432 \u0445\u043e\u043e\u0441\u043e\u043d)`); return; }
    room.cardDraw = { deckType, cardId: card.id, playerId: player.id, playerName: player.name, id: Date.now() + Math.random(), resolved: false };
  }
  // type 'go' / 'corner' (\u042d\u0425\u041b\u042d\u041b, \u0410\u041c\u0420\u0410\u041b\u0422, \u0417\u0410\u0425 \u0417\u042d\u042d\u041b, \u0414\u0423\u0423\u0414\u041b\u0410\u0413\u0410 \u0425\u0423\u0414\u0410\u041b\u0414\u0410\u0410): \u043e\u0434\u043e\u043e\u0433\u043e\u043e\u0440 \u043c\u044d\u0434\u044d\u044d\u043b\u043b\u044d\u043b \u0442\u0430\u0439\u043b\u0431\u0430\u0440, \u0442\u0443\u0441\u0433\u0430\u0439 \u043c\u0435\u0445\u0430\u043d\u0438\u043a (\u0430\u0443\u043a\u0446\u0438\u043e\u043d/\u0437\u0430\u0445 \u0437\u044d\u044d\u043b) \u0434\u0430\u0440\u0430\u0430\u0433\u0438\u0439\u043d \u0448\u0430\u0442\u0430\u043d\u0434 \u043d\u044d\u043c\u044d\u0433\u0434\u044d\u043d\u044d
}

function findCardById(deckType, cardId) {
  const pool = deckType === 'chance' ? CHANCE_CARDS : MARKET_CARDS;
  return pool.find(c => c.id === cardId) || null;
}

function applyCardEffect(room, card, player, chosenTileIdx) {
  switch (card.effectType) {
    case 'cash': {
      player.money += card.value;
      pushLog(room, `${player.name}: "${card.title}" \u2014 ${card.value >= 0 ? '+' : ''}\u20ae${card.value}.`);
      recordWealthChange(room, { playerId: player.id, type: 'chance_card', amount: card.value, description: `"${card.title}"` });
      if (card.value >= 0) audioManager.playSfx('coinReward');
      if (player.money < 0) bankrupt(room, player);
      break;
    }
    case 'skipTurn': {
      player.jailTurns = (player.jailTurns || 0) + (card.skipTurns || 1);
      pushLog(room, `${player.name}: "${card.title}" \u2014 ${card.skipTurns || 1} \u044d\u044d\u043b\u0436 \u04e9\u043d\u0436\u0438\u043d\u04e9.`);
      break;
    }
    case 'freeHouse': {
      if (chosenTileIdx !== undefined && chosenTileIdx !== null) {
        if (!room.houses) room.houses = {};
        const lvl = houseLevel(room, chosenTileIdx) + (card.upgradeAmount || 1);
        room.houses[chosenTileIdx] = Math.min(lvl, 4);
        pushLog(room, `${player.name}: "${card.title}" \u2014 "${BOARD_CONFIG[chosenTileIdx].name}"-\u0434 \u04af\u043d\u044d\u0433\u04af\u0439 \u0431\u0430\u0439\u0448\u0438\u043d \u0431\u0430\u0440\u0438\u0432.`);
        recordWealthChange(room, { playerId: player.id, type: 'chance_card', amount: 0, tileId: chosenTileIdx, companyId: chosenTileIdx, description: `"${card.title}" \u2014 \u04af\u043d\u044d\u0433\u04af\u0439 \u0431\u0430\u0439\u0448\u0438\u043d` });
      } else {
        pushLog(room, `${player.name}: "${card.title}" \u2014 \u0431\u0430\u0440\u0438\u0445 \u043a\u043e\u043c\u043f\u0430\u043d\u0438 \u043e\u043b\u0434\u0441\u043e\u043d\u0433\u04af\u0439.`);
      }
      break;
    }
    case 'freeUpgrade': {
      if (chosenTileIdx !== undefined && chosenTileIdx !== null) {
        if (!room.houses) room.houses = {};
        const lvl = houseLevel(room, chosenTileIdx) + (card.upgradeAmount || 1);
        room.houses[chosenTileIdx] = Math.min(lvl, 4);
        pushLog(room, `${player.name}: "${card.title}" \u2014 "${BOARD_CONFIG[chosenTileIdx].name}" \u04af\u043d\u044d\u0433\u04af\u0439 \u0441\u0430\u0439\u0436\u0440\u0430\u0432.`);
        recordWealthChange(room, { playerId: player.id, type: 'chance_card', amount: 0, tileId: chosenTileIdx, companyId: chosenTileIdx, description: `"${card.title}" \u2014 \u04af\u043d\u044d\u0433\u04af\u0439 \u0441\u0430\u0439\u0436\u0440\u0430\u043b\u0442` });
      } else {
        pushLog(room, `${player.name}: "${card.title}" \u2014 \u0441\u0430\u0439\u0436\u0440\u0443\u0443\u043b\u0430\u0445 \u043a\u043e\u043c\u043f\u0430\u043d\u0438 \u043e\u043b\u0434\u0441\u043e\u043d\u0433\u04af\u0439.`);
      }
      break;
    }
    case 'industryIncomeMultiplier':
    case 'globalIncomeMultiplier':
    case 'buildingCostMultiplier': {
      if (!room.activeMarketEffects) room.activeMarketEffects = [];
      room.activeMarketEffects.push({
        id: card.id + '-' + Date.now(), sourceCardId: card.id, effectType: card.effectType,
        industry: card.industry || null, multiplier: card.multiplier, remainingRounds: card.duration || 1,
      });
      pushLog(room, `\u0417\u0430\u0445 \u0437\u044d\u044d\u043b: "${card.title}" \u0438\u0434\u044d\u0432\u0445\u0436\u043b\u044d\u044d (${card.duration || 1} \u04af\u0435 \u0448\u0430\u0442).`);
      break;
    }
    default:
      break;
  }
}

function tickMarketEffects(room) {
  if (!room.activeMarketEffects || room.activeMarketEffects.length === 0) return;
  const stillActive = [];
  for (const eff of room.activeMarketEffects) {
    eff.remainingRounds -= 1;
    if (eff.remainingRounds > 0) {
      stillActive.push(eff);
    } else {
      const src = findCardById('market', eff.sourceCardId);
      pushLog(room, `\u0417\u0430\u0445 \u0437\u044d\u044d\u043b\u0438\u0439\u043d \u043d\u04e9\u043b\u04e9\u04e9${src ? ` "${src.title}"` : ''} \u0434\u0443\u0443\u0441\u043b\u0430\u0430.`);
    }
  }
  room.activeMarketEffects = stillActive;
}


async function rollDice() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !isMyTurn(room) || room.hasRolled || room.pendingAction || (room.cardDraw && !room.cardDraw.resolved) || wealthModalOpen) return;
  audioManager.playSfx('diceRoll'); vibrate(25);
  const player = room.players[room.currentPlayerIndex];

  if (player.jailTurns > 0) {
    player.jailTurns--;
    room.hasRolled = true;
    pushLog(room, `${player.name} \u0448\u043e\u0440\u043e\u043d\u0434 \u0431\u0430\u0439\u0433\u0430\u0430 \u0442\u0443\u043b \u0430\u043b\u0433\u0430\u0441\u0430\u0432 (${player.jailTurns} \u044d\u044d\u043b\u0436 \u04af\u043b\u0434\u044d\u044d).`);
    await saveRoom(room); currentRoom = room; justRolled = true; render();
    return;
  }

  const d1 = 1 + Math.floor(Math.random() * 6);
  const d2 = 1 + Math.floor(Math.random() * 6);
  const sum = d1 + d2;
  room.lastDice = [d1, d2];
  room.diceRollId = Date.now() + Math.random();
  const oldPos = player.position;
  const newPos = (oldPos + sum) % BOARD_CONFIG.length;
  const wrapped = newPos < oldPos;
  const landedOnStart = wrapped && newPos === 0;
  const passedThroughOnly = wrapped && newPos !== 0;
  room.animPath = { playerId: player.id, from: oldPos, steps: sum, id: Date.now() + Math.random() };
  if (landedOnStart) {
    player.money += ECONOMY_CONFIG.landOnStartReward;
    pushLog(room, `${player.name} \u042d\u0425\u041b\u042d\u041b \u0434\u044d\u044d\u0440 \u0431\u0443\u0443\u0436 \u20ae${ECONOMY_CONFIG.landOnStartReward} \u0430\u0432\u043b\u0430\u0430.`);
    recordWealthChange(room, { playerId: player.id, type: 'pass_go', amount: ECONOMY_CONFIG.landOnStartReward, description: '\u042d\u0425\u041b\u042d\u041b \u0434\u044d\u044d\u0440 \u0431\u0443\u0443\u0436 \u0448\u0430\u0433\u043d\u0430\u043b' });
  } else if (passedThroughOnly) {
    player.money += ECONOMY_CONFIG.passStartReward;
    pushLog(room, `${player.name} \u042d\u0425\u041b\u042d\u041b \u0434\u044d\u044d\u0433\u04af\u04af\u0440 \u04e9\u043d\u0433\u04e9\u0440\u0447 \u20ae${ECONOMY_CONFIG.passStartReward} \u0430\u0432\u043b\u0430\u0430.`);
    recordWealthChange(room, { playerId: player.id, type: 'pass_go', amount: ECONOMY_CONFIG.passStartReward, description: '\u042d\u0425\u041b\u042d\u041b \u0434\u044d\u044d\u0433\u04af\u04af\u0440 \u04e9\u043d\u0433\u04e9\u0440\u0447 \u0431\u043e\u043d\u0443\u0441' });
  }
  player.position = newPos;
  room.hasRolled = true;
  pushLog(room, `${player.name} \ud83c\udfb2${d1}+${d2}=${sum}, ${BOARD_CONFIG[newPos].name} \u0434\u044d\u044d\u0440 \u043e\u0447\u0438\u0432.`);
  resolveSpace(room, player, newPos);
  checkWinner(room);
  await saveRoom(room); currentRoom = room; justRolled = true; render();
}

async function buyProperty() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !room.pendingAction || room.pendingAction.type !== 'buy' || room.pendingAction.playerId !== myId) return;

}

async function endTurn() {
  const room = await getRoom(currentRoom.roomCode);
  if (!room || !isMyTurn(room) || room.pendingAction || (room.cardDraw && !room.cardDraw.resolved)) return;
  const active = room.players.filter(p => !p.bankrupt);
  if (active.length <= 1) return;
  let next = room.currentPlayerIndex;
  do { next = (next + 1) % room.players.length; } while (room.players[next].bankrupt);
  room.currentPlayerIndex = next; room.hasRolled = false; room.lastDice = null;
  room.turnCount = (room.turnCount || 0) + 1;
  if (room.turnCount % room.players.length === 0) { tickMarketEffects(room); ensureRoundCandles(room); }
  pushLog(room, `\u2014 ${room.players[next].name}-\u0438\u0439\u043d \u044d\u044d\u043b\u0436 \u2014`);
  checkMatchTimeLimit(room);
  await saveRoom(room); currentRoom = room; render();
}
function checkMatchTimeLimit(room) {
  if (room.winnerId) return;
  const roundN = Math.floor((room.turnCount || 0) / room.players.length) + 1;
  const elapsedMin = room.gameStartedAt ? (Date.now() - room.gameStartedAt) / 60000 : 0;
  const timeUp = elapsedMin >= ECONOMY_CONFIG.matchLimits.rankedMinutes;
  const roundsUp = roundN > ECONOMY_CONFIG.matchLimits.maxRounds;
  if (!timeUp && !roundsUp) return;
  const active = room.players.filter(p => !p.bankrupt);
  if (active.length === 0) return;
  const ranked = active.map(p => ({ p, worth: netWorth(room, p) })).sort((a, b) => {
    if (b.worth !== a.worth) return b.worth - a.worth;
    if (b.p.money !== a.p.money) return b.p.money - a.p.money;
    const corpCountA = Object.keys(room.propOwner).filter(idx => room.propOwner[idx] === a.p.id && houseLevel(room, idx) >= 4).length;
    const corpCountB = Object.keys(room.propOwner).filter(idx => room.propOwner[idx] === b.p.id && houseLevel(room, idx) >= 4).length;
    return corpCountB - corpCountA;
  });
  room.winnerId = ranked[0].p.id;
  pushLog(room, `${timeUp ? '\u0425\u0443\u0433\u0430\u0446\u0430\u0430' : '\u04ae\u0435\u0438\u0439\u043d \u0445\u044f\u0437\u0433\u0430\u0430\u0440'} \u0434\u0443\u0443\u0441\u043b\u0430\u0430. \u041d\u0438\u0439\u0442 \u0445\u04e9\u0440\u04e9\u043d\u0433\u04e9\u04e9\u0440 ${ranked[0].p.name} \u044f\u043b\u043b\u0430\u0430!`);
}

let roomChannel = null;
function startPolling() {
  if (roomChannel) supabaseClient.removeChannel(roomChannel);
  roomChannel = supabaseClient.channel('room-' + currentRoom.roomCode)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `room_code=eq.${currentRoom.roomCode}` },

        currentRoom = payload.new.state;

}

function isCinematicCamera() { return cameraState.mode === 'purchase' || cameraState.mode === 'corporation'; }

function syncBoardFrameSize() {
  const viewport = document.getElementById('boardViewport');
  const frame = document.getElementById('boardFrame');
  if (!viewport || !frame) return;
  const rect = viewport.getBoundingClientRect();
  const vw = rect.width, vh = rect.height;
  if (!vw || !vh) return;
  const ratio = 1672 / 941;
  let fw = vw, fh = vw / ratio;
  if (fh > vh) { fh = vh; fw = vh * ratio; }
  frame.style.width = Math.round(fw) + 'px';
  frame.style.height = Math.round(fh) + 'px';
}

let lastKnownFrameRect = null;
function computeCameraTransform(targetXvb, targetYvb, scale) {
  const viewport = document.getElementById('boardFrame') || document.getElementById('boardViewport');
  if (!viewport) return lastKnownFrameRect ? computeFromRect(lastKnownFrameRect, targetXvb, targetYvb, scale) : { tx: 0, ty: 0, scale: 1 };
  const rect = viewport.getBoundingClientRect();
  let w = rect.width, h = rect.height;
  if (!w || !h) {
    if (!lastKnownFrameRect) return { tx: 0, ty: 0, scale: 1 };
    w = lastKnownFrameRect.width; h = lastKnownFrameRect.height;
  } else {
    lastKnownFrameRect = { width: w, height: h };
  }
  return computeFromRect({ width: w, height: h }, targetXvb, targetYvb, scale);
}
function computeFromRect(rect, targetXvb, targetYvb, scale) {
  const w = rect.width, h = rect.height;
  const fx = targetXvb / 1672, fy = targetYvb / 941;
  const px = fx * w, py = fy * h;
  let tx = w / 2 - scale * px;
  let ty = h / 2 - scale * py;
  const minX = Math.min(0, w - scale * w);
  const minY = Math.min(0, h - scale * h);
  tx = Math.min(0, Math.max(minX, tx));
  ty = Math.min(0, Math.max(minY, ty));
  return { tx, ty, scale };
}

function canOverrideCamera(newMode) {
  return CAMERA_PRIORITY[newMode] >= CAMERA_PRIORITY[cameraState.mode];
}

function applyCameraDirect(targetXvb, targetYvb, scale, mode, tileId) {
  const t = computeCameraTransform(targetXvb, targetYvb, scale);
  cameraState = { mode, x: t.tx, y: t.ty, scale: t.scale, targetTileId: tileId, isMoving: true };
  const cam = document.getElementById('boardCamera');
  if (cam) cam.style.transform = `translate(${t.tx}px, ${t.ty}px) scale(${t.scale})`;
  const viewport = document.getElementById('boardViewport');
  if (viewport) { viewport.classList.toggle('debug', debugMode); if (debugMode) render(); }
}

/* ===== MOBILE PAN / PINCH-ZOOM GESTURES ===== */
function clampMobilePan(tx, ty, scale) {
  const viewport = document.getElementById('boardFrame') || document.getElementById('boardViewport');
  if (!viewport) return { tx, ty };
  const rect = viewport.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const minX = Math.min(0, w - scale * w);
  const minY = Math.min(0, h - scale * h);
  return { tx: Math.min(0, Math.max(minX, tx)), ty: Math.min(0, Math.max(minY, ty)) };
}
function setCameraRaw(tx, ty, scale, tileId) {
  const c = clampMobilePan(tx, ty, scale);

const BUILDING_FILE_MAP = { mining: 'mine' };
let seenBuildings = new Set();

const PLAYER_GLOW_COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7'];
let seenUpgrades = new Set();

function renderBuildingConstructionOverlay(tile, idx, owner, anim, room) {
  const ownerIdx = 0; // color resolved below via owner.color directly
  const flagColor = owner.color;
  const stage = anim.stage;
  const seed = anim.particleSeed || [];
  const dustHtml = (stage === 'dust' || stage === 'hammer') ? seed.slice(0, 7).map((p, i) =>
    `<span class="dust-mote" style="--dx:${p.dx * 0.4}px; --delay:${p.delay}ms;"></span>`).join('') : '';
  const goldParticlesHtml = (stage === 'celebration') ? seed.map((p, i) =>
    `<span class="gold-mote" style="--dx:${p.dx}px; --dy:${p.dy}px; --rot:${p.rot}deg; --delay:${p.delay * 0.5}ms;"></span>`).join('') : '';

  if (anim.type === 'corp') {
    const w = 60;
    const bx = tile.corporationX - w / 2;
    const by = tile.corporationY - w;
    const leftPct = (bx / 1672 * 100).toFixed(2);
    const topPct = (by / 941 * 100).toFixed(2);
    const widthPct = (w / 1672 * 100).toFixed(2);
    const heightPct = (w / 941 * 100).toFixed(2);
    const dissolving = (stage === 'preparing' || stage === 'dust');
    const oldHouses = dissolving ? (tile.houseSlots || []).map(([hx, hy], s) => {
      const hw = 16 * (tile.buildingScale || 1);
      const hl = ((hx - hw/2) / 1672 * 100).toFixed(2), ht = ((hy - hw) / 941 * 100).toFixed(2);
      const hwp = (hw/1672*100).toFixed(2), hhp = (hw/941*100).toFixed(2);
      return `<div class="upgrade-icon upgrade-house house-dissolve" style="left:${hl}%; top:${ht}%; width:${hwp}%; height:${hhp}%;"><img src="player-house.png" onerror="this.style.display='none'"></div>`;
    }).join('') : '';
    const showRing = stage !== 'preparing';
    const showCrane = stage === 'hammer' || stage === 'rising';
    const showHq = stage === 'rising' || stage === 'celebration';
    const showSpotlight = stage === 'rising' || stage === 'celebration';
    return `${oldHouses}
      <div class="construction-fx" style="left:${leftPct}%; top:${topPct}%; width:${widthPct}%; height:${heightPct}%;">
        ${showRing ? `<span class="corp-ring"></span>` : ''}
        ${showSpotlight ? `<span class="corp-spotlight"></span>` : ''}
        ${showCrane ? `<span class="crane-arm"><span class="crane-hook"></span></span>` : ''}
        ${showHq ? `<img class="corp-rising-img ${stage === 'rising' ? 'stage-rising' : 'stage-settled'}" src="corporation-hq.png" alt="" onerror="this.style.display='none'">` : ''}
        ${dustHtml}
        ${stage === 'celebration' ? `<span class="player-flag" style="--flag-color:${flagColor};"></span>` : ''}
        ${goldParticlesHtml}
        ${stage === 'celebration' ? `<span class="confetti-burst">${seed.map((p,i)=>`<i style="--dx:${p.dx*1.4}px; --dy:${p.dy*1.6}px; --rot:${p.rot}deg; --hue:${(i*47)%360}deg; --delay:${p.delay*0.3}ms;"></i>`).join('')}</span>` : ''}
      </div>`;
  }

  // house
  const level = houseLevel(room, idx);
  const prevCount = Math.max(0, Math.min(level - 1, 3));
  const newSlotIndex = Math.max(0, Math.min(level - 1, 2));
  const staticHouses = (tile.houseSlots || []).slice(0, prevCount).map(([hx, hy]) => {
    const hw = 16 * (tile.buildingScale || 1);
    const hl = ((hx - hw/2) / 1672 * 100).toFixed(2), ht = ((hy - hw) / 941 * 100).toFixed(2);
    const hwp = (hw/1672*100).toFixed(2), hhp = (hw/941*100).toFixed(2);
    return `<div class="upgrade-icon upgrade-house" style="left:${hl}%; top:${ht}%; width:${hwp}%; height:${hhp}%;"><span class="upgrade-glow-ring"></span><img src="player-house.png" onerror="this.style.display='none'"></div>`;
  }).join('');
  const slot = (tile.houseSlots || [])[newSlotIndex] || [tile.tokenX, tile.tokenY];
  const [nx, ny] = slot;
  const nw = 16 * (tile.buildingScale || 1);
  const nl = ((nx - nw/2) / 1672 * 100).toFixed(2), nt = ((ny - nw) / 941 * 100).toFixed(2);
  const nwp = (nw/1672*100).toFixed(2), nhp = (nw/941*100).toFixed(2);
  const showHouse = stage === 'rising' || stage === 'hammer' || stage === 'celebration';
  const riseClass = stage === 'rising' ? 'stage-rising' : (stage === 'celebration' ? 'stage-settled' : '');
  return `${staticHouses}
    <div class="construction-fx" style="left:${nl}%; top:${nt}%; width:${nwp}%; height:${nhp}%;">
      ${stage === 'preparing' ? `<span class="tile-prep-glow"></span>` : ''}
      ${dustHtml}
      ${stage === 'dust' || stage === 'hammer' ? `<span class="hammer-icon"></span>` : ''}
      ${showHouse ? `<img class="house-rising-img ${riseClass}" src="player-house.png" alt="" onerror="this.style.display='none'">` : ''}
      ${stage === 'celebration' ? `<span class="player-flag" style="--flag-color:${flagColor};"></span>` : ''}
      ${goldParticlesHtml}
    </div>`;
}

function renderUpgradeIcons(tile, level, idx, ownerIdx) {
  if (!level || level < 1) return '';
  const glow = PLAYER_GLOW_COLORS[((ownerIdx % 4) + 4) % 4];
  const scale = tile.buildingScale || 1;
  const zoneClip = () => '';

  if (level >= 4) {
    const key = 'corp-' + idx;
    const isNew = !seenUpgrades.has(key);
    seenUpgrades.add(key);
    const w = 56 * scale;
    const bx = tile.corporationX - w / 2;
    const by = tile.corporationY - w;
    const leftPct = (bx / 1672 * 100).toFixed(2);
    const topPct = (by / 941 * 100).toFixed(2);
    const widthPct = (w / 1672 * 100).toFixed(2);
    const heightPct = (w / 941 * 100).toFixed(2);
    return `<div class="upgrade-icon upgrade-corp ${isNew ? 'upgrade-appear' : ''}" data-idx="${idx}" data-tile-id="${idx}"
      style="left:${leftPct}%; top:${topPct}%; width:${widthPct}%; height:${heightPct}%; --glow:${glow}; --depth:${tile.depth + 0.5};">
      <span class="corp-burst"></span>
      <span class="upgrade-glow-ring"></span>
      <span class="corp-particles"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <img src="corporation-hq.png" alt="Corporation HQ" onerror="this.style.display='none'" style="${zoneClip(bx,by,w,w)}">
    </div>`;
  }

  const count = Math.min(level, 3);
  let html = '';
  for (let s = 0; s < count; s++) {
    const [hx, hy] = tile.houseSlots[s];
    const key = 'house-' + idx + '-' + s;
    const isNew = !seenUpgrades.has(key);
    seenUpgrades.add(key);
    const w = 16 * scale;
    const bx = hx - w / 2;
    const by = hy - w;
    const leftPct = (bx / 1672 * 100).toFixed(2);
    const topPct = (by / 941 * 100).toFixed(2);
    const widthPct = (w / 1672 * 100).toFixed(2);
    const heightPct = (w / 941 * 100).toFixed(2);
    html += `<div class="upgrade-icon upgrade-house ${isNew ? 'upgrade-appear' : ''}" data-idx="${idx}" data-tile-id="${idx}"
      style="left:${leftPct}%; top:${topPct}%; width:${widthPct}%; height:${heightPct}%; --glow:${glow}; --depth:${tile.depth + 0.5};">
      <span class="upgrade-glow-ring"></span>
      <img src="player-house.png" alt="House" onerror="this.style.display='none'" style="${zoneClip(bx,by,w,w)}">
    </div>`;
  }
  return html;
}

function computeClipPathPct(zonePoints, boxX, boxY, boxW, boxH) {
  return zonePoints.map(([zx, zy]) => {
    const px = ((zx - boxX) / boxW * 100).toFixed(1);
    const py = ((zy - boxY) / boxH * 100).toFixed(1);
    return `${px}% ${py}%`;
  }).join(', ');
}

function renderBuildingIcon(tile, level, idx) {
  const fileName = BUILDING_FILE_MAP[tile.buildingType] || tile.buildingType;
  const w = tile.buildingWidth * 1.5;
  const x = tile.buildingX - w / 2;
  const y = tile.buildingY - w / 2;
  const leftPct = (x / 1672 * 100).toFixed(2);
  const topPct = (y / 941 * 100).toFixed(2);
  const widthPct = (w / 1672 * 100).toFixed(2);
  const heightPct = (w / 941 * 100).toFixed(2);
  const isNew = !seenBuildings.has(idx);
  seenBuildings.add(idx);
  const flagHtml = level >= 4 ? `<span class="building-flag-icon">\ud83c\udfc1</span>` : '';
  const clipPath = '';
  const debugHtml = debugMode ? `<span class="badge-debug-id">${idx}</span>` : '';
  return `<div data-idx="${idx}" data-tile-id="${idx}"
    class="tile-building-badge level-${Math.min(Math.max(level,0),4)} ${isNew ? 'building-appear' : ''}"
    style="left:${leftPct}%; top:${topPct}%; width:${widthPct}%; height:${heightPct}%; --depth:${tile.depth}; ${clipPath}">
    <span class="badge-ring"></span>
    <img src="${fileName}.png" alt="${tile.name}" loading="lazy" onerror="this.style.display='none'">
    ${flagHtml}
    ${debugHtml}
  </div>`;
}

function renderBuildings(level) {
  if (level >= 4) return `<div class="buildings-row"><span class="build-icon corp" title="\u041a\u043e\u0440\u043f\u043e\u0440\u0430\u0446"></span></div>`;
  let html = '<div class="buildings-row">';
  for (let i = 0; i < level; i++) html += `<span class="build-icon house" title="\u0411\u0430\u0439\u0448\u0438\u043d"></span>`;
  html += '</div>';
  return html;
}

/* ---------- RENDER ---------- */
function render() {
  const app = document.getElementById('app');
  document.body.classList.toggle('view-game', view === 'game');
  if (currentRoom) { /* card popup now handled by maybeShowCardModal in the render() dispatcher */ }
  if (authState.isLoading) { app.innerHTML = renderAuthLoading(); return; }
  if (view === 'auth') { maybeStartLobbyMusic(); app.innerHTML = renderAuthGate(); attachAuthGateEvents(); return; }
  if (view === 'auth-signup') { maybeStartLobbyMusic(); app.innerHTML = renderAuthSignup(); attachAuthSignupEvents(); return; }
  if (view === 'auth-signin') { maybeStartLobbyMusic(); app.innerHTML = renderAuthSignin(); attachAuthSigninEvents(); return; }
  if (view === 'auth-reset') { maybeStartLobbyMusic(); app.innerHTML = renderAuthReset(); attachAuthResetEvents(); return; }
  if (view === 'profile') { maybeStartLobbyMusic(); app.innerHTML = renderProfile(); attachProfileEvents(); return; }
  if (view === 'landing') { maybeStartLobbyMusic(); app.innerHTML = renderLanding(); attachLandingEvents(); return; }
  if (view === 'waiting') { maybeStartLobbyMusic(); app.innerHTML = renderWaiting(); attachWaitingEvents(); return; }
  if (view === 'game') {
    lobbyMusicStarted = false;
    if (currentRoom) {
      maybeTriggerGameResults(currentRoom);
      if (!gameResults.isOpen) {
        maybeTriggerMoveAnimation(currentRoom); maybeTriggerDiceAnimation(currentRoom); maybeTriggerBuildAnimation(currentRoom);
        maybeTriggerRentCinematic(currentRoom);
        updateEnvironment(Math.floor((currentRoom.turnCount || 0) / currentRoom.players.length) + 1);
        checkTensionMusic(currentRoom);
      }
      if (isMobileView && !mobileCamInitialized && cameraState.mode === 'overview') {
        mobileCamInitialized = true;
        requestAnimationFrame(() => requestAnimationFrame(() => { if (isMobileView) returnCameraToOverview(); }));
      }
    }
    app.innerHTML = renderGame();
    if (isMobileView) syncBoardFrameSize();
    if (currentRoom && currentRoom.winnerId && gameResults.isOpen) {
      attachResultsEvents();
    } else {
      attachGameEvents();
      maybeFlashMoney(currentRoom);
      if (currentRoom) { maybeShowBuyModal(currentRoom); maybeShowCardModal(currentRoom); maybeShowCardResultToast(currentRoom); }
      if (rentCinematicActive) animateRentCounters();
    }
    return;
  }
}

function attachAuthSignupEvents() {
  document.getElementById('suPassToggle').onclick = () => {
    const el = document.getElementById('suPass');
    el.type = el.type === 'password' ? 'text' : 'password';
  };
  document.getElementById('suBackBtn').onclick = () => { authFormState = { loading: false, error: '', info: '' }; view = 'auth'; render(); };
  document.getElementById('suSubmit').onclick = async () => {
    if (authFormState.loading) return;
    const name = document.getElementById('suName').value.trim();
    const email = document.getElementById('suEmail').value.trim();
    const pass = document.getElementById('suPass').value;
    const pass2 = document.getElementById('suPass2').value;
    const terms = document.getElementById('suTerms').checked;
    if (!name) { authFormState.error = '\u041d\u044d\u0440\u044d\u044d \u043e\u0440\u0443\u0443\u043b\u043d\u0430 \u0443\u0443.'; render(); return; }
    if (!email) { authFormState.error = '\u0418-\u043c\u044d\u0439\u043b\u044d\u044d \u043e\u0440\u0443\u0443\u043b\u043d\u0430 \u0443\u0443.'; render(); return; }
    if (pass.length < 8) { authFormState.error = '\u041d\u0443\u0443\u0446 \u04af\u0433 \u0445\u0430\u043c\u0433\u0438\u0439\u043d \u0431\u0430\u0433\u0430 8 \u0442\u044d\u043c\u0434\u044d\u0433\u0442 \u0431\u0430\u0439\u043d\u0430.'; render(); return; }
    if (pass !== pass2) { authFormState.error = '\u041d\u0443\u0443\u0446 \u04af\u0433 \u0442\u043e\u0445\u0438\u0440\u043e\u0445\u0433\u04af\u0439 \u0431\u0430\u0439\u043d\u0430.'; render(); return; }
    if (!terms) { authFormState.error = '\u041d\u04e9\u0445\u0446\u04e9\u043b\u0438\u0439\u0433 \u0437\u04e9\u0432\u0448\u04e9\u04e9\u0440\u04e9\u0445 \u0448\u0430\u0430\u0440\u0434\u043b\u0430\u0433\u0430\u0442\u0430\u0439.'; render(); return; }
    authFormState = { loading: true, error: '', info: '' }; render();
    const { error } = await authSignUp(email, pass, name);
    authFormState.loading = false;
    if (error) { authFormState.error = error.message; render(); return; }

    render();

}

function attachAuthSigninEvents() {
  document.getElementById('siPassToggle').onclick = () => {
    const el = document.getElementById('siPass');
    el.type = el.type === 'password' ? 'text' : 'password';
  };
  document.getElementById('siBackBtn').onclick = () => { authFormState = { loading: false, error: '', info: '' }; view = 'auth'; render(); };
  document.getElementById('siForgotLink').onclick = (e) => { e.preventDefault(); authFormState = { loading: false, error: '', info: '' }; view = 'auth-reset'; render(); };

    const email = document.getElementById('siEmail').value.trim();

    authFormState = { loading: true, error: '', info: '' }; render();
    const { error } = await authSignIn(email, pass);
    authFormState.loading = false;
    if (error) { authFormState.error = error.message; render(); return; }
  };
}

/* ===== TITLE / RANK ===== */
function getPlayerTitle(level) {
  if (level >= 71) return '\u042d\u0437\u044d\u043d\u0442 \u0433\u04af\u0440\u043d\u0438\u0439 \u044d\u0437\u044d\u043d';
  if (level >= 51) return '\u0422\u044d\u0440\u0431\u0443\u043c\u0442\u0430\u043d';
  if (level >= 41) return '\u0421\u0430\u044f\u0442\u0430\u043d';
  if (level >= 31) return '\u041c\u0430\u0433\u043d\u0430\u0442';
  if (level >= 21) return '\u0425\u04e9\u0440\u04e9\u043d\u0433\u04e9 \u043e\u0440\u0443\u0443\u043b\u0430\u0433\u0447';
  if (level >= 11) return '\u0417\u0430\u0445\u0438\u0440\u0430\u043b';
  if (level >= 6) return '\u0411\u0438\u0437\u043d\u0435\u0441 \u044d\u0440\u0445\u044d\u043b\u044d\u0433\u0447';
  return '\u0428\u0438\u043d\u044d \u043d\u0430\u0439\u043c\u0430\u0430\u0447\u0438\u043d';
}
function getRankTier(mmr) {
  if (mmr >= 2000) return { key: 'grandmaster', label: 'Grandmaster', color: '#ef4444' };
  if (mmr >= 1700) return { key: 'master', label: 'Master', color: '#a855f7' };
  if (mmr >= 1500) return { key: 'diamond', label: 'Diamond', color: '#7dd3fc' };
  if (mmr >= 1300) return { key: 'platinum', label: 'Platinum', color: '#5eead4' };
  if (mmr >= 1100) return { key: 'gold', label: 'Gold', color: '#f5c94f' };
  if (mmr >= 900) return { key: 'silver', label: 'Silver', color: '#c7ccd6' };
  return { key: 'bronze', label: 'Bronze', color: '#c98a4b' };
}
function xpForLevel(level) { return (level - 1) * 200; }

function renderProfile() {
  if (authState.isGuest || !authState.user) {
    return `<div class="screen">
      <div class="eyebrow">\u041f\u0440\u043e\u0444\u0430\u0439\u043b</div>
      <div class="seal-title">\u0417\u043e\u0447\u043d\u044b \u0442\u043e\u0433\u043b\u043e\u0433\u0447</div>
      <div class="landing-card" style="text-align:center;">
        <div style="color:#9AA6BE; margin-bottom:14px;">Тоглолтоо хадгалахын тулд бүртгүүлнэ үү.</div>
        <button class="btn btn-primary" id="profileSignupBtn">\u0428\u0438\u043d\u044d\u044d\u0440 \u0431\u04af\u0440\u0442\u0433\u04af\u04af\u043b\u044d\u0445</button>

  }
  const p = authState.profile || {};
  const s = authState._stats || {};
  const level = s.level || 1;

  const mmr = s.mmr || 1000;
  const title = getPlayerTitle(level);
  const rank = getRankTier(mmr);
  const xpBase = xpForLevel(level), xpNext = xpForLevel(level + 1);
  const xpPct = Math.min(100, Math.round(((xp - xpBase) / (xpNext - xpBase)) * 100));
  const winRate = s.games_played > 0 ? Math.round((s.games_won || 0) / s.games_played * 100) : 0;
  return `<div class="screen">
    <div class="eyebrow">\u041f\u0440\u043e\u0444\u0430\u0439\u043b</div>
    <div class="landing-card" style="text-align:center;">

      <div class="profile-title-badge">${title}</div>
      <div class="profile-level-row">
        <span class="profile-level-num">LV.${level}</span>
        <div class="profile-xp-bar"><div class="profile-xp-fill" style="width:${xpPct}%"></div></div>
        <span class="profile-xp-label">${xp - xpBase}/${xpNext - xpBase} XP</span>
      </div>
      <div class="profile-rank-badge" style="--rank-color:${rank.color}">
        <span class="prb-tier">${rank.label}</span><span class="prb-mmr">${mmr} MMR</span>
      </div>
      <div class="detail-row"><span>\u041d\u0438\u0439\u0442 \u0442\u043e\u0433\u043b\u043e\u043b\u0442</span><span>${s.games_played || 0}</span></div>
      <div class="detail-row"><span>\u042f\u043b\u0430\u043b\u0442 (${winRate}%)</span><span>${s.games_won || 0}</span></div>
      <div class="detail-row"><span>\u0425\u0430\u043c\u0433\u0438\u0439\u043d \u04e9\u043d\u0434\u04e9\u0440 \u0445\u04e9\u0440\u04e9\u043d\u0433\u04e9</span><span>\u20ae${fmt(s.highest_wealth || 0)}</span></div>
      <div class="detail-row"><span>\u0425\u0443\u0434\u0430\u043b\u0434\u0430\u0436 \u0430\u0432\u0441\u0430\u043d \u043a\u043e\u043c\u043f\u0430\u043d\u0438</span><span>${s.companies_purchased || 0}</span></div>
      <div class="detail-row"><span>\u0411\u0430\u0439\u0433\u0443\u0443\u043b\u0441\u0430\u043d \u043a\u043e\u0440\u043f\u043e\u0440\u0430\u0446\u0438</span><span>${s.corporations_built || 0}</span></div>
      <button class="btn btn-secondary" id="profileBackBtn" style="margin-top:14px;">\u2190 \u0411\u0443\u0446\u0430\u0445</button>
      <button class="btn btn-secondary" id="logoutBtn" style="margin-top:8px; color:var(--sb-danger, #e85d5d);">\u0413\u0430\u0440\u0430\u0445</button>
    </div>
  </div>`;
}
function attachProfileEvents() {
  const backBtn = document.getElementById('profileBackBtn'); if (backBtn) backBtn.onclick = () => { view = 'landing'; render(); };
  const signupBtn = document.getElementById('profileSignupBtn'); if (signupBtn) signupBtn.onclick = () => { view = 'auth-signup'; render(); };

function renderMatchmakingModal() {
  if (!mmState.isOpen) return '';
  const modeLabels = { casual_1v1: '\u042d\u041d\u0413\u0418\u0419\u041d 1v1', ranked_1v1: 'RANKED 1v1', casual_4p: '\u042d\u041d\u0413\u0418\u0419\u041d 4 \u0422\u041e\u0413\u041b\u041e\u0413\u0427', ranked_4p: 'RANKED 4 \u0422\u041e\u0413\u041b\u041e\u0413\u0427' };
  let body = '';
  if (mmState.stage === 'idle' || mmState.stage === 'error') {
    body = `<div class="mm-mode-select">
      ${mmState.error ? `<div class="error-msg">${mmState.error}</div>` : ''}
      <button class="btn btn-primary mm-mode-btn" data-mode="ranked_1v1">\u2694\ufe0f RANKED 1v1</button>
      <button class="btn btn-secondary mm-mode-btn" data-mode="casual_1v1">\ud83c\udfae \u042d\u041d\u0413\u0418\u0419\u041d 1v1</button>

    </div>`;
  } else if (mmState.stage === 'searching') {
    const elapsed = mmState.searchStartedAt ? Math.floor((Date.now() - mmState.searchStartedAt) / 1000) : 0;
    const s = authState._stats || {};
    body = `<div class="mm-searching">
      <div class="mm-radar">
        <span class="mm-radar-ring mm-r1"></span><span class="mm-radar-ring mm-r2"></span><span class="mm-radar-ring mm-r3"></span>
        <span class="mm-radar-scan"></span>
